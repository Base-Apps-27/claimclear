          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                descriptionHtml:
                  type: string
                issueType:
                  type: string
                gpsBreadcrumbsAvailable:
                  type: string
                requesterEmail:
                  type: string
                transportationProviderName:
                  type: string
                phoneNumber:
                  type: string
                invoiceNumber:
                  type: string
                specialCircumstances:
                  type: string
                  description: Edited operator context. When this changes, `understandingReadback` is cleared server-side so a fresh re-check is required before regenerate.
                understandingReadback:
                  type: string
                  description: Updated AI readback the operator confirmed. Usually only sent together with the matching `specialCircumstances`.
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
