          type: string
          description: A short (1–3 sentence) plain-language paraphrase of the operator's note text alone, with no case context threaded in. Used to surface whether the AI understood the operator's wording before Generate Preview runs the full prompt.
        previewReadback:
          type: string
          description: Alias for `readback` returned alongside it for forward-compatibility with callers that want a more explicit name (the value is the same string).
        understandingReadbackForText:
          type: string
          description: Echo of the `specialCircumstances` text the readback was generated for. The UI uses this to compare against the live textarea contents to detect drift.
      required:
        - readback

