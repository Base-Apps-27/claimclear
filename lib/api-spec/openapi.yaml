      type: object
      properties:
        invoiceGroupId:
          type: integer
        specialCircumstances:
          type: string
          description: The operator's "Understanding notes" text — the ONLY content the framing-only readback prompt sees. Either this or the legacy `understandingReadback` may be supplied; both route through `resolveCustomContextNote`.
        understandingReadback:
          type: string
          description: Legacy alias for `specialCircumstances` (back-compat). Prefer `specialCircumstances` in new callers.

