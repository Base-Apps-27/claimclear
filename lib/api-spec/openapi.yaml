        - previousPeriodDays
        - drivers
        - members
        - driverGroupsTotal
        - memberGroupsTotal

    RepeatOffenderDriver:
      type: object
      properties:
        carNumber:
          type: string
        lastInvoiceNumber:
          type: ["string", "null"]
          description: "Most recent invoiceNumber filed for this carNumber in the window. (No per-driver name is stored on claims today, so this is what we surface as the driver descriptor.)"
        rejectionCount:
          type: integer
          description: "Count of claims with outcome=Denied for this carNumber in the window."
        previousRejectionCount:
          type: integer
          description: "Same as rejectionCount but for the prior equal-length window, used to compute trend."
        atRiskAmount:
          type: string
          description: "Sum of claim amounts of Denied claims in the window for this carNumber."
        topErrorTypeName:
          type: ["string", "null"]
          description: "Most common errorTypeName among Denied claims in the window."
        winRate:
          type: ["number", "null"]
          description: "Approved / (Approved + Denied) across all resolved claims (any outcome) for this carNumber in the window. Null when there are no resolved claims yet."
        trend:
          type: string
          enum: [up, down, flat]
        lastRejectionDate:
          type: ["string", "null"]
          description: "ISO date (YYYY-MM-DD) of the most recent service date among Denied claims in the window."
        weeklyBuckets:
          type: array
          description: "Rejection count per week over the last 8 weeks for this carNumber, oldest first. Index 7 is the current (in-progress) week. Independent of the `days` window so the trend stays comparable across range toggles."
          minItems: 8
          maxItems: 8
          items:
            type: integer
      required:
        - carNumber
        - lastInvoiceNumber
        - rejectionCount
        - previousRejectionCount
        - atRiskAmount
        - topErrorTypeName
        - winRate
        - trend
        - lastRejectionDate
        - weeklyBuckets

    RepeatOffenderMember:
      type: object
