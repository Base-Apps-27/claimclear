          type: integer
          nullable: true
        submissionId:
          type: integer
          nullable: true
        source:
          type: string
          enum: [email, portal, manual]
        responseType:
          type: string
          enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
        subject:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        rawContent:
          type: string
          nullable: true
        bodyFormat:
          type: string
          enum: [html, text]
          description: |
            Format of `content` / `rawContent`. `html` indicates the body is HTML and
            the UI should render it through a sanitizer; `text` (the default) renders
            with whitespace preserved.
        senderEmail:
          type: string
          nullable: true
        senderName:
          type: string
          nullable: true
        matchedVia:
          type: string
          nullable: true
        matchConfidence:
          type: string
          nullable: true
        portalTicketId:
          type: string
          nullable: true
        externalMessageId:
          type: string
          nullable: true
        conversationId:
          type: string
          nullable: true
        processed:
          type: boolean
        autoLinked:
          type: boolean
        aiSummary:
          type: string
          nullable: true
          description: AI-extracted 1-2 sentence summary of the email content. Null if AI classification was not run or failed.
        extractedAmount:
          type: string
          nullable: true
          description: Dollar amount mentioned in the email (e.g. "$45.20"), if any.
        extractedDeadline:
          type: string
          nullable: true
          description: Any deadline mentioned in the email body, in free-form text.
        requestedAction:
          type: string
          nullable: true
          description: Specific action the payor is requesting from the provider, if any.
        classifierSource:
          type: string
          enum: [keyword, ai, manual]
          description: Which classifier produced `responseType`. AI is preferred; keyword is the fallback when AI fails or isn't run; manual is set by reviewers.
        classifierConfidence:
          type: string
          nullable: true
          enum: [high, medium, low, null]
          description: AI's self-reported confidence in its classification, if classifierSource is "ai".
        metadata:
          type: object
          nullable: true
        receivedAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
          nullable: true

