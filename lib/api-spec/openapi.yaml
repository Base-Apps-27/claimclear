    DashboardSummary:
      type: object
      properties:
        pipeline:
          type: object
          properties:
            needsEvidence:
              type: integer
            portalQueued:
              type: integer
            awaitingResponse:
              type: integer
          required:
            - needsEvidence
            - portalQueued
            - awaitingResponse
        stats:
          type: object
          properties:
            total:
              type: integer
            new:
              type: integer
            resolved:
              type: integer
            denied:
              type: integer
            withdrawn:
              type: integer
            onHold:
              type: integer
            awaitingAttestation:
              type: integer
              description: "Resolved Approved-family invoice groups that still owe an off-system re-attestation in the payor portal."
            expired:
              type: integer
              description: "Invoice groups currently in `status=Expired`. Reported separately so the dashboard can surface a deadbook count without inflating any of the live workload counters above; excluded from `total` for the same reason."
            withdrawnByReason:
              type: object
              description: "Counts of Withdrawn invoice groups broken down by closure_reason."
              properties:
                cannot_dispute:
                  type: integer
                other:
                  type: integer
              required:
                - cannot_dispute
                - other
            deniedByReason:
              type: object
              description: "Counts of Denied invoice groups broken down by closure_reason."
              properties:
                denied_by_payor:
                  type: integer
                other:
                  type: integer
              required:
                - denied_by_payor
                - other
          required:
            - total
            - new
            - resolved
            - denied
            - withdrawn
            - onHold
            - withdrawnByReason
            - deniedByReason
        amounts:
          type: object
          properties:
            totalClaimed:
              oneOf: [{ type: string }, { type: "null" }]
              description: "`null` for clerk-role users (money scrubbed via `scrubDashboardAmounts`)."
            totalApproved:
              oneOf: [{ type: string }, { type: "null" }]
              description: "`null` for clerk-role users."
            totalExposure:
              oneOf: [{ type: string }, { type: "null" }]
              description: "Total financial exposure per unrecovered claim (claim + ~70% vendor prepayment). `null` for clerk-role users."
            totalLost:
              oneOf: [{ type: string }, { type: "null" }]
              description: "Total claimed dollar amount on invoice groups closed as Denied — money the practice will not recover. `null` for clerk-role users."
            vendorPrepayRate:
              type: number
              description: "Vendor prepayment rate (0.70 = 70%)"
            atRiskClaim:
              oneOf: [{ type: string }, { type: "null" }]
              description: "Raw open-claim dollars still in flight (in-workflow rows + final-state rows whose re-attestation hasn't settled). Excludes withdrawn / non-issue and any deadline-missed rows. `null` for clerk-role users."
            atRiskExposure:
              oneOf: [{ type: string }, { type: "null" }]
              description: "atRiskClaim × (1 + vendorPrepayRate). The full at-risk exposure (claim + driver prepay both still on the line). `null` for clerk-role users."
            atRiskGroups:
              type: integer
              description: "Count of invoice groups in the at-risk bucket."
            lostExpiredClaim:
              oneOf: [{ type: string }, { type: "null" }]
              description: "Total claim dollars on rows whose deadline slipped — literal Expired, On Hold past the 30-day filing deadline, or any row with re-attestation still pending past that same 30-day window from service date. Per the MAS rule, those trips are cancelled regardless of any verdict already on file. `null` for clerk-role users."
            lostExpiredExposure:
              oneOf: [{ type: string }, { type: "null" }]
              description: "lostExpiredClaim × (1 + vendorPrepayRate). `null` for clerk-role users."
            lostExpiredGroups:
              type: integer
              description: "Count of invoice groups in the expired/aged-out lost bucket."
            lostDeniedClaim:
              oneOf: [{ type: string }, { type: "null" }]
              description: "Sum of (totalAmount − approvedAmount) on rows with outcome Denied / Partially Approved AND re-attestation already settled. Until re-attest is settled the dollars stay in atRisk — re-attestation can still flip the outcome. `null` for clerk-role users."
            lostDeniedExposure:
              oneOf: [{ type: string }, { type: "null" }]
              description: "lostDeniedClaim × (1 + vendorPrepayRate). `null` for clerk-role users."
            lostDeniedGroups:
              type: integer
              description: "Count of invoice groups in the denied lost bucket."
            lostExposureTotal:
              oneOf: [{ type: string }, { type: "null" }]
              description: "lostExpiredExposure + lostDeniedExposure. Total Already-lost figure for tile display. `null` for clerk-role users."
            reclaimedApproved:
              oneOf: [{ type: string }, { type: "null" }]
              description: "Σ approvedAmount on rows that have reached their 'true end' — outcome is a positive verdict (Approved / Partially Approved) AND no leg is still in pending/queued attestation. Until re-attestation settles, the dollars stay in atRisk because the verdict can still flip. Denials contribute $0 by construction. RAW (no prepay multiplier — once approved AND attested, the payor remit washes the prepay through). Approved dollars on rows whose filing deadline slipped are EXCLUDED — they roll into lostExpired above as a full claim loss. `null` for clerk-role users."
            windowDays:
              type: integer
              description: "Length in days of the trailing window used by `netChangeRecovered` only (currently 7). The other money fields below are now ALL-TIME — they no longer use this value. Kept on the wire so the client can keep rendering the 'vs prior 7d' sub-label on the Net change tile without hard-coding."
            openInvoices:
              type: integer
              description: "Snapshot count of invoice groups currently in the at-risk bucket — same predicate as `atRiskGroups`. Exposed under the canonical name the Dashboard 'Open invoices' tile reads, and matches Insights' `atRiskGroupCount` for the same point in time."
            disputedAmount:
              oneOf:
                - type: string
                - type: "null"
              description: "ALL-TIME Σ invoice_groups.totalAmount over groups with outcome ∈ {Approved, Partially Approved, Denied, Withdrawn} (real disputes; excludes Pending / Non-Issue / No Action Needed). Recovery-rate denominator. No window. `null` for clerk-role users (money is scrubbed for low-trust roles via `scrubDashboardAmounts`)."
            recoveredAmount:
              oneOf:
                - type: string
                - type: "null"
              description: "ALL-TIME Σ invoice_groups.approvedAmount over groups with outcome ∈ {Approved, Partially Approved}. No phase or date gate — a win counts the moment the payor rules. The `confirmedRecoveredAmount` sub-line carries the slice where the payor's reattest has actually completed. `null` for clerk-role users."
            confirmedRecoveredAmount:
              oneOf:
                - type: string
                - type: "null"
              description: "ALL-TIME Σ approvedAmount on positive-outcome groups whose payor re-attestation has actually completed (`reattestCompletedAt IS NOT NULL`). Sub-line under the Recovered tile so the operator can distinguish 'won on paper' from 'paid back in the portal'. `null` for clerk-role users."
            priorRecoveredAmount:
              oneOf:
                - type: string
                - type: "null"
              description: "Σ approvedAmount over positive-outcome groups whose latest positive `portal_responses.received_at` falls in the prior `windowDays` slot (`[now − 2·windowDays, now − windowDays)`). Drives `netChangeRecovered`. `null` for clerk-role users."
            recoveryRate:
              oneOf:
                - type: integer
                - type: "null"
              description: "ALL-TIME recoveredAmount / disputedAmount × 100, rounded to the nearest integer percent server-side. `null` when nothing has been disputed yet. Also `null` for clerk-role users."
            netChangeRecovered:
              oneOf:
                - type: string
                - type: "null"
              description: "Δ recovered $ this `windowDays` vs prior `windowDays`. Anchored on `portal_responses.received_at` (the day the payor's positive verdict landed) so a win counts the moment it's recorded. Signed dollar string. `null` for clerk-role users."
          required:
            - windowDays
            - openInvoices
            - disputedAmount
            - recoveredAmount
            - confirmedRecoveredAmount
            - priorRecoveredAmount
            - recoveryRate
            - netChangeRecovered
        closedOutcomes:
          type: object
          description: |
            ALL-TIME counts of invoice groups by terminal outcome
            (`outcome != 'Pending'` OR `status = 'Expired'`). Backs the
            Dashboard "Outcomes" panel — decomposes the recovery-rate
            denominator across the entire history, not a 7d slice
            (which used to read 0/0/0/0/0 most weeks). `windowDays` is
            kept in the response for backward compat but is no longer
            meaningful for this panel; treat it as advisory only.
          properties:
            approved: { type: integer }
            partiallyApproved: { type: integer }
            denied: { type: integer }
            withdrawn: { type: integer }
            expired:
              type: integer
              description: "Resolved-in-window groups whose status is `Expired` (deadline-sweep closure). Surfaced explicitly so the deadline-loss path is visible alongside the outcome buckets."
            nonIssue: { type: integer }
            noActionNeeded: { type: integer }
            total: { type: integer }
            windowDays: { type: integer }
          required:
            - approved
            - partiallyApproved
            - denied
            - withdrawn
            - expired
            - nonIssue
            - noActionNeeded
            - total
            - windowDays
        expiringGroups:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringInvoiceGroup"
        urgentCount:
          type: integer
          description: "Number of expiring invoice groups whose deadline lands today or on the next business day (with weekend deadlines shifted back to Friday). Pre-submit only — i.e. the group's status is in the on-clock actionable set (`New`, `Needs Evidence`, `On Hold`, `Generating Email`). Submitted-but-stuck groups are partitioned into `submittedStuckCount` instead so the dashboard's two tiers add up cleanly."
        submittedStuckGroups:
          type: array
          description: "Task #352. Groups in the post-submit \"stuck\" status set (`Portal Queued`) whose effective filing deadline has already slipped without a payor acknowledgement. Same shape and date math as `expiringGroups`; the only difference is the status filter. Surfaced alongside `expiringGroups` so the dashboard can render the parallel \"stuck after submission\" tier without recomputing the deadline."
          items:
            $ref: "#/components/schemas/ExpiringInvoiceGroup"
        submittedStuckCount:
          type: integer
          description: "Task #352. Length of `submittedStuckGroups` — exposed as a top-level count so dashboard hero tiles don't have to derive it from the array. Disjoint from `urgentCount` because the underlying status sets don't overlap."
        recentGroups:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceGroupResponse"
        portalStats:
          type: object
          properties:
            pending:
              type: integer
            submitted:
              type: integer
            failed:
              type: integer
            successRate:
              type: string
          required:
            - pending
            - submitted
            - failed
            - successRate
        portalWorker:
          type: object
          properties:
            lastRun:
              oneOf:
                - $ref: "#/components/schemas/WorkerRunSummary"
                - type: "null"
            isRunning:
              type: boolean
            pendingDueCount:
              type: integer
            overdueCount:
              type: integer
          required:
            - lastRun
            - isRunning
            - pendingDueCount
            - overdueCount
        today:
          type: string
          description: |
            Server-clock "today" key (`YYYY-MM-DD`, server local time)
            used to stamp `urgentCount` and per-row `expiringGroups`
            urgency. The client compares this against the previously-
            seen value and invalidates deadline-driven query families on
            a mismatch, so urgency math refreshes on day rollover
            without a per-page midnight `setTimeout`.
      required:
        - pipeline
        - stats
        - amounts
        - expiringGroups
        - urgentCount
        - submittedStuckGroups
        - submittedStuckCount
        - recentGroups
        - portalStats
        - portalWorker
        - today

