      responses:
        "200":
          description: Claim marked as attested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/attest/queue:
    post:
      operationId: queueAttestationForClaim
      tags: [attestation]
      summary: Park the claim for someone with portal access to attest later
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
