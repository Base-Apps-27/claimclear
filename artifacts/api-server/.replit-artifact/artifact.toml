kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Schema push runs FIRST against the production DB so the new code never
# starts serving requests against an out-of-date schema. Without this step
# the post-burst columns (reattest_*, included_in_dispute, sub_status,
# attestation_*, mas_action_*, etc.) silently miss in production and every
# read returns 500. See May-1-2026 production incident.
args = ["sh", "-c", "pnpm --filter @workspace/db run push-force && PORT=5173 BASE_PATH='/' pnpm --filter @workspace/claimclear run build && pnpm --filter @workspace/api-server run build && PLAYWRIGHT_BROWSERS_PATH=./pw-browsers node artifacts/api-server/node_modules/playwright/cli.js install chromium"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
PLAYWRIGHT_BROWSERS_PATH = "./pw-browsers"

[services.production.health.startup]
path = "/api/healthz"
