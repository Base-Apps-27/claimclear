        bodyPreview:
          type: string
          nullable: true
          description: Short plain-text snippet of the message. Always safe to render as text — for HTML messages this is the stripped + collapsed version of `bodyHtml`.
        bodyFormat:
          type: string
          enum: [html, text]
          description: Format of the original message body. Inbound rows reflect what the payor sent; outbound rows are always `text` because the composer ships plain text.
        bodyHtml:
          type: string
          nullable: true
          description: Raw HTML body when `bodyFormat` is `html`. Null for text rows and outbound rows. Always sanitize on the client before rendering.
        timestamp:
          type: string
        responseId:
          type: integer
          nullable: true
          description: For inbound messages, the portal_responses row id (used to wire Approve / Deny / Mark Reviewed buttons).
        responseType:
          type: string
          enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
          nullable: true
        processed:
          type: boolean
          nullable: true
          description: Inbound only — true when staff has already actioned this response.
        aiSummary:
          type: string
          nullable: true
        extractedAmount:
          type: string
          nullable: true
        extractedDeadline:
          type: string
          nullable: true
        requestedAction:
          type: string
          nullable: true
        classifierSource:
          type: string
          nullable: true
        matchedVia:
          type: string
          nullable: true
        matchConfidence:
          type: string
          nullable: true
        claimId:
          type: integer
          nullable: true
          description: The claim this row was attached to. May differ from the claim being viewed when the conversation covers multiple sibling claims (a group dispute).
        siblingClaimRef:
          type: string
          nullable: true
          description: Set when this message belongs to a sibling claim in the same conversation. Holds the human-readable ref (e.g. "INV-1234") so the UI can render an "↳ also covers INV-1234" pill linking out.
        siblingClaimId:
          type: integer
          nullable: true
          description: Numeric id companion to siblingClaimRef, for navigation.
        attachmentNames:
          type: array
          items:
            type: string
          nullable: true
          description: |
            Outbound only. Filenames of files attached to this message in send
            order, so the thread bubble can render an "Attached: foo.pdf,
            bar.png" line. Null on inbound messages and on outbound rows sent
            before attachment names were tracked.
        attachments:
          type: array
          nullable: true
          description: |
            Outbound only. Structured attachment metadata (name, size,
            contentType, downloadUrl) for each file shipped with this reply.
            The download URL points back to object storage so staff can
            retrieve the original file from the thread bubble. Null on
            inbound rows and on legacy outbound rows that pre-date
            structured attachment tracking — those still expose
            `attachmentNames` for the chip label.
          items:
            type: object
            required: [name, contentType, downloadUrl]
            properties:
              name:
                type: string
              size:
                type: integer
                nullable: true
              contentType:
                type: string
              downloadUrl:
                type: string
                description: Server-side URL that streams the original file from object storage.

    EmailThreadConversation:
      type: object
      required: [conversationId, status, lastActivityAt, messages]
      properties:
        conversationId:
          type: string
        status:
          type: string
          enum: [awaiting_their_reply, needs_review, acknowledged_pending, resolved]
          description: |
            Per-thread status pill computed from the latest message + claim outcome:
            - awaiting_their_reply: we sent last
            - needs_review: latest inbound is a real (non-acknowledgment) response, not yet processed
            - acknowledged_pending: latest inbound is an acknowledgment (auto-ack)
            - resolved: the underlying claim/group is closed
        lastActivityAt:
          type: string
          description: Most recent message timestamp in this conversation.
        latestUnprocessedInboundId:
          type: integer
          nullable: true
          description: portal_responses.id of the latest unprocessed inbound; the UI anchors Approve / Deny / Mark Reviewed buttons here.
        latestSubject:
          type: string
          nullable: true
          description: Subject of the most recent message; useful for prefilling Reply.
        latestInboundSender:
          type: string
          nullable: true
          description: Email address of the most recent inbound sender; used to prefill Reply "To".
        messages:
          type: array
          items:
            $ref: '#/components/schemas/EmailThreadMessage'

    EmailThreadResponse:
      type: object
      required: [messages, conversationIds, conversations]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/EmailThreadMessage'
          description: Flat chronological list of every message across every conversation. Kept for backwards compatibility; new UIs should prefer `conversations`.
        conversationIds:
          type: array
          items:
            type: string
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/EmailThreadConversation'
          description: Messages grouped by Outlook conversationId, sorted by lastActivityAt descending.

