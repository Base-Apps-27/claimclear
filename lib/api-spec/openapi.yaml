  /claims/attestation-pending:
    get:
      operationId: listAttestationPending
      tags: [attestation]
      summary: List claims by attestation state (queue review surface)
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: ["pending", "queued", "completed"]
            default: "queued"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: List of claims in the requested attestation state
          content:
