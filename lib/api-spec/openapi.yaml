      properties:
        startedAt:
          type: string
        finishedAt:
          type: string
          nullable: true
        status:
          type: string
          enum: [running, completed, degraded, failed]
        message:
          type: string
          nullable: true
        considered:
          type: integer
          nullable: true
        scraped:
          type: integer
          nullable: true
        skipped:
          type: integer
          nullable: true
        errored:
          type: integer
          nullable: true
        newResponses:
          type: integer
          nullable: true

