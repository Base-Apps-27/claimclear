openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: |
    ClaimClear API specification.
    0.3.0 (Task #199 cutover): legacy per-claim/per-group `PATCH /workflow` stub
    endpoints removed. The `workflow_progress` JSONB column has been retired in
    favor of discrete per-leg + per-group state columns. Use the contracts task
    endpoints (per-leg context / SOP advance / verdict capture / group context /
    understanding readback / preview generation) instead.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: claims
    description: Claims management
  - name: errorTypes
    description: Error type management
  - name: notes
    description: Notes per claim
  - name: portalSubmissions
    description: Portal submission management
  - name: auditLogs
    description: Audit log viewing
  - name: botActivity
    description: Bot activity logs
  - name: presence
    description: Real-time presence
  - name: import
    description: Claims import
  - name: dashboard
    description: Dashboard summary
  - name: dailyBrief
    description: Daily brief email
  - name: ai
    description: AI features
  - name: anthropic
    description: Anthropic AI chat operations
  - name: errorDetailMappings
    description: Error detail to error type mappings
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: evidenceTypes
    description: Reusable evidence type library
  - name: claimEvidence
    description: Evidence collected for claims
  - name: appSettings
    description: Application settings
  - name: responses
    description: Portal and email response tracking
  - name: withdrawals
    description: Closure (withdrawal / non-issue) review queue
  - name: systemHealth
    description: System health, cron runs, connector status, bounces (admin)
  - name: search
    description: Universal cross-record header search

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - type: "null"
                required:
                  - user

  /auth/user/tour-state:
    get:
      operationId: getUserTourState
      tags: [auth]
      summary: Get the tour version this user has already completed
      responses:
        "200":
          description: Tour state for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourState"
        "401":
          description: Not authenticated
    patch:
      operationId: updateUserTourState
      tags: [auth]
      summary: Mark a tour version as seen by the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tourVersionSeen:
                  type: ["string", "null"]
              required:
                - tourVersionSeen
      responses:
        "200":
          description: Updated tour state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourState"
        "401":
          description: Not authenticated

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get current session (returns 401 if unauthenticated)
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required:
                  - user
        "401":
          description: Not authenticated

  /invoice-groups:
    get:
      operationId: listInvoiceGroups
      tags: [invoice-groups]
      summary: List invoice groups with filtering
      parameters:
        - name: status
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: outcome
          in: query
          description: Comma-separated list of outcomes to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorDetails
          in: query
          description: Filter by presence of an error description on the group
          schema:
            type: string
            enum: [empty, present]
        - name: importBatch
          in: query
          description: |
            Restrict to groups tagged with the given import batch id
            (`import_<timestamp>`). Drives the post-upload triage bridge
            screen, which lists only the groups produced by the just-
            completed import so the operator can route them without
            sifting through historical groups.
          schema:
            type: string
        - name: errorTypeId
          in: query
          description: Comma-separated list of error type IDs, use __unassigned__ for groups with no error type
          schema:
            type: string
        - name: errorTypeAssigned
          in: query
          description: When `true`, restrict to groups whose `errorTypeId` is set (post-classification). Used by the Verdict Pending workspace so the server total reflects the visible row set.
          schema:
            type: boolean
        - name: inboxHiddenBucket
          in: query
          description: |
            Restrict the result set to exactly one of the
            "hidden from the Responses Awaiting Review inbox" buckets.
            The predicate is shared with
            `/responses/awaiting-review/hidden-counts` so the chip count
            and this list can never disagree by construction.

            * `unclassified` — response-pending base cohort with no
              error type assigned and at least one response on file.
            * `awaitingPayorAgain` — classified, base cohort, currently
              suppressed by the "wait for payor again" flip.
            * `acknowledgmentOnly` — classified, base cohort, has
              responses but every one is acknowledgment / abstain
              (and not currently suppressed by `awaitingPayorAgain`).
          schema:
            type: string
            enum: [unclassified, awaitingPayorAgain, acknowledgmentOnly]
        - name: createdFrom
          in: query
          description: Filter groups created on or after this date (ISO 8601)
          schema:
            type: string
        - name: createdTo
          in: query
          description: Filter groups created on or before this date (ISO 8601)
          schema:
            type: string
        - name: amountMin
          in: query
          description: Filter groups with total amount >= this value
          schema:
            type: string
        - name: amountMax
          in: query
          description: Filter groups with total amount <= this value
          schema:
            type: string
        - name: expiring
          in: query
          description: Restrict to actionable groups whose filing deadline is within the named window. "soon" matches the dashboard Expiring Soon section (within 10 days, weekend-shifted). "urgent" is the narrower red-badge band (within 3 days).
          schema:
            type: string
            enum: [soon, urgent, stuck]
        - name: includeExpired
          in: query
          description: |
            When `true`, include groups with `status="Expired"` in the
            response. Off by default everywhere — the nightly 6 AM ET
            sweep retires past-deadline pre-submit rows so they recede
            from every workload list. Implicitly enabled if the caller
            already filtered to a status set that contains `Expired`.
          schema:
            type: boolean
        - name: macroPhase
          in: query
          description: |
            Filter groups by server-derived macro phase. `mas-action-required`
            returns groups that owe per-leg MAS cancellations, group-level
            re-attestation, or both. Drives the new MAS Action surfaces.
          schema:
            type: string
            enum: [pre-submit, in-flight, response-pending, mas-action-required, awaiting-payout, closed, on-hold]
        - name: missingServiceDate
          in: query
          description: |
            Restrict to groups whose `service_date` is null — i.e. the
            Service Date column would render an empty state. Pairs with
            `missingServiceDateReason` to drill into a specific reason.
            See Task #353 (`<ServiceDateCell />` and the
            `serviceDateReason` enum on every list row).
          schema:
            type: boolean
        - name: legSubStatus
          in: query
          description: |
            Comma-separated list of derived per-leg sub-status values
            (excluded, duplicate, needs_classification, investigating,
            blocked, ready, dropped, frozen). Restricts the result set to
            groups that contain at least one leg in any of the named
            sub-statuses. Mirrors the same vocabulary used by the
            per-claim `legSubStatus` filter on `/claims`. Intended to be
            surfaced only while the operator is on the Pre-submit
            (Action Required) tab — the post-submit phases bury the
            per-leg detail behind the group-level chip and have nothing
            actionable to scope to.
          schema:
            type: string
        - name: excludeReason
          in: query
          description: |
            Restricts the result set to groups containing at least one leg
            that was excluded with the named reason. Currently the only
            value is `handled_offline` (Task #689 — exclude path that
            stamps a distinct `claim_removed_handled_offline` audit row
            when an operator marks a claim handled outside the system).
            The Queue page surfaces this as a "Removed — handled offline"
            chip and the leg-detail removed banner deep-links here so an
            operator who lands on a single handled-offline leg can pivot
            to the full population.
          schema:
            type: string
            enum: [handled_offline]
        - name: draftReviewed
          in: query
          description: |
            Pre-submit-only sub-filter. When `true`, restricts the result
            set to groups whose dispute draft has been marked reviewed
            (`draft_reviewed_at IS NOT NULL`) — i.e. one click away from
            being queued for portal submission. When `false`, returns
            groups in pre-submit whose draft has NOT been marked reviewed
            yet (still needs the operator's sign-off). Intended to be
            surfaced only on the Pre-submit (Action Required) tab; the
            API stays permissive so deep links / scripts still work.
          schema:
            type: boolean
        - name: outlook
          in: query
          description: |
            Server-side equivalent of `deriveInvoiceDisputeOutlook`. Restricts
            the result set to groups matching the named outlook bucket:
              * `ready_to_review` — has_disputable outlook AND every disputed
                leg is in a resolved sub-status (ready/dropped/excluded).
                These groups are one operator action away from generating a
                submission preview.
              * `reattest_only` — zero disputable legs but at least one
                survivor leg (non-issue or approved) that still needs portal
                re-attestation. The group can be bulk-queued for re-attest
                without filing a portal dispute.
              * `nothing_to_do` — zero disputable legs AND zero survivors.
                Every leg is cannot_dispute, denied, or excluded. The group
                can be bulk-closed as Withdrawn.
          schema:
            type: string
            enum: [ready_to_review, reattest_only, nothing_to_do]
        - name: readyToGenerate
          in: query
          description: |
            When `true`, restricts the result set to groups whose legs are
            all in a resolved/packageable state (every non-held, non-duplicate
            leg has a terminal disposition, at least one contested leg, status
            in {New, Needs Evidence}) AND whose AI writeup has not yet been
            generated or has been generated but not yet marked reviewed.
            Mirrors `computeGroupReadiness` from `group-packaging.ts` so
            the filter stays in lockstep with the Gauntlet's gate.
          schema:
            type: boolean
        - name: serviceDateFrom
          in: query
          description: |
            Task #753. Restrict to groups whose earliest service date is on
            or after this ISO `YYYY-MM-DD`. Pairs with `serviceDateTo` to
            form a closed range. Used by the Responses Awaiting Review
            filter bar's "Date of service" facet.
          schema:
            type: string
        - name: serviceDateTo
          in: query
          description: |
            Task #753. Restrict to groups whose earliest service date is on
            or before this ISO `YYYY-MM-DD`. Pairs with `serviceDateFrom`.
          schema:
            type: string
        - name: responseReceivedFrom
          in: query
          description: |
            Task #753. Restrict to groups whose latest payor reply
            portal_response was received on or after this ISO
            `YYYY-MM-DD`. Drives the "Response received" facet on the
            Responses Awaiting Review page.
          schema:
            type: string
        - name: responseReceivedTo
          in: query
          description: |
            Task #753. Restrict to groups whose latest payor reply
            portal_response was received on or before this ISO
            `YYYY-MM-DD`. Pairs with `responseReceivedFrom`.
          schema:
            type: string
        - name: responseType
          in: query
          description: |
            Task #753. Comma-separated list of `responseType` values
            (`approval`, `denial`, `partial_approval`, `info_request`,
            `acknowledgment`, `other`). Restricts to groups whose latest
            payor reply (any responseType, including acknowledgment)
            matches one of the values.
          schema:
            type: string
        - name: clientNumber
          in: query
          description: |
            Task #753. Comma-separated list of payor/client numbers. Exact
            match against `invoice_groups.client_number`. Drives the
            "Payor / client" facet on the Responses Awaiting Review page.
          schema:
            type: string
        - name: carNumber
          in: query
          description: |
            Task #764 / #766. Comma-separated list of car numbers (we
            treat carNumber as the driver identifier, matching how
            Insights' Repeat Offenders section already works). Restricts
            to invoice groups that have at least one ride/claim whose
            carNumber matches any of the listed values (exact match, IN
            clause inside an EXISTS subquery). A single value preserves
            the original equality semantics. Drives the "Driver" filter
            on the invoice groups list page and the click-through from
            the Insights Repeat Offenders driver row.
          schema:
            type: string
        - name: q
          in: query
          description: |
            Task #753. Free-text search; alias of `search`. When both are
            sent, `q` wins. Matches invoice number, client number, error
            details, and error type name (case-insensitive substring).
          schema:
            type: string
        - name: missingServiceDateReason
          in: query
          description: |
            Sub-facet for `missingServiceDate=true`. Filters to groups in
            the named empty-state branch:
              * `no_claims` — no children attached at all
              * `no_dated_claims` — children exist, every `date` is blank
              * `parse_failed` — children have date strings but none parse
              * `all_dated_legs_excluded` — every dated leg is excluded
                or sibling-duplicate
            Implies `missingServiceDate=true` (no need to send both).
          schema:
            type: string
            enum: [no_claims, no_dated_claims, parse_failed, all_dated_legs_excluded]
        - name: sort
          in: query
          description: Column to sort by
          schema:
            type: string
            enum: [invoiceNumber, rideCount, clientNumber, errorTypeName, totalAmount, status, createdAt]
        - name: dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: include
          in: query
          description: |
            Comma-separated additional payloads to embed in the response.
            Currently supported values: `needs_classification` — embeds the
            Classification Inbox payload (groups containing legs in
            needs_classification sub-status, scoped to status=Needs Review)
            so the queue page can fetch the list and the inbox in a single
            round trip. Unknown values are silently ignored.
          schema:
            type: string
      responses:
        "200":
          description: Invoice groups list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupsListResponse"

    post:
      operationId: createInvoiceGroup
      tags: [invoice-groups]
      summary: Manually create an invoice group with one or more legs
      description: |
        Manual creation path used when an invoice didn't come through the
        bulk job-status import (one-off entries the operator types in).
        Creates the parent `invoice_groups` row and the child `claims`
        legs in a single transaction, mirroring the import flow's group +
        leg construction.

        If `attachToExistingId` is omitted and the supplied
        `invoiceNumber` already corresponds to an existing group, the
        endpoint returns `409 Conflict` with an `existingGroup` summary
        instead of creating a duplicate. Re-submit the same request with
        `attachToExistingId` set to the returned group's id to add the
        legs to the existing group.

        Clerks are denied (same role gate as bulk import / setup pages).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceGroupBody"
      responses:
        "201":
          description: Invoice group + legs created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceGroupResponse"
        "400":
          description: Validation error (missing invoiceNumber, no legs, missing confNumber on a leg, etc.)
        "403":
          description: Caller is a clerk; manual creation is gated to admin and user roles.
        "409":
          description: |
            An invoice group with the supplied `invoiceNumber` already
            exists and `attachToExistingId` was not provided. Body
            includes the existing group summary so the UI can prompt the
            operator to attach to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupConflictResponse"

  /invoice-groups/export-csv:
    get:
      operationId: exportInvoiceGroupsCsv
      tags: [invoice-groups]
      summary: Export invoice groups as CSV (all matching rows, respects same filters as list)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Free-text search (alias of `search`; wins when both sent)
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorDetails
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          schema:
            type: string
        - name: errorTypeAssigned
          in: query
          schema:
            type: boolean
        - name: clientNumber
          in: query
          schema:
            type: string
        - name: carNumber
          in: query
          schema:
            type: string
        - name: createdFrom
          in: query
          schema:
            type: string
        - name: createdTo
          in: query
          schema:
            type: string
        - name: serviceDateFrom
          in: query
          schema:
            type: string
        - name: serviceDateTo
          in: query
          schema:
            type: string
        - name: responseReceivedFrom
          in: query
          schema:
            type: string
        - name: responseReceivedTo
          in: query
          schema:
            type: string
        - name: responseType
          in: query
          schema:
            type: string
        - name: macroPhase
          in: query
          schema:
            type: string
        - name: inboxHiddenBucket
          in: query
          schema:
            type: string
        - name: amountMin
          in: query
          schema:
            type: string
        - name: amountMax
          in: query
          schema:
            type: string
        - name: expiring
          in: query
          schema:
            type: string
            enum: [soon, urgent, stuck]
        - name: includeExpired
          in: query
          description: When true, include rows with status=Expired in the export. Off by default.
          schema:
            type: boolean
        - name: outlook
          in: query
          schema:
            type: string
        - name: draftReviewed
          in: query
          schema:
            type: string
        - name: excludeReason
          in: query
          schema:
            type: string
        - name: legSubStatus
          in: query
          schema:
            type: string
        - name: readyToGenerate
          in: query
          schema:
            type: boolean
        - name: missingServiceDate
          in: query
          schema:
            type: boolean
        - name: missingServiceDateReason
          in: query
          schema:
            type: string
        - name: importBatch
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: dir
          in: query
          schema:
            type: string
        - name: columns
          in: query
          description: Comma-separated list of column keys to include in export
          schema:
            type: string
        - name: allFields
          in: query
          description: When true, include every column on the row object (raw dump)
          schema:
            type: boolean
        - name: filename
          in: query
          description: Caller-supplied filename (already filter-signed); server sanitises
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /invoice-groups/needs-classification:
    get:
      operationId: getNeedsClassificationInbox
      tags: [invoice-groups]
      summary: Classification Inbox summary — groups with at least one needs_classification leg
      description: |
        Feeds the collapsible Classification Inbox on the queue page.
        Returns groups currently in `New` or `Needs Review` that contain
        at least one `needs_classification` leg, with the per-claim payload
        (errorDetails, claimAmount, etc.) and a `qualifyingSiblingCount`
        flag indicating whether at least one sibling already carries an
        errorTypeId or non-empty errorDetails.
      responses:
        "200":
          description: Classification inbox payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsClassificationInboxResponse"

  /invoice-groups/attestation-history:
    get:
      operationId: getInvoiceGroupAttestationHistory
      tags: [invoice-groups]
      summary: Completed re-attestations history grouped by invoice group
      description: |
        Returns invoice groups whose `reattestCompletedAt` falls within the
        requested window, with each group's per-leg attestation outcomes.
        Drives the "Completed re-attestations" tab on the Attestation Queue
        page. Sorted by `reattestCompletedAt DESC` (most-recently-completed
        first). Capped at 200 groups; `truncated=true` flags an over-cap
        window so the UI can hint the operator to narrow the range.
      parameters:
        - name: range
          in: query
          description: |
            Trailing window for `reattestCompletedAt`. `7d` (default) covers
            the last 7 days, `30d` the last 30 days, and `all` skips the
            window filter entirely (still capped at 200 groups).
          schema:
            type: string
            enum: ["7d", "30d", "all"]
            default: "7d"
      responses:
        "200":
          description: Completed re-attestation history payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupAttestationHistoryResponse"
        "401":
          description: Not authenticated

  /invoice-groups/{id}:
    get:
      operationId: getInvoiceGroup
      tags: [invoice-groups]
      summary: Get invoice group with rides
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice group details with rides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupDetailResponse"
        "404":
          description: Not found
    patch:
      operationId: updateInvoiceGroup
      tags: [invoice-groups]
      summary: Update an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceGroupBody"
      responses:
        "200":
          description: Updated invoice group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
    # Task #411 audit, Tier 5: `DELETE /invoice-groups/{id}` was removed
    # from the spec because the route had no UI caller (no admin
    # destructive-action page existed) and an orphan mutation violates
    # the endpoint-action contract rule. Re-add alongside the UI that
    # calls it if a real admin surface ships.

  /invoice-groups/{id}/status:
    patch:
      operationId: updateInvoiceGroupStatus
      tags: [invoice-groups]
      summary: Update invoice group status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                reason:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/outcome:
    patch:
      operationId: updateInvoiceGroupOutcome
      tags: [invoice-groups]
      summary: Update invoice group outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceGroupOutcomeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/mark-mas-eligible:
    post:
      operationId: markInvoiceGroupMasEligible
      tags: [invoice-groups]
      summary: Mark an invoice group as MAS Eligible
      description: >
        Transitions the group to status="MAS Eligible" and engages the
        attestation cascade as a side-effect (sets reattest_required=true
        on the group and attestation_state="pending" on every disputed,
        non-held leg). Used by the post-upload triage bridge UI so an
        operator can route a freshly-imported batch's eligible groups
        straight into the attestation queue without going through the
        generic PATCH /status path. Returns the updated group plus
        `attestationsEngaged` (count of legs now in pending state).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional audit-trail note. Defaults to "Marked MAS Eligible from post-upload bridge".
      responses:
        "200":
          description: Updated group with attestation engagement count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InvoiceGroupResponse"
