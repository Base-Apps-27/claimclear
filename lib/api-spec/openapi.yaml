openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: |
    ClaimClear API specification.
    0.3.0 (Task #199 cutover): legacy per-claim/per-group `PATCH /workflow` stub
    endpoints removed. The `workflow_progress` JSONB column has been retired in
    favor of discrete per-leg + per-group state columns. Use the contracts task
    endpoints (per-leg context / SOP advance / verdict capture / group context /
    understanding readback / preview generation) instead.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: claims
    description: Claims management
  - name: errorTypes
    description: Error type management
  - name: notes
    description: Notes per claim
  - name: portalSubmissions
    description: Portal submission management
  - name: auditLogs
    description: Audit log viewing
  - name: botActivity
    description: Bot activity logs
  - name: presence
    description: Real-time presence
  - name: import
    description: Claims import
  - name: dashboard
    description: Dashboard summary
  - name: dailyBrief
    description: Daily brief email
  - name: ai
    description: AI features
  - name: anthropic
    description: Anthropic AI chat operations
  - name: errorDetailMappings
    description: Error detail to error type mappings
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: evidenceTypes
    description: Reusable evidence type library
  - name: claimEvidence
    description: Evidence collected for claims
  - name: appSettings
    description: Application settings
  - name: responses
    description: Portal and email response tracking
  - name: withdrawals
    description: Closure (withdrawal / non-issue) review queue
  - name: systemHealth
    description: System health, cron runs, connector status, bounces (admin)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - type: "null"
                required:
                  - user

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get current session (returns 401 if unauthenticated)
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required:
                  - user
        "401":
          description: Not authenticated

  /invoice-groups:
    get:
      operationId: listInvoiceGroups
      tags: [invoice-groups]
      summary: List invoice groups with filtering
      parameters:
        - name: status
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: outcome
          in: query
          description: Comma-separated list of outcomes to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorDetails
          in: query
          description: Filter by presence of an error description on the group
          schema:
            type: string
            enum: [empty, present]
        - name: errorTypeId
          in: query
          description: Comma-separated list of error type IDs, use __unassigned__ for groups with no error type
          schema:
            type: string
        - name: createdFrom
          in: query
          description: Filter groups created on or after this date (ISO 8601)
          schema:
            type: string
        - name: createdTo
          in: query
          description: Filter groups created on or before this date (ISO 8601)
          schema:
            type: string
        - name: amountMin
          in: query
          description: Filter groups with total amount >= this value
          schema:
            type: string
        - name: amountMax
          in: query
          description: Filter groups with total amount <= this value
          schema:
            type: string
        - name: expiring
          in: query
          description: Restrict to actionable groups whose filing deadline is within the named window. "soon" matches the dashboard Expiring Soon section (within 10 days, weekend-shifted). "urgent" is the narrower red-badge band (within 3 days).
          schema:
            type: string
            enum: [soon, urgent]
        - name: macroPhase
          in: query
          description: |
            Filter groups by server-derived macro phase. `mas-action-required`
            returns groups that owe per-leg MAS cancellations, group-level
            re-attestation, or both. Drives the new MAS Action surfaces.
          schema:
            type: string
            enum: [pre-submit, in-flight, response-pending, mas-action-required, awaiting-payout, closed, on-hold]
        - name: sort
          in: query
          description: Column to sort by
          schema:
            type: string
            enum: [invoiceNumber, rideCount, clientNumber, errorTypeName, totalAmount, status, createdAt]
        - name: dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: include
          in: query
          description: |
            Comma-separated additional payloads to embed in the response.
            Currently supported values: `needs_classification` — embeds the
            Classification Inbox payload (groups containing legs in
            needs_classification sub-status, scoped to status=Needs Review)
            so the queue page can fetch the list and the inbox in a single
            round trip. Unknown values are silently ignored.
          schema:
            type: string
      responses:
        "200":
          description: Invoice groups list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupsListResponse"

  /invoice-groups/export-csv:
    get:
      operationId: exportInvoiceGroupsCsv
      tags: [invoice-groups]
      summary: Export invoice groups as CSV (all matching rows, respects same filters as list)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorDetails
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          schema:
            type: string
        - name: createdFrom
          in: query
          schema:
            type: string
        - name: createdTo
          in: query
          schema:
            type: string
        - name: amountMin
          in: query
          schema:
            type: string
        - name: amountMax
          in: query
          schema:
            type: string
        - name: expiring
          in: query
          schema:
            type: string
            enum: [soon, urgent]
        - name: sort
          in: query
          schema:
            type: string
        - name: dir
          in: query
          schema:
            type: string
        - name: columns
          in: query
          description: Comma-separated list of column keys to include in export
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /invoice-groups/needs-classification:
    get:
      operationId: getNeedsClassificationInbox
      tags: [invoice-groups]
      summary: Classification Inbox summary — groups with at least one needs_classification leg
      description: |
        Feeds the collapsible Classification Inbox on the queue page.
        Returns groups currently in `New` or `Needs Review` that contain
        at least one `needs_classification` leg, with the per-claim payload
        (errorDetails, claimAmount, etc.) and a `qualifyingSiblingCount`
        flag indicating whether at least one sibling already carries an
        errorTypeId or non-empty errorDetails.
      responses:
        "200":
          description: Classification inbox payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsClassificationInboxResponse"

  /invoice-groups/{id}:
    get:
      operationId: getInvoiceGroup
      tags: [invoice-groups]
      summary: Get invoice group with rides
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice group details with rides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupDetailResponse"
        "404":
          description: Not found
    patch:
      operationId: updateInvoiceGroup
      tags: [invoice-groups]
      summary: Update an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceGroupBody"
      responses:
        "200":
          description: Updated invoice group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
    delete:
      operationId: deleteInvoiceGroup
      tags: [invoice-groups]
      summary: Delete an invoice group and its rides
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoice-groups/{id}/package:
    post:
      operationId: packageInvoiceGroup
      tags: [invoice-groups]
      summary: Package an invoice group (operator-driven flip to Generating Email)
      description: >
        Operator-driven transition out of pre-submit. Gated by the
        readiness rules in lib/group-packaging.ts: every non-held leg
        must have a sop_outcome set and at least one leg must be
        contestable (sop_outcome IN portal_dispute|dispute). On success
        the group moves to Generating Email and the standard
        downstream draft/submit flow takes over.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group successfully packaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "404":
          description: Invoice group not found
        "409":
          description: Group is not ready to package (not pre-submit, has unprocessed legs, or no contestable legs)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  packagingReadiness:
                    $ref: "#/components/schemas/GroupPackagingReadiness"
                required:
                  - error

  /invoice-groups/{id}/status:
    patch:
      operationId: updateInvoiceGroupStatus
      tags: [invoice-groups]
      summary: Update invoice group status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                reason:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/outcome:
    patch:
      operationId: updateInvoiceGroupOutcome
      tags: [invoice-groups]
      summary: Update invoice group outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceGroupOutcomeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/triage:
    post:
      operationId: triageInvoiceGroup
      tags: [invoice-groups]
      summary: Triage an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                triageOutcome:
                  type: string
                  enum: ["non_issue", "issue_found"]
                errorTypeId:
                  type: string
                errorTypeName:
                  type: string
                notes:
                  type: string
              required:
                - triageOutcome
      responses:
        "200":
          description: Triaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/hold:
    post:
      operationId: holdInvoiceGroup
      tags: [invoice-groups]
      summary: Place invoice group on hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
    delete:
      operationId: removeInvoiceGroupHold
      tags: [invoice-groups]
      summary: Remove hold from invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hold removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/bulk-assign-error-type:
    post:
      operationId: bulkAssignInvoiceGroupErrorType
      tags: [invoice-groups]
      summary: Bulk assign error type to invoice groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items:
                    type: integer
                errorTypeId:
                  type: string
                errorTypeName:
                  type: string
              required:
                - groupIds
                - errorTypeId
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: integer

  /invoice-groups/{id}/valid-transitions:
    get:
      operationId: getInvoiceGroupValidTransitions
      tags: [invoice-groups]
      summary: Get valid transitions for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Valid transitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidTransitionsResponse"

  /invoice-groups/{id}/evidence:
    get:
      operationId: listInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: List evidence collected for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimEvidenceResponse"
                required:
                  - evidence
    post:
      operationId: addInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: Add evidence to an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClaimEvidenceBody"
      responses:
        "201":
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvidenceResponse"

  /invoice-groups/{id}/evidence/{evidenceId}:
    delete:
      operationId: deleteInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: Delete evidence from an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /invoice-groups/{id}/group-context:
    post:
      operationId: setGroupContext
      tags: [invoice-groups]
      summary: Record the operator's group-level context narrative
      description: Pre-submit only. Replaces any existing `groupContext`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGroupContextBody"
      responses:
        "200":
          description: Group context updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/understanding-readback:
    post:
      operationId: confirmUnderstandingReadback
      tags: [invoice-groups]
      summary: Operator confirms the dispute understanding readback sentence
      description: |
        Source-state: pre-submit AND every disputed leg has a resolved
        sub-status (`ready | dropped | excluded`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReadbackBody"
      responses:
        "200":
          description: Readback confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/preview-generated:
    post:
      operationId: stampPreviewGenerated
      tags: [invoice-groups]
      summary: Stamp that the dispute preview was generated
      description: |
        Source-state: pre-submit AND `understandingReadbackAt` is set AND
        every disputed leg is resolved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Preview generation stamped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/reattest/complete:
    post:
      operationId: completeGroupReattest
      tags: [invoice-groups]
      summary: Operator stamps that the group's MAS re-attest is complete
      description: |
        This is the trigger gate for attestation. Source-state contract:
        `reattest_required = true`, `reattest_completed_at IS NULL`, and
        every leg owing a MAS cancel must have completed it. On success,
        every disputed child whose latest operator-confirmed verdict is
        Approved/Partial graduates from `not_required` to `pending`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteReattestBody"
      responses:
        "200":
          description: Re-attest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/email-thread:
    get:
      operationId: getInvoiceGroupEmailThread
      tags: [invoice-groups]
      summary: Group-level email thread (aggregates per-claim threads)
      description: |
        Returns every inbound payor message and outbound staff reply attached
        to this invoice group OR to any of its child claims, plus any
        sibling-claim rows that share an Outlook conversation with the
        group's scope. Same `EmailThreadResponse` shape used by the per-claim
        endpoint, so the UI can render a unified group thread without a new
        type. Each message's `claimId` carries the leg the row originally
        belonged to (null when only attached at the group level).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group email thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadResponse'
        '404':
          description: Invoice group not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /invoice-groups/{id}/email-thread/{conversationId}/reply:
    post:
      operationId: replyToInvoiceGroupEmailConversation
      tags: [invoice-groups]
      summary: Send an in-app reply on a group-level email conversation
      description: |
        Group-level analogue of `POST /claims/:id/email-thread/:conversationId/reply`.
        Posts a reply to the latest message in the given Outlook conversation
        via Microsoft Graph, persists an outbound_emails row tagged with this
        invoice group's id, and writes an `email_reply_sent` audit row on the
        group. Authorization: the conversation must include at least one row
        attached to the group itself or to one of its child claims. Evidence
        attachments are not supported on the group-level reply yet.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, bodyText, to]
              properties:
                subject:
                  type: string
                bodyText:
                  type: string
                  description: Plain-text body. Sent as text/plain to Graph; line breaks preserved.
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Reply sent — returns the persisted outbound row so the UI can optimistically render it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessage'
        '400':
          description: Validation error or no recipients on file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Group or conversation not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: Microsoft Graph rejected the send. Body is preserved client-side so staff can retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims with filtering
      parameters:
        - name: status
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: outcome
          in: query
          description: Comma-separated list of outcomes to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          description: Comma-separated list of error type IDs, use __unassigned__ for claims with no error type
          schema:
            type: string
        - name: createdFrom
          in: query
          description: Filter claims created on or after this date (ISO 8601)
          schema:
            type: string
        - name: createdTo
          in: query
          description: Filter claims created on or before this date (ISO 8601)
          schema:
            type: string
        - name: amountMin
          in: query
          description: Filter claims with amount >= this value
          schema:
            type: string
        - name: amountMax
          in: query
          description: Filter claims with amount <= this value
          schema:
            type: string
        - name: serviceDateFrom
          in: query
          description: Filter claims with service date on or after this date (YYYY-MM-DD)
          schema:
            type: string
        - name: serviceDateTo
          in: query
          description: Filter claims with service date on or before this date (YYYY-MM-DD)
          schema:
            type: string
        - name: carNumber
          in: query
          description: Filter claims to a specific car/vehicle number (exact match).
          schema:
            type: string
        - name: clientNumber
          in: query
          description: Filter claims to a specific client/member number (exact match).
          schema:
            type: string
        - name: expiring
          in: query
          description: Restrict to actionable claims whose filing deadline is within the named window. "soon" matches the dashboard Expiring Soon section (within 10 days, weekend-shifted). "urgent" is the narrower red-badge band (within 3 days).
          schema:
            type: string
            enum: [soon, urgent]
        - name: legSubStatus
          in: query
          description: Comma-separated list of derived per-leg sub-status values (excluded, needs_classification, investigating, blocked, ready, dropped, frozen). `frozen` filters legs whose parent invoice group is past pre-submit (in-flight, response-pending, on-hold, closed).
          schema:
            type: string
        - name: sort
          in: query
          description: Column to sort by
          schema:
            type: string
            enum: [confNumber, date, clientNumber, errorTypeName, claimAmount, status, createdAt]
        - name: dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
