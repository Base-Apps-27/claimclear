        jobName:
          type: string
          description: Underlying cron_runs.job_name this bot reads from.
        status:
          type: string
          enum: [healthy, degraded, down]
        statusReason:
          type: string
          nullable: true
          description: One-line explanation of the current status pill.
        lastSuccessAt:
          type: string
          nullable: true
        lastFailureAt:
