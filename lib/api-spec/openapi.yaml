    UpdateClaimOutcomeBody:
      type: object
      description: |
        Body for `PATCH /claims/{id}/outcome`. The closure detail fields
        (closureCategory, closureRootCause, closureNarrative,
        closureAccountabilityTags, etc.) are required when the outcome is
        "Withdrawn" with reason "cannot_dispute" or "Non-Issue" and are
        validated by the canonical `CreateClosureRequest` payload.
      properties:
        outcome:
          type: string
        closureReason:
          $ref: "#/components/schemas/ClosureReason"
        approvedAmount:
          type: string
        invoiceNumbers:
          type: string
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosureAccountabilityTag"
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        closureResponsibility:
          oneOf:
            - $ref: "#/components/schemas/ClosureResponsibility"
            - type: "null"
          description: "Task #888 — canonical responsibility recorded by the slim closure modal. When present, the server derives `closureAccountabilityTags` and (when omitted) defaults `closureRootCause` to `unspecified`, so the older required-field guards (driver/dispatcher lists, ≥80-char narrative, communicated-to, tag chips) are skipped."
        override:
          $ref: "#/components/schemas/TerminalCloseOverride"
      required:
        - outcome

    TerminalCloseOverride:
      type: ["object", "null"]
      description: |
        Task #758 — terminal-closure override. Supply when the operator
        is closing a leg or group into a terminal outcome (Denied,
        Approved, Partially Approved, Non-Issue, Withdrawn, No Action
        Needed) from a source status whose normal outcome envelope does
        not permit it (e.g. Ready to Review, Portal Queued, Generating
        Email, On Hold, Awaiting Response → Non-Issue). The reason is
        required (≥20 chars), recorded in the audit-log metadata as
        `override:{applied,sourceStatus,targetOutcome,reason}` and
        appended to the lifecycle note. Omitted on the normal lane.
      properties:
        reason:
          type: string
          minLength: 20
      required:
        - reason

    UpdateInvoiceGroupOutcomeBody:
      type: object
      description: |
        Body for `PATCH /invoice-groups/{id}/outcome`. Same closure detail
        contract as `UpdateClaimOutcomeBody`.
      properties:
        outcome:
          type: string
        closureReason:
          $ref: "#/components/schemas/ClosureReason"
        approvedAmount:
          type: string
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosureAccountabilityTag"
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        closureResponsibility:
          oneOf:
            - $ref: "#/components/schemas/ClosureResponsibility"
            - type: "null"
          description: "Task #888 — same contract as `UpdateClaimOutcomeBody.closureResponsibility`."
        override:
          $ref: "#/components/schemas/TerminalCloseOverride"
      required:
        - outcome

    ClosurePersonRef:
      type: object
      description: A person referenced from a structured closure (driver/dispatcher).
      properties:
        name:
          type: string
        id:
          type: ["string", "null"]
      required:
        - name

    ClosureAccountabilityTag:
      type: string
      description: |
        Canonical set of accountability tags recorded on a structured
        closure. Defined once here so every request and response schema
        sees the exact same generated TypeScript union — adding a tag in
        one place without updating the others becomes a typecheck error
        instead of a silent runtime drift.
      enum:
        - driver
        - dispatcher
        - member
        - it_system
        - our_staff
        - external_payor
        - other

    ClosureReason:
      type: string
      description: |
        Canonical set of structured-closure reasons. Defined once here so
        every request schema that accepts a closure decision
        (UpdateClaimOutcomeBody, UpdateInvoiceGroupOutcomeBody,
        CreateClosureRequest) generates the exact same TypeScript union —
        a typo or drift between sites becomes a typecheck error instead
        of a silent coercion through `as` casts at the call site.
      enum:
        - denied_by_payor
        - cannot_dispute
        - non_issue

    ClosureResponsibility:
      type: string
      description: |
        Task #888 — five-value canonical responsibility recorded by the
        slim closure intake modal. Mirrors `@workspace/closure-responsibility`.
        Each value maps to exactly one supervisor "responsible role":
        agent_mistake → Contact Center Manager,
        driver_mistake → Contractor Relations Coordinator,
        system_error / external_payor / no_one_process_limit → IT Coordinator / COO.
      enum:
        - agent_mistake
        - driver_mistake
        - system_error
        - external_payor
        - no_one_process_limit

    EvidenceFileRef:
      type: object
      description: |
        Single attachment row stored on a claim's, invoice group's, or
        portal submission's `evidenceFiles` JSONB column. The row points
        at an object-storage URL plus optional rendering metadata. The
        bot worker (via `collectGroupEvidenceUrls` in
        `routes/portal-submissions.ts`) and the submission preview
        drawer (`portal-submission-drawer.tsx`) both read this shape.
      properties:
        url:
          type: string
          description: Object-storage URL for the attachment. The bot worker only forwards URLs that start with `/objects/` (anything else is dropped to prevent uncontrolled outbound requests).
        name:
          type: ["string", "null"]
          description: Original filename. Optional; the drawer falls back to deriving a name from the URL when not present.
        size:
          type: ["number", "null"]
          description: File size in bytes. Optional; rendered as `47 KB` / `2.3 MB` chips next to attachments in the submission drawer.
      required:
        - url

    PayorDenialReasonCode:
      type: string
      description: |
        Stable machine code for the lightweight payor-denial-reason signal
        captured on the Responses Awaiting Review page (Task #321). Mirrored
        in the `@workspace/payor-denial-reasons` package — kept in lockstep
        by `payor-denial-reason.parity.ts` on the server. Distinct from
        `closureReason`; this is NOT a closure decision.
      enum:
        - payor_rejected_gps
        - payor_rejected_signature
        - payor_reclassified_error
        - payor_cited_benefit_rule
        - payor_cited_timely_filing
        - payor_no_clear_reason
        - payor_other

    RecordPayorDenialReasonRequest:
      type: object
      required: [reason]
      description: |
        Body for `POST /invoice-groups/{id}/payor-denial-reason`. `note` is
        required (and must be non-whitespace) when `reason === "payor_other"`;
        ignored otherwise on the API contract level (still persisted as the
        free-text note for any reason).
      properties:
        reason:
          $ref: "#/components/schemas/PayorDenialReasonCode"
        note:
          type: ["string", "null"]
          description: Required when `reason === "payor_other"`.

    MarkAwaitingPayorAgainRequest:
      type: object
      description: |
        Body for `POST /invoice-groups/{id}/awaiting-payor-again`. The
        optional `note` is a free-text reason ("operator clicked because the
        ticket was reopened on MAS") persisted into the audit row's metadata
        and surfaced in the timeline next to the flip stamp.
      properties:
        note:
          type: ["string", "null"]
          description: |
            Optional operator note explaining why the row is being flipped
            back to awaiting-payor-again. Trimmed server-side; whitespace-only
            strings collapse to null and are not persisted.

    ClosureReviewBody:
      type: object
      description: Editable post-closure review fields.
      properties:
        closureReviewNotes:
          type: ["string", "null"]
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        addressed:
          type: boolean
          description: Convenience flag — when true, sets closureReviewState=acknowledged and stamps closureAddressedAt/By; when false, clears those fields.

    WithdrawalRow:
      type: object
      description: A unified row representing a closed claim or invoice group.
      properties:
        kind:
          type: string
          enum: [claim, invoice_group]
        id:
          type: integer
        identifier:
          type: string
          description: Conf # for claims, invoice number for groups.
        clientNumber:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        outcome:
          type: string
        closureReason:
          type: string
          enum: [cannot_dispute, non_issue, denied_by_payor]
        closureCategory:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureResponsibility:
          oneOf:
            - $ref: "#/components/schemas/ClosureResponsibility"
            - type: "null"
          description: "Task #888 — canonical responsibility recorded by the slim closure modal. Null on legacy rows that pre-date the column or that the backfill could not classify."
        amount:
          type: ["string", "null"]
        closedAt:
          type: ["string", "null"]
        closedBy:
          type: ["string", "null"]
          description: User id of the staff member who closed this item, derived from the latest closure-related audit log. Null if the closer can no longer be resolved.
        closedByName:
          type: ["string", "null"]
          description: Display name of the staff member who closed this item.
        closedByEmail:
          type: ["string", "null"]
          description: Email of the staff member who closed this item.
        closureReviewState:
          type: ["string", "null"]
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
          description: Email of the responsible-party supervisor who acknowledged this closure (Task #889). Null until acknowledged.
        addressed:
          type: boolean
      required:
        - kind
        - id
        - identifier
        - outcome
        - closureReason
        - addressed

    WithdrawalsListResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WithdrawalRow"
        total:
          type: integer
        counts:
          type: object
          description: Total counts per closure reason across the entire (unfiltered) dataset.
          properties:
            cannot_dispute:
              type: integer
            non_issue:
              type: integer
            denied_by_payor:
              type: integer
            addressed:
              type: integer
          required: [cannot_dispute, non_issue, denied_by_payor, addressed]
        closers:
          type: array
          description: Distinct closers across the dataset (ignoring the closedBy and hideAddressed filters), used to populate the "Closed by" facet.
          items:
            $ref: "#/components/schemas/WithdrawalCloser"
      required:
        - rows
        - total
        - counts
        - closers

    WithdrawalCloser:
      type: object
      description: A staff member who has closed at least one withdrawal in the current filter set.
      properties:
        id:
          type: string
          description: Stable id for the closer — the user's uuid when known, otherwise the closer's email.
        displayName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
      required:
        - id

    BulkAddressBody:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [claim, invoice_group]
              id:
                type: integer
            required: [kind, id]
        addressed:
          type: boolean
          description: When true, mark all items addressed. When false, clear addressed state.
      required: [items, addressed]

    BulkAddressResponse:
      type: object
      properties:
        updated:
          type: integer
      required: [updated]

    CreateClosureRequest:
      type: object
      description: |
        Canonical payload for filing a structured closure (Withdraw or
        Non-Issue). Used by `PATCH /claims/{id}/outcome` and
        `PATCH /invoice-groups/{id}/outcome` when staff are recording
        a structured closure (vs. a bare outcome change).

        Required fields when `closureReason` is `cannot_dispute` or `non_issue`:
          - closureCategory (string; if "other", closureCategoryOther required)
          - closureRootCause (string; if "other", closureRootCauseOther required)
          - closureNarrative (string, ≥80 chars)
          - closureAccountabilityTags (≥1 entry; if includes "other",
            closureAccountabilityOther required)
          - closureDrivers (≥1 with name) when tags includes "driver"
          - closureDispatchers (≥1 with name) when tags includes "dispatcher"

        For `denied_by_payor`, the structured detail fields stay optional.
      properties:
        outcome:
          type: string
          enum: ["Withdrawn", "Non-Issue"]
        closureReason:
          $ref: "#/components/schemas/ClosureReason"
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosureAccountabilityTag"
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        invoiceNumbers:
          type: ["string", "null"]
      required:
        - outcome
        - closureReason

    AttachClosureEvidenceBody:
      type: object
      description: |
        Body for `POST /claim-evidence/closure`. Provide exactly one of `claimId`
        or `invoiceGroupId`. The server always writes `closureScope = "closure"`
        for rows created here; tree-scoped evidence belongs on
        `POST /claim-evidence`. `imageUrl` is required.
      properties:
        claimId:
          type: ["integer", "null"]
        invoiceGroupId:
          type: ["integer", "null"]
        evidenceTypeId:
          type: ["integer", "null"]
        evidenceTypeName:
          type: string
        treeNodeId:
          type: ["string", "null"]
        imageUrl:
          type: string
        notes:
          type: ["string", "null"]
        closureReasonAtAttach:
          type: ["string", "null"]
          enum: ["denied_by_payor", "cannot_dispute", "non_issue", null]
      required:
        - evidenceTypeName
        - imageUrl

    UpdateClaimEvidenceBody:
      type: object
      properties:
        evidenceFiles:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceFileRef"
        evidenceNotes:
          type: string
        evidenceChecklist:
          type: object
          additionalProperties:
            type: boolean

    PlaceHoldBody:
      type: object
      description: |
        Body for `POST /claims/{id}/hold`. The legacy `holdReason` /
        `holdPendingFrom` fields remain accepted for backward compatibility,
        but new clients should use `reason` (one of the pinned
        `LEG_HOLD_REASONS` vocabulary in the schema) and the optional `note`.
      properties:
        reason:
          type: string
          description: One of the pinned LEG_HOLD_REASONS values.
        note:
          type: ["string", "null"]
        holdReason:
          type: string
          deprecated: true
          description: Legacy alias for `reason`.
        holdPendingFrom:
          type: ["string", "null"]
          deprecated: true
          description: Legacy free-text field; superseded by `note`.

    StateConflictResponse:
      type: object
      description: |
        Returned with status 409 when an endpoint's source-state contract is
        violated. `expectedState` is a human-readable description of the
        states from which the action is allowed; `actualState` is the leg or
        group's current derived state.
      required: [error, expectedState, actualState]
      properties:
        error:
          type: string
        reason:
          type: string
          description: |
            Optional stable machine-readable reason code that callers can
            branch on. Currently set on `POST /claims/{id}/verdict` when a
            leg pre-dates the invoice-group flow (`leg_not_in_submission`)
            so the UI can offer the reconcile path.
        expectedState:
          type: string
        actualState:
          type: string
        validOptions:
          type: array
          items:
            type: string
          description: Optional list of valid SOP answers when the conflict was about an unknown answer.

    ClassifyLegBody:
      type: object
      required: [errorTypeId]
      properties:
        errorTypeId:
          type: string
          description: The numeric error-type id (sent as a string for transport stability).

    SopAdvanceBody:
      type: object
      required: [nodeId, answer]
      properties:
        nodeId:
          type: string
        answer:
          type: string

    SopRewindAction:
      type: string
      enum: [back-step, jump, restart]
      description: |
        Identifies a per-leg rewind action (Task #525). `back-step` pops
        the most recent SOP answer; `jump` pops every answer recorded
        at-or-after the supplied `nodeId`; `restart` clears every
        recorded answer plus walk-tied evidence and returns the leg to
        the tree root.

    SopRewindImpactResponse:
      type: object
      required:
        - action
        - answersToPop
        - nextSopNodeId
        - currentSopOutcome
        - clearsTerminal
        - evidenceWillBeCleared
        - draftWillBeDiscarded
      description: |
        Read-only impact preview returned by
        `GET /claims/{id}/sop-rewind-impact`. R5 reads this to choose
        between the light and heavy confirm dialogs:
        `draftWillBeDiscarded === true` ⇒ heavy.
      properties:
        action:
          $ref: "#/components/schemas/SopRewindAction"
        answersToPop:
          type: integer
          description: Number of recorded answers that will be removed.
        nextSopNodeId:
          type: ["string", "null"]
          description: The leg's `sopNodeId` after the rewind. `null` when restart targets a tree with no `rootId`.
        currentSopOutcome:
          type: ["string", "null"]
          description: Snapshot of the verdict that will be cleared if currently terminal.
        clearsTerminal:
          type: boolean
          description: True iff the leg currently carries a terminal verdict that the rewind will null out.
        evidenceWillBeCleared:
          type: integer
          description: Walk-tied `claim_evidence` rows that restart will delete (always 0 for back-step / jump).
        draftWillBeDiscarded:
          type: boolean
          description: True when the parent invoice group has `previewGeneratedAt` or `draftReviewedAt` set; the heavy confirm dialog must run.
        previewGeneratedAt:
          type: ["string", "null"]
          format: date-time
        draftReviewedAt:
          type: ["string", "null"]
          format: date-time

    SopRewindBody:
      type: object
      description: |
        Body for `POST /claims/{id}/sop-back-step` and
        `POST /claims/{id}/sop-restart`. `discardDraft` must be
        `true` when the parent invoice group has a generated draft
        (`previewGeneratedAt` or `draftReviewedAt` set); otherwise the
        endpoint returns 409 carrying the impact preview.
      properties:
        discardDraft:
          type: boolean
          description: Opt-in to clear the parent group's cached AI dispute draft + reviewed stamp.

    SopJumpBody:
      type: object
      required: [nodeId]
      description: Body for `POST /claims/{id}/sop-jump`.
      properties:
        nodeId:
          type: string
          description: Target node id — every answer recorded at-or-after this node will be popped.
        discardDraft:
          type: boolean
          description: Opt-in to clear the parent group's cached AI dispute draft + reviewed stamp.

    SopRewindDraftConflictResponse:
      type: object
      required: [code, error, impact]
      description: |
        Returned with status 409 when a rewind action targets a leg
        whose parent group has a generated draft and the caller did
        not pass `discardDraft: true`. Body carries the same impact
        preview as `GET /claims/{id}/sop-rewind-impact` so the client
        can render the heavy confirm dialog without a second round
        trip.
      properties:
        code:
          type: string
          enum: [draft_discard_required]
        error:
          type: string
        impact:
          $ref: "#/components/schemas/SopRewindImpactResponse"

    RecordVerdictBody:
      type: object
      required: [source, outcome]
      properties:
        source:
          type: string
          enum: [ai_suggested, operator_confirmed, operator_draft]
          description: |
            `operator_draft` (Task #343) records a non-terminal selection
            from the per-leg picker on Responses Awaiting Review. Drafts
            are append-only and the latest draft per leg wins. Drafts
            DO NOT trigger MAS derivation, the attestation gate, or
            `refreshGroupDerivedFields` — those side effects only fire
            when Step 4 is committed via
            `POST /invoice-groups/{id}/promote-verdict-drafts` (which
            atomically inserts an `operator_confirmed` row per leg).
            Drafts also bypass `note`/`confidence`/`reasoning`/
            `inspectionTimeMs` enrichment — those are operator-confirmed
            concepts only.
        outcome:
          type: string
          enum: [Approved, Denied, Partial]
        note:
          type: ["string", "null"]
        confidence:
          type: ["number", "null"]
          description: Optional 0..1 confidence score (AI suggestions only).
        reasoning:
          type: ["string", "null"]
          description: Optional rationale text (AI suggestions only).
        inspectionTimeMs:
          type: ["integer", "null"]
          description: Optional duration the operator spent reviewing.
        reconcile:
          type: boolean
          description: |
            Task #301 reconcile path. When `true`, the verdict endpoint
            bypasses ONLY the `sop_outcome ∈ {portal_dispute, dispute}`
            gate so legs that pre-date the invoice-group flow (and thus
            never had `sop_outcome` populated) can still take an operator
            verdict. Every other source-state check still runs (group is
            `response-pending`, leg is `included_in_dispute`, parent group
            exists, etc.). Requires `source=operator_confirmed` and a
            non-empty `note`. The audit + state event for this row carry
            `metadata.reason = "legacy_reconciliation"` so the bypass is
            traceable in audit and observability.

    ClearLegVerdictDraftResponse:
      type: object
      required: [clearedCount]
      description: |
        Result payload for `DELETE /claims/{id}/verdict/draft` (Task #344).
        Reports how many `operator_draft` rows were hard-deleted in the
        same call. The endpoint is idempotent — calling it on a leg with
        no drafts returns `clearedCount: 0` without error.
      properties:
        clearedCount:
          type: integer
          description: Number of `operator_draft` rows hard-deleted in this call.

    BulkSopAdvanceBody:
      type: object
      required: [nodeId, answer]
      description: |
        Body for `POST /invoice-groups/{id}/sop-advance`. Same shape as
        the per-leg endpoint: identifies the SOP node, the chosen
        answer, and (optionally) a uniform `terminalSopOutcome` to stamp
        across every eligible leg when the option is itself terminal.
        The node must be authored with `appliesPerInvoice = true` on
        every candidate leg's error-type decision tree — otherwise the
        endpoint hard-fails with `409 { code: "node_not_bulk_eligible" }`.
      properties:
        nodeId:
          type: string
          description: Decision-tree node id (matches `claims.sop_node_id`).
        answer:
          type: string
          description: One of the node's option labels.
        terminalSopOutcome:
          type: string
          enum: [portal_dispute, dispute, hold, cannot_dispute, non_issue]
          description: |
            Optional. When the chosen option is terminal, force this
            outcome on every eligible leg uniformly. Ignored on
            mid-walk steps. Partial terminal-step success across the
            group is not allowed — every eligible leg gets the same
            outcome or the call rolls back.

    BulkSopAdvanceSkippedReason:
      type: string
      enum:
        - wrong_node
        - already_terminal
        - excluded_from_dispute
        - sibling_duplicate
      description: |
        Stable reason code explaining why a leg was not advanced by the
        bulk endpoint. `node_not_bulk_eligible` is NOT a per-leg skip
        reason — when the node fails the bulk-eligibility pre-check the
        endpoint hard-fails with `409 { code: "node_not_bulk_eligible" }`
        instead of degrading to a per-leg skip.

    BulkSopAdvanceSkippedLeg:
      type: object
      required: [id, ref, reason]
      properties:
        id:
          type: integer
          description: claims.id of the skipped leg.
        ref:
          type: string
          description: Human-friendly leg reference (`confNumber` or `CLM-{id}` fallback).
        reason:
          $ref: "#/components/schemas/BulkSopAdvanceSkippedReason"

    BulkSopAdvanceResponse:
      type: object
      required: [succeeded, skipped]
      description: |
        Result payload for `POST /invoice-groups/{id}/sop-advance`. On
        the 409 `no_eligible_legs` path `succeeded` is an empty array
        and `code` is set; the same shape lets the client render the
        skipped breakdown without branching on status.
      properties:
        succeeded:
          type: array
          description: Full updated `ClaimResponse` rows for every leg that advanced.
          items:
            $ref: "#/components/schemas/ClaimResponse"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/BulkSopAdvanceSkippedLeg"
        code:
          type: string
          enum: [no_eligible_legs, node_not_bulk_eligible]
          description: Present only on a 409 response.
        reason:
          type: string
          description: Human-readable detail for the 409 `node_not_bulk_eligible` response.

    PromoteVerdictDraftsResponse:
      type: object
      required: [promotedCount, promotedClaimIds]
      description: |
        Result payload for `POST /invoice-groups/{id}/promote-verdict-drafts`.
        Reports how many leg drafts were promoted in the same transaction
        plus the leg ids that were touched (handy for cache invalidation
        on the client).
      properties:
        promotedCount:
          type: integer
          description: Number of `operator_draft` rows promoted to `operator_confirmed` in this call.
        promotedClaimIds:
          type: array
          items:
            type: integer
          description: Ids of the legs whose draft selection was just confirmed.

    ClaimVerdictResponse:
      type: object
      required: [id, claimId, source, outcome, createdAt]
      properties:
        id:
          type: integer
        claimId:
          type: integer
        source:
          type: string
        outcome:
          type: string
        note:
          type: ["string", "null"]
        confidence:
          type: ["string", "null"]
        reasoning:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: ["string", "null"]
        inspectionTimeMs:
          type: ["integer", "null"]

    ExcludeLegBody:
      type: object
      required: [reason]
      description: |
        Body for `POST /claims/{id}/exclude`. When `reason` is `"other"`,
        the `note` field is required and must be non-empty. When `reason`
        is `"handled_offline"`, the `note` field is required and must
        contain at least 10 characters (the server additionally rejects
        notes whose trimmed length is below 10 — Task #689). The
        `handled_offline` path also emits a distinct
        `claim_removed_handled_offline` audit action instead of the
        generic `leg_excluded` entry.
      properties:
        reason:
          type: string
          enum: [clean_leg, out_of_scope, duplicate, non_issue, cannot_dispute, handled_offline, other]
        note:
          type: ["string", "null"]
      allOf:
        - if:
            properties:
              reason:
                const: handled_offline
            required: [reason]
          then:
            required: [reason, note]
            properties:
              note:
                type: string
                minLength: 10

    IncludeLegBody:
      type: object
      description: |
        Body for `POST /claims/{id}/include`. When `undoHandledOffline`
        is `true`, the server requires `note` (>=10 characters after
        trimming) and verifies the leg's most recent exit was the
        Task #689 "Removed — handled offline" path; the audit row
        uses `claim_removed_handled_offline_undone` instead of the
        generic `leg_included` (Task #694). Plain re-includes (the
        legacy path) leave both fields untouched.
      properties:
        note:
          type: ["string", "null"]
        undoHandledOffline:
          type: boolean
      allOf:
        - if:
            properties:
              undoHandledOffline:
                const: true
            required: [undoHandledOffline]
          then:
            required: [undoHandledOffline, note]
            properties:
              note:
                type: string
                minLength: 10

    MarkLegDuplicateBody:
      type: object
      required: [primaryClaimId]
      properties:
        primaryClaimId:
          type: integer
          description: ID of the leg this one is a sibling duplicate of. Must live in the same invoice group.
        note:
          type: ["string", "null"]
          description: Optional human-readable note attached to the audit trail.

    SetLegContextBody:
      type: object
      required: [context]
      properties:
        context:
          type: string
          description: Free-form per-leg narrative. Empty string clears the field.

    ConcludeLegBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: ["non_issue", "cannot_dispute"]
          description: Terminal SOP outcome to stamp on the leg.
        note:
          type: ["string", "null"]
          description: Optional free-form note appended to the audit row.

    CompleteMasActionBody:
      type: object
      properties:
        note:
          type: ["string", "null"]
        masReference:
          type: ["string", "null"]
          description: Optional MAS reference number recorded in the audit trail.

    SetGroupContextBody:
      type: object
      required: [context]
      properties:
        context:
          type: string

    SaveInvoiceGroupDraftBody:
      type: object
      description: |
        Operator edits to the dispute write-up shown in the Submission
        preview pane. Both fields are saved atomically; subject is plain
        text, body is sanitised HTML.
      properties:
        subject:
          type: ["string", "null"]
        descriptionHtml:
          type: ["string", "null"]

    ConfirmReadbackBody:
      type: object
      required: [readback, specialCircumstances]
      properties:
        readback:
          type: string
          description: The AI restatement the operator just verified. Must match the most recent preflight for the supplied `specialCircumstances`. May be an empty string only when `specialCircumstances` is also empty (the explicit "clear notes" path).
        specialCircumstances:
          type: string
          description: The operator's "Understanding notes" text — the narrative-changing context the readback was generated for. Empty string is the explicit "clear notes" path (no AI check required); a non-empty value triggers the drift gate.

    CompleteReattestBody:
      type: object
      properties:
        note:
          type: ["string", "null"]
        masReference:
          type: ["string", "null"]
        recordedOffline:
          type: boolean
          description: |
            Admin override. When true, bypass the macro-phase + cancel-completeness
            preconditions and stamp the same `reattestCompletedAt`/`By` columns,
            recording a distinct `mas_reattest_recorded_offline` audit row. Requires
            an admin actor and a non-empty `offlineNote` (>= 10 trimmed chars).
        offlineNote:
          type: string
          description: |
            Required when `recordedOffline` is true. Free-form note (>= 10 trimmed
            chars) explaining when/where the re-attest was recorded outside the
            standard checklist.
        renameInvoiceNumberTo:
          type: ["string", "null"]
          description: |
            Task #455 — when set, atomically rename the group's
            `invoiceNumber` from its current value to this trimmed value
            inside the same transaction as the re-attest stamp + draft
            promotion. Validates non-empty (after trim), differs from
            current, and no other group already uses the same invoice
            number; otherwise the entire write rolls back with 409. A
            distinct `group_invoice_number_renamed` audit row is written
            with metadata `{from, to, sourceResponseId?}`.
        renameSourceResponseId:
          type: ["integer", "null"]
          description: |
            Optional `portal_responses.id` of the inbound payor reply that
            cited the new invoice number — recorded on the rename audit
            row's metadata for traceability.

    AttestationActionBody:
      type: object
      description: |
        Optional metadata for any of the `/claims/{id}/attest*` endpoints.
        `note` is free-form text recorded on the claim and audit log.
      properties:
        note:
          type: ["string", "null"]

    BulkQueueGroupReattestBody:
      type: object
      description: |
        Optional payload for `POST /invoice-groups/{id}/reattest/queue`.
        Carries the operator note recorded on the queued legs plus an
        optional Task #455 invoice-number rename to apply atomically with
        the queue write.
      properties:
        note:
          type: ["string", "null"]
        renameInvoiceNumberTo:
          type: ["string", "null"]
          description: |
            Task #455 — when set, atomically rename the group's
            `invoiceNumber` to this trimmed value inside the same
            transaction as the bulk queue. Same validation as
            `CompleteReattestBody.renameInvoiceNumberTo`.
        renameSourceResponseId:
          type: ["integer", "null"]
          description: |
            Optional `portal_responses.id` of the inbound payor reply that
            cited the new invoice number — recorded on the rename audit
            row's metadata for traceability.

    BulkQueueGroupReattestResponse:
      type: object
      required: [group, queuedLegIds]
      description: |
        Response payload for `POST /invoice-groups/{id}/reattest/queue`.
        Carries the updated group (so the caller can refresh derived state
        like `awaitingPayorAgainAt`) plus the list of leg ids that were
        moved into `attestation_state = 'queued'` in the same transaction.
      properties:
        group:
          $ref: "#/components/schemas/InvoiceGroupResponse"
        queuedLegIds:
          type: array
          description: Claim ids whose attestation_state was flipped to `queued` by this call.
          items:
            type: integer

    AttestationCountsResponse:
      type: object
      required: [pending, queued]
      properties:
        pending:
          type: integer
          description: Approved-family claims that just landed and have not been actioned.
        queued:
          type: integer
          description: Approved-family claims parked for someone with payor-portal access.

    MacroPhaseRollupResponse:
      type: object
      required: [counts]
      properties:
        counts:
          type: object
          required:
            - preSubmit
            - inFlight
            - responsePending
            - masActionRequired
            - awaitingPayout
            - closed
            - onHold
            - attestationOpen
          properties:
            preSubmit:
              type: integer
              description: Groups in the `pre-submit` macro phase (triage / ready-to-submit).
            inFlight:
              type: integer
              description: Groups in the `in-flight` macro phase (submitted, awaiting first payor response).
            responsePending:
              type: integer
              description: Groups in the `response-pending` macro phase (response received / under review).
            masActionRequired:
              type: integer
              description: Groups in the `mas-action-required` macro phase (per-leg MAS cancels and/or group re-attestation owed).
            awaitingPayout:
              type: integer
              description: Groups in the transient `awaiting-payout` macro phase (re-attest recorded, payor not yet booked).
            closed:
              type: integer
              description: Groups in the `closed` macro phase (final state — Resolved or Denied).
            onHold:
              type: integer
              description: Groups parked in the `on-hold` macro phase (status=On Hold).
            attestationOpen:
              type: integer
              description: |
                Open attestation work — Approved-family / MAS-Eligible legs in
                `attestation_state ∈ {pending, queued}`. Drives the Attestation
                tab badge on the Responses Awaiting Review workspace so all
                three tabs read counts from the same rollup endpoint
                (Task #560).

    ResponsesAwaitingReviewCountResponse:
      type: object
      required: [count, masActionCount]
      properties:
        count:
          type: integer
          description: |
            Number of invoice groups visible on the Responses Awaiting
            Review page — `response-pending` macro phase (status ∈
            {Ready to Review, Needs Review}), Error Type assigned, NOT in
            MAS-action-required state, and with at least one reviewable
            payor response on file. Drives the sidebar nav badge.
        masActionCount:
          type: integer
          description: |
            Number of invoice groups whose macro phase is
            `mas-action-required` — i.e., per-leg verdicts are confirmed and
            the operator still owes per-leg cancellations and/or a group
            re-attestation. Surfaced as the sub-pill on the same nav badge
            so MAS work-in-flight is visible without a separate top-level
            entry.

    ResponsesAwaitingReviewHiddenCountsResponse:
      type: object
      required: [unclassified, awaitingPayorAgain, acknowledgmentOnly]
      properties:
        unclassified:
          type: integer
          description: |
            Groups that satisfy the response-pending base criteria but
            have no error type assigned. Click target: the classification
            queue (filtered list of `__unassigned__` response-pending
            groups).
        awaitingPayorAgain:
          type: integer
          description: |
            Groups suppressed by the operator's "I replied — wait for
            payor again" flip (no newer response since the stamp).
            Excludes groups already counted under `unclassified`.
        acknowledgmentOnly:
          type: integer
          description: |
            Groups whose every portal_response has been (re)classified
            as `acknowledgment` / `abstain`, leaving nothing reviewable.
            Excludes groups already counted under `unclassified` or
            `awaitingPayorAgain`.

    AiCalibrationResponse:
      type: object
      required: [errorTypeId, totalConfirmations, agreementCount, perOutcomeAgreement, windowDays]
      properties:
        errorTypeId:
          type: string
        totalConfirmations:
          type: integer
          description: Number of paired (AI suggestion → operator confirmation) verdicts in the window.
        agreementCount:
          type: integer
          description: How many of those pairs agreed.
        perOutcomeAgreement:
          type: object
          required: [Approved, Denied, Partial]
          properties:
            Approved:
              type: integer
            Denied:
              type: integer
            Partial:
              type: integer
        windowDays:
          type: integer
          description: Window applied when computing the stats (defaults to 90 days server-side).

    AttestationPendingExtras:
      type: object
      description: |
        Review-pane context joined onto a claim in the attestation queue
        listing. Surfaces "when did the verdict land?" and "what was the
        most recent payor response?" so the operator can decide what to do
        without opening the full claim detail.
      properties:
        verdictRecordedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the most recent outcome change for this claim (from the audit log).
        lastResponseAt:
          type: ["string", "null"]
          format: date-time
          description: When the latest payor response (portal or email) was recorded.
        lastResponseSubject:
          type: ["string", "null"]
          description: Subject of the latest payor response, if any.
        lastResponseSource:
          type: ["string", "null"]
          enum: ["email", "portal", "manual", null]
          description: Channel the latest payor response came in on.

    GroupAttestationHistoryLeg:
      type: object
      description: |
        Per-leg row in the completed re-attestation history. Each leg is
        classified into one of four `attestationOutcome` buckets so the
        UI can label what actually happened to the leg without the
        operator having to open the claim detail page.
      required: [claim, attestationOutcome]
      properties:
        claim:
          $ref: "#/components/schemas/ClaimResponse"
        attestationOutcome:
          type: string
          enum: ["attested", "mas_cancelled", "queued", "not_required"]
          description: |
            Per-leg outcome at the moment the parent group's MAS
            re-attestation was confirmed. `attested` = leg has an
            `attestedAt` stamp; `mas_cancelled` = leg has
            `masActionCompletedAt` with `masActionRequired='cancel'`;
            `queued` = leg sits at attestation_state='queued';
            `not_required` = anything else (typically a non-Approved
            sibling that rode along with disputed legs).
        outcomeAt:
          type: ["string", "null"]
          format: date-time
          description: |
            Timestamp matching the chosen outcome bucket — `attestedAt`,
            `masActionCompletedAt`, `attestationQueuedAt`, or null when
            no relevant stamp exists.
        outcomeBy:
          type: ["string", "null"]
          description: |
            Operator email matching the chosen outcome bucket
            (`attestedBy`, `masActionCompletedBy`, `attestationQueuedBy`)
            or null when not recorded.
        outcomeNote:
          type: ["string", "null"]
          description: |
            Free-form note matching the chosen outcome bucket
            (`attestationNote` for attested/queued, `masActionNote` for
            mas_cancelled). Null when no note was recorded.

    GroupAttestationHistoryEntry:
      type: object
      required: [group, legs]
      properties:
        group:
          $ref: "#/components/schemas/InvoiceGroupResponse"
        legs:
          type: array
          items:
            $ref: "#/components/schemas/GroupAttestationHistoryLeg"

    GroupAttestationHistoryResponse:
      type: object
      required: [groups, truncated]
      description: |
        Payload for `GET /invoice-groups/attestation-history`. `groups` is
        ordered by `reattestCompletedAt DESC` and capped at 200 entries;
        `truncated=true` indicates the requested window had more matches
        than the cap.
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupAttestationHistoryEntry"
        truncated:
          type: boolean

    TriageClaimBody:
