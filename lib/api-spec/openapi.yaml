          type: string
          description: ISO-8601 updated_at on the row.

    WorkerFailedSubmissionEvent:
      type: object
      required: [submissionId, invoiceGroupId, attempts, maxAttempts, at]
      properties:
        submissionId:
          type: integer
        invoiceGroupId:
          type: integer
        attempts:
          type: integer
        maxAttempts:
          type: integer
        errorMessage:
          type: string
          nullable: true
        at:
          type: string
          description: ISO-8601 updated_at on the row.

    SystemHealthRollupComponent:
      type: object
      required: [name, status, detail]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, failed]
        detail:
          type: string
          nullable: true
        informational:
          type: boolean
          description: |
            True when `detail` is a transient informational note from the
            rollup itself (e.g. "Awaiting first scheduled run since server
            boot", "Skipped one scheduled tick — recovering"). The UI
            surfaces only these as informational notes, so normal "ok"
            runs whose `detail` is just the last run's message are not
            treated as alerts.

    SystemHealthRollupResponse:
      type: object
      required: [overall, components, lastWorkerRun, workerRunning, overdueCount, overdueGraceMinutes, nextSweepAt, lastSweepAt, generatedAt, bootedAt]
      properties:
        overall:
          type: string
          enum: [ok, degraded, failed]
        components:
          type: array
          items:
            $ref: "#/components/schemas/SystemHealthRollupComponent"
        lastWorkerRun:
          oneOf:
            - $ref: "#/components/schemas/WorkerRunSummary"
            - type: "null"
        workerRunning:
          type: boolean
        overdueCount:
          type: integer
        overdueGraceMinutes:
          type: integer
          description: |
            Minutes of grace allowed after a scheduled sweep fires before
            still-pending rows are flagged as past their cycle.
        nextSweepAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the next scheduled portal_batch_sweeper fire. Mirrors the worker-activity field so banner/UI consumers don't need a second request.
        lastSweepAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the most recent expected portal_batch_sweeper fire (already past its grace window). Null when no past fire has had its grace window yet.
        generatedAt:
          type: string
        bootedAt:
          type: string
          description: ISO timestamp of when the API server process started. Used by the System Health page to contextualize "awaiting first scheduled run" notes.
