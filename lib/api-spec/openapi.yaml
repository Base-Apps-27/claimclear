          description: Total counts per closure reason across the entire (unfiltered) dataset.
          properties:
            cannot_dispute:
              type: integer
            non_issue:
              type: integer
            denied_by_payor:
              type: integer
            addressed:
              type: integer
          required: [cannot_dispute, non_issue, denied_by_payor, addressed]
        closers:
          type: array
          description: Distinct closers across the dataset (ignoring the closedBy and hideAddressed filters), used to populate the "Closed by" facet.
          items:
            $ref: "#/components/schemas/WithdrawalCloser"
      required:
        - rows
