          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        isBlank:
          type: boolean
          description: True when errorDetails is null/whitespace.

    NeedsClassificationInboxGroup:
      type: object
      required:
        - id
        - status
        - rideCount
        - needsClassificationCount
        - qualifyingSiblingCount
        - allBlank
