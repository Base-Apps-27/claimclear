kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.development.env]
# Pin the wall-clock timezone for the API process. All "today" / urgency /
# 30-day-deadline math is anchored to America/New_York via Intl, but we
# still pin TZ here so any Date.toLocale*, audit timestamps, and cron
# tz-defaulting helpers also agree with the office calendar. See Task #298.
TZ = "America/New_York"

[services.production]

[services.production.build]
# Schema migration runs FIRST against the production DB so the new code
# never starts serving requests against an out-of-date schema. We use a
# custom non-interactive runner (lib/db/scripts/apply-migrations.mjs)
# instead of `drizzle-kit push --force` because `push --force` only skips
# data-loss prompts, NOT rename-disambiguation prompts. In a non-TTY
# build the rename prompt hangs/exits without applying anything, so the
# build "succeeds" but ships code against an unmigrated DB. See the
# May-1-2026 production incident.
args = ["sh", "-c", "pnpm --filter @workspace/db run migrate && PORT=5173 BASE_PATH='/' pnpm --filter @workspace/claimclear run build && pnpm --filter @workspace/api-server run build && PLAYWRIGHT_BROWSERS_PATH=./pw-browsers node artifacts/api-server/node_modules/playwright/cli.js install chromium"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
PLAYWRIGHT_BROWSERS_PATH = "./pw-browsers"
# Pin the wall-clock timezone in production so the autoscaled container's
# default UTC clock cannot leak into urgency math, audit timestamps, or
# cron firing windows. The deadline helpers in lib/dates.ts anchor on
# America/New_York via Intl regardless, but pinning TZ keeps every other
# Date.toLocale* call (logs, briefs, cron-parser ticks) on the same
# calendar as the office. See Task #298.
TZ = "America/New_York"

[services.production.health.startup]
path = "/api/healthz"
