        refNumber: { type: string, nullable: true }
        clientNumber: { type: string, nullable: true }
        errorTypeName: { type: string, nullable: true }
        status: { type: string, nullable: true }
        claimAmount:
          type: string
          nullable: true
          description: Numeric, serialized as string. Null for clerks (money scrubbed).

    GlobalSearchWithdrawal:
      type: object
      required: [kind, id, identifier]
      properties:
        kind:
          type: string
          enum: [claim, group]
        id: { type: integer }
        identifier:
          type: string
          description: Conf # for claims, invoice # for groups (or fallback "Group #N").
        clientNumber: { type: string, nullable: true }
        amount:
          type: string
          nullable: true
          description: Numeric, serialized as string. Null for clerks.
        closureReason: { type: string, nullable: true }

    GlobalSearchPortalSubmission:
      type: object
      required: [id, invoiceGroupId, status]
      properties:
        id: { type: integer }
        invoiceGroupId: { type: integer }
        invoiceNumber: { type: string, nullable: true }
        confNumber: { type: string, nullable: true }
        clientNumber: { type: string, nullable: true }
        errorTypeName: { type: string, nullable: true }
        status: { type: string, nullable: true }
        portalTicketId: { type: string, nullable: true }

    GlobalSearchResponse:
      type: object
      required: [query, invoiceGroups, claims, withdrawals, portalSubmissions]
      properties:
        query: { type: string }
        invoiceGroups:
          type: array
          items: { $ref: "#/components/schemas/GlobalSearchInvoiceGroup" }
        claims:
          type: array
          items: { $ref: "#/components/schemas/GlobalSearchClaim" }
        withdrawals:
          type: array
          items: { $ref: "#/components/schemas/GlobalSearchWithdrawal" }
        portalSubmissions:
          type: array
          items: { $ref: "#/components/schemas/GlobalSearchPortalSubmission" }

    ReplyEvidenceItem:
      type: object
      required: [url, name, source, sources]
      description: |
        A single attachment already on this case, surfaced by
        `GET /invoice-groups/{id}/reply-evidence` so the reply composer
        can re-stage it without re-uploading. The `url` is the object-
        storage path (`/objects/...`); the picker hands it back to
        `POST /storage/reply-attachments/stage-from-evidence`.
      properties:
        url:
          type: string
          description: Object-storage path (`/objects/...`).
        name:
          type: string
          description: Display filename (falls back to URL basename when the source row had no `name`).
        size:
          type: ["number", "null"]
          description: Bytes, when known from the source row. The stage-from-evidence response carries the authoritative size after copying.
        contentType:
          type: ["string", "null"]
          description: Best-effort MIME guess from the filename extension; the server re-detects on copy.
        source:
          type: string
          enum: [group, claim, portal_submission]
          description: Primary source row this file came from. When the same file appears on multiple rows the canonical one is reported here and the rest go in `sources`.
        sources:
          type: array
          items:
            type: string
            enum: [group, claim, portal_submission]
          description: Every source kind that referenced this URL, in stable order. Always contains `source`.
        claimConfNumber:
          type: ["string", "null"]
          description: Set when `source === "claim"` so the picker can label the claim that contributed the file.

    ReplyEvidenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReplyEvidenceItem" }
