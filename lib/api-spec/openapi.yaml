    PortalSubmissionResponse:
      type: object
      properties:
        id:
          type: integer
        invoiceGroupId:
          type: integer
        status:
          type: string
          enum: ["draft", "pending", "in_progress", "submitted", "failed", "cancelled", "dry_run"]
        issueType:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        requesterEmail:
          type: ["string", "null"]
        transportationProviderName:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        invoiceNumber:
          type: ["string", "null"]
        gpsBreadcrumbsAvailable:
          type: ["string", "null"]
        descriptionHtml:
          type: ["string", "null"]
        descriptionEditorEmail:
          type: ["string", "null"]
        descriptionEditorName:
          type: ["string", "null"]
        descriptionHistory:
          type: ["array", "null"]
          items:
            type: object
            properties:
              description:
                type: string
              generatedAt:
                type: string
              editorEmail:
                type: ["string", "null"]
              editorName:
                type: ["string", "null"]
            required:
              - description
              - generatedAt
        attachmentUrls:
          type: ["array", "null"]
          items:
            type: string
          description: "Flat list of object-storage URLs snapshotted at draft time and consumed by the bot worker / direct-email dispatcher. Always a string array on rows produced after Task #389; older legacy rows may be null."
        confNumber:
          type: ["string", "null"]
        serviceDate:
          type: ["string", "null"]
        refNumber:
          type: ["string", "null"]
        clientNumber:
          type: ["string", "null"]
        carNumber:
          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        disputeReason:
          type: ["string", "null"]
        specialCircumstances:
          type: ["string", "null"]
          description: Operator-supplied narrative-changing context (e.g. "MAS pushed an address update after the ride completed"). Woven into the AI prompt with strong emphasis.
        understandingReadback:
          type: ["string", "null"]
          description: AI's 2–4 sentence restatement of what the dispute is actually about, confirmed by the operator before the full draft was generated.
        understandingReadbackAt:
          type: ["string", "null"]
          description: Timestamp of when the most recent confirmed understanding readback was captured.
        evidenceNotes:
          type: ["string", "null"]
        evidenceFiles:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/EvidenceFileRef"
          description: "Per-submission attachment list snapshotted from `invoice_groups.evidenceFiles` at draft time. Null when the source group had no JSONB attachments."
        portalTicketId:
          type: ["string", "null"]
        screenshotUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        submittedAt:
          type: ["string", "null"]
        lastScrapedAt:
          type: ["string", "null"]
          description: |
            Task #738. ISO timestamp of the most recent
            `portal_response_sync` attempt that *actually considered*
            this row. Skipped synthetic / no-ticket rows are not
            written, so the column reflects what was checked, not
            every cron tick.
        lastScrapeOutcome:
          type: ["string", "null"]
          enum: ["new_reply", "no_change", "error", null]
          description: |
            Outcome of the most recent scrape:
              new_reply — at least one fresh portal message was posted
              no_change — reader succeeded; nothing new
              error     — reader / poster threw, or the gate was busy
        lastScrapeError:
          type: ["string", "null"]
          description: Error excerpt for the most recent failed or partial scrape (truncated to 1000 chars). Null on clean runs.
        attempts:
          type: integer
        maxAttempts:
          type: integer
        nextRetryAt:
          type: ["string", "null"]
        claimedByBatchId:
          type: ["string", "null"]
          description: ID of the in-flight portal-submission batch that has claimed this row, or null. When set on a pending row, the row should be rendered as Queued.
        claimedByUserName:
          type: ["string", "null"]
          description: Display name of the user who triggered the in-flight batch holding this row.
        claimedAt:
          type: ["string", "null"]
          description: Timestamp when the row was claimed by the current batch.
        completedElsewhere:
          type: ["object", "null"]
          description: |
            Populated when a *different* portal_submissions row sharing the same
            `invoiceGroupId` has reached status='submitted'. Lets the UI render
            an inline "Already submitted in run #N" pill on draft / cancelled /
            failed rows whose underlying invoice has already been resolved by
            another attempt. Null when no sibling success exists, and always
            null on the success row itself. The latest sibling success wins.
          properties:
            submissionId:
              type: integer
              description: ID of the sibling portal_submissions row that holds the success.
            runId:
              type: ["integer", "null"]
              description: Numeric ID of the portal_batch_runs row that processed the sibling success, or null if the row was completed outside a tracked batch run.
            runLabel:
              type: ["string", "null"]
              description: User-facing label for the run, e.g. "#287". Null if `runId` is null.
            submittedAt:
              type: ["string", "null"]
              description: ISO timestamp of when the sibling submission reached status='submitted'.
          required:
            - submissionId
        legs:
          type: array
          description: "Per-leg breakdown for this group submission (Task #485). One entry per disputed leg in the group, in the order they were eligible at draft time. Recorded with ticked=false at draft creation and overwritten by the producer with the worker's perLeg outcomes after a real submission run. The list page renders one row per group; the drawer reads this array directly to show the per-leg outcome breakdown. Legacy per-leg rows created before Task #485 will have an empty array — the drawer renders a graceful 'details unavailable' notice for those."
          items:
            type: object
            properties:
              legId:
                type: integer
                description: Numeric ID of the claims row this leg corresponds to.
              confNumber:
                type: ["string", "null"]
                description: MAS confirmation number for the leg, snapshotted at draft time. Null if the leg had no confNumber.
              ticked:
                type: boolean
                description: Whether the bot worker confirmed this leg was selected/ticked in the portal session. Stays false until a real (non-sandbox) submission run completes.
              error:
                type: ["string", "null"]
                description: Per-leg error message returned by the worker when ticked=false. Null when the leg was ticked successfully or no run has happened yet.
              readyAt:
                type: ["string", "null"]
                description: ISO timestamp of when this leg was first stamped `ready` (claims.ready_at). Null if the leg is not — and was not — `ready`. Used together with the submission's createdAt to power the "Ready-at-submission snapshot" panel in the drawer (Task #564).
              wasReadyAtSubmission:
                type: boolean
                description: True when this leg's readyAt is non-null AND <= the submission's createdAt — i.e. the leg was already in the `ready` sub-status at the moment the submission draft was frozen. Drives the Ready-at-submission snapshot filter (Task #564).
            required:
              - legId
              - ticked
              - wasReadyAtSubmission
        groupMacroPhase:
          type: ["string", "null"]
          enum: ["pre-submit", "in-flight", "response-pending", "mas-action-required", "awaiting-payout", "closed", "on-hold", null]
          description: |
            Macro lifecycle phase of the parent invoice group at read time.
            Surfaced so the Portal Submissions UI can render the macro phase as
            the *primary* state chip and the Submission Stage as a subordinate
            secondary chip ("In-flight · Submitted") per the invoice-first
            cleanup (Task #564). Derived server-side via `getGroupMacroPhase`
            on the joined invoice_groups row; null only if the group row
            could not be loaded (should not happen for non-orphaned rows).
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - invoiceGroupId
        - status
        - attempts
        - maxAttempts
        - legs

    CreatePortalSubmissionBody:
      type: object
      properties:
        invoiceGroupId:
          type: integer
        issueType:
          type: string
        subject:
          type: string
        requesterEmail:
          type: string
        transportationProviderName:
          type: string
        phoneNumber:
          type: string
        invoiceNumber:
          type: string
        gpsBreadcrumbsAvailable:
          type: string
        descriptionHtml:
          type: string
        disputeReason:
          type: string
        specialCircumstances:
          type: string
          description: Optional narrative-changing context provided by the operator. If non-empty, `understandingReadback` MUST also be supplied (the UI gates Generate behind a confirmed AI readback).
        understandingReadback:
          type: string
          description: The 2–4 sentence AI readback the operator confirmed before generating the draft. Required when `specialCircumstances` is non-empty.
        actorType:
          type: string
          enum: [operator, system]
          description: Submission actor path. "operator" (default for human users) enforces all four readiness gates. "system" requires a valid bot service token and bypasses the readback and preview gates.
        ack:
          type: boolean
          description: |
            Task #703 — bypass acknowledgement for lint **warnings** (not failures).
            POST /portal-submissions runs `lintDraft` on the prospective row before
            insert. Hard `fail` results always 422 with `{ failures: LintResult[] }`.
            Soft `warn` results 422 with the same shape unless the caller passes
            `ack: true` AND `bypassReason` (≥ 10 chars). When set, a dedicated
            `lint_warnings_bypassed` audit row is written before the insert.
        bypassReason:
          type: string
          description: |
            Free-text justification for bypassing lint warnings. Required when
            `ack: true`; minimum 10 characters. Stored in the metadata of the
            `lint_warnings_bypassed` audit row so the audit trail names *why* the
            operator overrode the warning, not just *that* they did.

