          type: string
          nullable: true
        portalTicketId:
          type: string
          nullable: true
        lastScrapedAt:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
          enum: [new_reply, no_change, error, null]
        errorExcerpt:
