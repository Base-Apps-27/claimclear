          schema:
            type: string
        - name: closedTo
          in: query
          schema:
            type: string
        - name: closedBy
          in: query
          description: Comma-separated user ids — only return rows whose closer matches one of these users
          schema:
            type: string
        - name: closureResponsibility
          in: query
          description: Comma-separated five-value closure responsibility filter (Task #889)
          schema:
            type: string
        - name: awaitingParty
          in: query
          description: When "true", return only rows assigned to a responsible role and not yet acknowledged
          schema:
            type: string
            enum: ["true", "false"]
        - name: sort
          in: query
          schema:
            type: string
            enum: [closedAt, reason, kind, identifier, amount, addressed]
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Withdrawals list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalsListResponse"

  /withdrawals/export-csv:
    get:
      operationId: exportWithdrawalsCsv
      tags: [withdrawals]
      summary: Export the matching withdrawals as CSV
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: reason
          in: query
          schema:
            type: string
        - name: hideAddressed
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: closedFrom
          in: query
          schema:
            type: string
        - name: closedTo
          in: query
          schema:
            type: string
        - name: closedBy
          in: query
          description: Comma-separated user ids — only export rows whose closer matches one of these users
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [closedAt, reason, kind, identifier, amount, addressed]
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema:
                type: string

  /withdrawals/export-csv/by-role:
    get:
      operationId: exportWithdrawalsCsvByRole
      tags: [withdrawals]
      summary: Export closures scoped to one responsible role as a party-safe CSV
      description: |
        Task #890. Returns a smaller column set tailored for handoff to a
        responsible-party supervisor (or onward to an out-of-system
        stakeholder). Excludes operator emails, raw enums, accountability
        tag json, and internal review-state strings.

        Requires the caller to either (a) hold the requested role on
        `users.responsible_roles`, or (b) hold any admin-tier role.
        Anything else returns 403 with no audit row written.

        Stamps a single `withdrawals_csv_exported` audit row on success
        with `metadata = { scope: "by_role", role, filters, rowCount }`.
        Empty rowsets still return a header-only CSV (not 204, not HTML).
      parameters:
        - name: role
          in: query
          required: true
          description: The responsible role to scope the export to.
          schema:
            type: string
            enum: [contact_center_manager, contractor_relations_coordinator, it_coordinator_or_coo, external_payor]
        - name: search
          in: query
          schema:
            type: string
        - name: reason
          in: query
          schema:
            type: string
        - name: hideAddressed
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: closedFrom
          in: query
          schema:
            type: string
        - name: closedTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Missing or invalid role parameter
        "403":
          description: Caller does not hold the requested role and is not an admin

  /withdrawals/bulk-address:
    post:
      operationId: bulkAddressWithdrawals
      tags: [withdrawals]
      summary: Mark multiple closures as addressed in one request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAddressBody"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAddressResponse"

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Universal header search across invoice groups, claims, withdrawals, and portal submissions
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text query. Substring/ILIKE match against the same fields the dedicated list pages search.
          schema:
            type: string
      responses:
        "200":
          description: Capped, grouped match list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSearchResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        role:
          type: string
        status:
          type: string
        # Task #889 — responsible-party portal roles. Independent of `role`
        # so a user can be operator + responsible supervisor simultaneously.
        # Empty array for users with no portal access.
        responsibleRoles:
          type: array
          items:
            type: string
            enum:
              - contact_center_manager
              - contractor_relations_coordinator
              - it_coordinator_or_coo
        # Task #889 round-3 — explicit portal-only marker. When true,
        # the AppLayout hides all operator nav and renders only the
        # My Closures portal entry. Independent of `role`.
        isPortalOnly:
          type: boolean
      required:
        - id
        - email
        - role
        - status
        - responsibleRoles
        - isPortalOnly

    # Task #889 — Responsible-Party portal row. Reuses the WithdrawalRow
    # shape so the client can share a single renderer between
    # /withdrawals and /my-closures.
    MyClosuresListResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WithdrawalRow"
        roles:
          type: array
          items:
            type: string
        activeRoles:
          type: array
          items:
            type: string
        counts:
          type: object
          properties:
            total:
              type: integer
            awaiting:
              type: integer
            addressed:
              type: integer
          required: [total, awaiting, addressed]
      required: [rows, roles, counts]

    MyClosuresAddressBody:
      type: object
      properties:
        note:
          type: string
          minLength: 10
        updatedAt:
          type: ["string", "null"]
          description: Optional client snapshot of the row's updatedAt for stale-write protection
      required: [note]

    MyClosuresAddressResponse:
      type: object
      properties:
        ok:
          type: boolean
        kind:
          type: string
          enum: [claim, invoice_group]
        id:
          type: integer
        reviewState:
          type: string
        addressedAt:
          type: string
        addressedBy:
          type: ["string", "null"]
        addressedByEmail:
          type: ["string", "null"]
      required: [ok, kind, id, reviewState]

    MyClosuresReopenBody:
      type: object
      properties:
        note:
          type: string
          minLength: 10
      required: [note]

    MyClosuresReopenResponse:
      type: object
      properties:
        ok:
          type: boolean
        kind:
          type: string
        id:
          type: integer
        reviewState:
          type: string
      required: [ok, kind, id, reviewState]

    AdminResponsibleRolesBody:
      type: object
      properties:
        responsibleRoles:
          type: array
          items:
            type: string
            enum:
              - contact_center_manager
              - contractor_relations_coordinator
              - it_coordinator_or_coo
        # Task #889 round-3 — optional explicit portal-only marker.
        # Omit to leave the existing value unchanged.
        isPortalOnly:
          type: boolean
      required: [responsibleRoles]

    AdminResponsibleRolesReadout:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: ["string", "null"]
              displayName:
                type: ["string", "null"]
              role:
                type: string
              status:
                type: string
              responsibleRoles:
                type: array
                items:
                  type: string
              isPortalOnly:
                type: boolean
            required: [id, role, status, responsibleRoles, isPortalOnly]
      required: [users]

    ClaimResponse:
      type: object
      properties:
        id:
          type: integer
        invoiceGroupId:
          type: ["integer", "null"]
        confNumber:
          type: string
        date:
          type: ["string", "null"]
        refNumber:
          type: ["string", "null"]
        clientNumber:
          type: ["string", "null"]
        carNumber:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        errorTypeId:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
        status:
          type: string
          enum: ["New", "Needs Review", "Needs Evidence", "Processed", "Portal Queued", "Generating Email", "Ready to Review", "Awaiting Response", "On Hold", "Resolved", "Denied"]
          deprecated: true
          description: "DEPRECATED (Wave C, hierarchical state-machine refactor). Read `disposition` instead. Still populated by writers during Wave C/D for backwards compatibility; dropped in Wave E."
        outcome:
          type: string
          enum: ["Pending", "Approved", "Denied", "Partially Approved", "Non-Issue", "Withdrawn", "No Action Needed"]
          deprecated: true
          description: "DEPRECATED (Wave C). Read `disposition` instead. Still populated by writers during Wave C/D; dropped in Wave E."
        disposition:
          type: string
          enum: ["unclassified", "classifying", "disposed_portal", "disposed_email", "disposed_withdraw", "disposed_nonissue", "blocked", "duplicate", "awaiting_review", "verdict_drafted", "verdict_approved", "verdict_denied", "verdict_partial", "attest_pending", "attest_queued", "attested", "mas_cancelled", "attest_not_required", "final_reattested", "final_withdrawn", "final_denied", "final_nonissue"]
          description: "Canonical per-leg state in the hierarchical state model. Mirrors `claims.disposition`. Constrained by parent invoice's `phase` via the `validate_disposition_against_phase` deferrable trigger. Source: `@workspace/vocab` `CLAIM_DISPOSITIONS`."
        closureReason:
          type: ["string", "null"]
          enum: ["denied_by_payor", "cannot_dispute", "non_issue", null]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        closureResponsibility:
          oneOf:
            - $ref: "#/components/schemas/ClosureResponsibility"
            - type: "null"
          description: "Task #888 — five-value canonical responsibility recorded by the slim closure modal. Null on legacy rows."
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        triageNotes:
          type: ["string", "null"]
        triagedAt:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        invoiceNumbers:
          type: ["string", "null"]
        payorEmail:
          type: ["string", "null"]
        disputeEmailSent:
          type: boolean
        disputeEmailSentAt:
          type: ["string", "null"]
        importBatch:
          type: ["string", "null"]
        evidenceFiles:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/EvidenceFileRef"
          description: "Per-leg attachment list. JSONB array of file references stored alongside the canonical `claim_evidence` rows; the bot worker reads both sources via `collectGroupEvidenceUrls`. Null on legacy rows with no attachments."
        evidenceNotes:
          type: ["string", "null"]
        evidenceChecklist:
          type: ["object", "null"]
          additionalProperties:
            type: boolean
          description: "Operator-tickable checklist mapping evidence-step name → checked. Stored as a `Record<string, boolean>` JSONB blob. No active reader today; declared as a typed map so future UI can read/write it without `as unknown` casts. Null = no checklist captured."
        generatedEmailSubject:
          type: ["string", "null"]
        generatedEmailBody:
          type: ["string", "null"]
        generatedEmailAt:
          type: ["string", "null"]
        # workflow_progress JSONB column dropped (Task #195 — per-claim →
        # per-invoice transition). The discrete per-leg state-machine
        # columns (sopNodeId, sopOutcome, dropReason, attestationState,
        # …) replace it; surfaced via the contracts task.
        holdReason:
          type: ["string", "null"]
        holdPendingFrom:
          type: ["string", "null"]
        holdPlacedAt:
          type: ["string", "null"]
        attestationState:
          type: string
          enum: ["not_required", "pending", "queued", "completed"]
          description: "Re-attestation tracking state. `not_required` for any non-Approved outcome, `pending` immediately after an Approved verdict, `queued` if parked for someone with portal access, `completed` once the operator confirms they re-attested in the payor portal."
        attestedAt:
          type: ["string", "null"]
        attestedBy:
          type: ["string", "null"]
        attestationNote:
          type: ["string", "null"]
        attestationQueuedAt:
          type: ["string", "null"]
        attestationQueuedBy:
          type: ["string", "null"]
        includedInDispute:
          type: boolean
          description: "False when the leg is intentionally excluded from any dispute submission for its parent invoice group (a clean leg riding alongside disputed siblings)."
        duplicateOfClaimId:
          type: ["integer", "null"]
          description: "When set, this leg is a Sibling Duplicate that rides along with a primary leg in the same invoice group whose error type is trip-overriding (e.g. eligibility lapse). The leg derives sub-status `duplicate` and contributes no independent SOP/verdict to the dispute."
        sopNodeId:
          type: ["string", "null"]
          description: "ID of the current decision-tree node the leg is parked on. Null until the operator opens the SOP walk."
        sopOutcome:
          type: ["string", "null"]
          enum: ["portal_dispute", "dispute", "hold", "cannot_dispute", "non_issue", null]
          description: "Terminal SOP outcome stamped when the operator reaches a leaf option in the decision tree."
        dropReason:
          type: ["string", "null"]
          enum: ["cannot_dispute", "non_issue", null]
          description: "Reason the leg was dropped from dispute. Set when sopOutcome is `cannot_dispute` or `non_issue`."
        readyAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamp of when the leg flipped to `ready` sub-status (sopOutcome=`portal_dispute|dispute`)."
        droppedAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamp of when the leg flipped to `dropped` sub-status."
        perLegContext:
          type: ["string", "null"]
          description: "Operator-authored narrative specific to this leg, used by the dispute write-up assembly."
        sopAnswers:
          type: array
          description: "Append-only audit trail of the operator's SOP walk on this leg. Each row records a decision-tree node and the answer the operator gave; rerunning the walk appends new rows rather than mutating prior ones. Persisted as a jsonb column with default `[]`, so the field is always present (never null). The leg-detail page renders these via `buildSopTranscript` to show the read-only SOP walk transcript."
          items:
            type: object
            properties:
              nodeId:
                type: string
                description: "ID of the decision-tree node the operator answered."
              answer:
                type: string
                description: "Operator's recorded answer, verbatim."
              ts:
                type: string
                description: "ISO timestamp of when the answer was recorded. Optional on legacy rows."
            required:
              - nodeId
              - answer
        masActionRequired:
          type: ["string", "null"]
          enum: ["cancel", "none", null]
          description: "Whether a downstream MAS-action (cancel) is required for this leg. Stamped automatically on Denied verdicts; `none` when the verdict path doesn't need MAS intervention."
        masActionCompletedAt:
          type: ["string", "null"]
          format: date-time
          description: "Operator-confirmed completion stamp for the MAS action."
        masActionCompletedBy:
          type: ["string", "null"]
        masActionNote:
          type: ["string", "null"]
        latestVerdict:
          oneOf:
            - $ref: "#/components/schemas/ClaimVerdictResponse"
            - type: "null"
          description: "Latest row from `claim_verdict` regardless of source. Only populated by the invoice-group detail endpoint so the picker can render with one fetch."
        latestAiSuggestion:
          oneOf:
            - $ref: "#/components/schemas/ClaimVerdictResponse"
            - type: "null"
          description: "Latest `ai_suggested` row from `claim_verdict`. Only populated by the invoice-group detail endpoint."
        latestDraft:
          oneOf:
            - $ref: "#/components/schemas/ClaimVerdictResponse"
            - type: "null"
          description: "Latest `operator_draft` row from `claim_verdict` (Task #343). The draft selection that lights up Step 3 of the Responses Awaiting Review picker before Step 4 is committed. Only populated by the invoice-group detail endpoint."
        createdAt:
          type: string
        updatedAt:
          type: string
        effectiveDaysLeft:
          type: ["integer", "null"]
          description: "Calendar days until the effective filing deadline (weekend deadlines shift back to Friday). Null when no service date. Only populated by list endpoints."
        isUrgent:
          type: boolean
          description: "True when the effective filing deadline is today or earlier — must be filed today, cannot wait until tomorrow. Only populated by list endpoints."
        submittedStuck:
          type: boolean
          description: "Task #352. True when the claim has been submitted (status is `Portal Queued` or `Processed`) but the effective filing deadline has slipped without an acknowledgement. By construction `submittedStuck` is a subset of `isUrgent` for claims; the UI uses it to render the parallel \"stuck after submission\" badge variant instead of the pre-submit \"file today\" variant. Only populated by list endpoints."
        invoiceNumber:
          type: ["string", "null"]
          description: "Parent invoice group's `invoiceNumber`. Surfaced by list endpoints so the Claims (forensic search) page can render a click-through chip without joining `invoice_groups` on the client. Null for legacy untriaged legs without an `invoiceGroupId`."
        groupPhase:
          type: ["string", "null"]
          enum: ["triage", "ready_to_submit", "submitted", "response_received", "reviewed", "awaiting_reattestation", "closed", null]
          description: "Parent invoice group's canonical `phase`. Mirrored on the leg row by list endpoints so the forensic-search Claims page can show a phase chip without an extra fetch. Null when the leg has no parent group."
        groupMacroPhase:
          type: ["string", "null"]
          enum: ["pre-submit", "in-flight", "response-pending", "mas-action-required", "awaiting-payout", "closed", "on-hold", null]
          description: "Parent invoice group's macro phase, computed via `getGroupMacroPhase`. Mirrored on the leg row by list endpoints so the forensic-search Claims page can render the per-row phase chip with a single fetch. Null when the leg has no parent group."
      required:
        - id
        - confNumber
        - status
        - outcome
        - disposition
        - disputeEmailSent
        - attestationState
        - includedInDispute

    ValidTransitionsResponse:
      type: object
