                      terminal outcome (Denied, Approved, Partially Approved,
                      Non-Issue, Withdrawn, No Action Needed), tells the closure
                      dialogs whether the writer accepts that target on the
                      normal lane (`"normal"`) or requires `override.reason`
                      ≥20 chars (`"override"`).
                  hasActiveSubmission:
                    type: boolean
                  canQueueForPortal:
                    type: boolean
                  hasBeenSubmitted:
                    type: boolean
                    description: "True if at least one portal_submission has ever existed for this claim (active or terminal)."
                  postResponseActions:
                    type: array
                    items:
                      type: string
                  latestResponseType:
                    type: string
                    nullable: true
                  hasResponse:
                    type: boolean
                    description: "True if a portal/email response exists for this claim."
                  awaitingPayorAgainAt:
                    type: ["string", "null"]
                    format: date-time
                    description: "Echo of `invoice_groups.awaiting_payor_again_at` for the claim's group. Surfaced so the Responses Awaiting Review UI can decide whether the 'I replied — wait for payor again' button should be enabled. Always present on group endpoints; on claim endpoints it falls back to the parent group's value when joinable."

  /claims/{id}/status:
    patch:
      operationId: updateClaimStatus
      tags: [claims]
