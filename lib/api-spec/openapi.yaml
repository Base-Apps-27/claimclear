              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/hold:
    post:
      operationId: placeLegOnHold
      tags: [claims]
      summary: Place a leg on hold (per-leg state contract)
      description: |
        Source-state contract: leg sub-status must be `investigating` or `ready`.
        Returns `409 Conflict` with `{ error, expectedState, actualState }` otherwise.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceHoldBody"
      responses:
        "200":
          description: Hold placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"
    delete:
      operationId: removeLegHold
      tags: [claims]
      summary: Remove leg hold (per-leg state contract)
      description: |
        Source-state contract: leg sub-status must be `blocked` and `holdReason`
        must be set (i.e., the hold was placed via /hold, not via SOP).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hold removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/clear-hold:
    post:
      operationId: clearLegHold
      tags: [claims]
      summary: POST alias of `DELETE /claims/{id}/hold`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hold cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/classify:
    post:
      operationId: classifyLeg
      tags: [claims]
      summary: Assign an error type to a leg in `needs_classification`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyLegBody"
      responses:
        "200":
          description: Leg classified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/sop-advance:
    post:
      operationId: sopAdvanceLeg
      tags: [claims]
      summary: Advance one step of the SOP decision-tree walk
      description: |
        Validates the node and answer against the leg's loaded error-type tree.
        A non-terminal answer follows `childId`; a terminal answer stamps
        `sopOutcome` plus either `readyAt` (portal_dispute, dispute) or
        `dropReason` + `droppedAt` (cannot_dispute, non_issue). The `hold`
        outcome routes to the same `blocked` sub-status as a manual hold.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopAdvanceBody"
      responses:
        "200":
          description: SOP step recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/sop-rewind-impact:
    get:
      operationId: getSopRewindImpact
      tags: [claims]
      summary: Read-only impact preview for a per-leg SOP rewind action
      description: |
        Task #525. Powers R5's light-vs-heavy confirm dialog by returning,
        for the requested rewind action, how many answers will be popped,
        the verdict that will be cleared (if currently terminal), the
        walk-tied evidence rows that restart will delete, and whether
        the parent invoice group has a generated dispute draft (or a
        reviewed stamp) that the rewind will need to discard. No state
        changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: action
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SopRewindAction"
        - name: nodeId
          in: query
          description: Target node id — required when `action=jump`.
          schema:
            type: string
      responses:
        "200":
          description: Impact preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SopRewindImpactResponse"
        "400":
          description: Validation error (unknown action, missing nodeId for jump).
        "409":
          description: Action cannot be planned (e.g. no answers to pop).

  /claims/{id}/sop-back-step:
    post:
      operationId: sopBackStepLeg
      tags: [claims]
      summary: Pop the last recorded SOP answer
      description: |
        Task #525. Removes the last `sopAnswers` row, resets `sopNodeId`
        to that row's nodeId, and clears any terminal `sopOutcome` /
        `dropReason` / `readyAt` that was stamped at the popped step.
        Returns 409 with `code: "draft_discard_required"` and the
        impact preview when the parent group has a generated dispute
        draft and the caller did not pass `discardDraft: true`. Returns
        409 when the leg has zero recorded answers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopRewindBody"
      responses:
        "200":
          description: Updated leg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation or draft-discard required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StateConflictResponse"
                  - $ref: "#/components/schemas/SopRewindDraftConflictResponse"

  /claims/{id}/sop-jump:
    post:
      operationId: sopJumpLeg
      tags: [claims]
      summary: Jump a leg's SOP walk back to a prior node
      description: |
        Task #525. Pops every `sopAnswers` row recorded at-or-after
        `body.nodeId`, resets `sopNodeId` to that node, and clears any
        terminal `sopOutcome` / `dropReason` / `readyAt` stamped at
        the popped steps. Same draft-discard contract as
        `POST /claims/{id}/sop-back-step`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopJumpBody"
      responses:
        "200":
          description: Updated leg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation or draft-discard required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StateConflictResponse"
                  - $ref: "#/components/schemas/SopRewindDraftConflictResponse"

  /claims/{id}/sop-restart:
    post:
      operationId: sopRestartLeg
      tags: [claims]
      summary: Restart a leg's SOP walk from the tree root
      description: |
        Task #525. Clears every recorded answer, the terminal
        `sopOutcome` / `dropReason` / `readyAt`, resets `sopNodeId` to
        the tree's `rootId`, and deletes walk-tied `claim_evidence`
        rows (rows where `treeNodeId IS NOT NULL`). The leg's
        `errorTypeId` is preserved. Same draft-discard contract as
        the other rewind endpoints.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopRewindBody"
      responses:
        "200":
          description: Updated leg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation or draft-discard required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StateConflictResponse"
                  - $ref: "#/components/schemas/SopRewindDraftConflictResponse"

  /claims/{id}/exclude:
    post:
      operationId: excludeLeg
      tags: [claims]
      summary: Exclude a leg from the dispute
      description: |
        Mark a `needs_classification` leg as "not a dispute candidate". The
        leg disappears from the dispute work queues but stays visible on the
        invoice as a clean line. Source-state contract:
        `deriveLegSubStatus(leg) === "needs_classification"`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcludeLegBody"
      responses:
        "200":
          description: Leg excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          description: Validation error (e.g. missing note when reason is "other")
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/include:
    post:
      operationId: includeLeg
      tags: [claims]
      summary: Re-include a previously excluded leg in the dispute
      description: |
        Re-include an excluded leg while the parent group is still in
        pre-submit. Two-stage source-state check: leg sub-status must be
        `excluded`, and `getGroupMacroPhase(parentGroup) === "pre-submit"`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludeLegBody"
      responses:
        "200":
          description: Leg re-included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation (leg state or group phase)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/duplicate-of:
    post:
      operationId: markLegDuplicate
      tags: [claims]
      summary: Mark a leg as a sibling duplicate of another leg in the same invoice group
      description: |
        Mark this leg as a sibling duplicate of `primaryClaimId`. The leg's
        derived sub-status becomes `duplicate` and its SOP walk is short-circuited.
        The invoice gauntlet's gate then pairs its resolution with the primary's
        terminal state (see `lib/group-readiness.ts`).

        Validation:
        - Both claims must exist and live in the same invoice group.
        - Self-reference is rejected.
        - The chosen primary cannot itself be a sibling duplicate (no chains).
        - The leg must currently be in `{needs_classification, investigating,
          blocked, ready, dropped}` — refused from `excluded` or `duplicate`.
        - Parent group must still be pre-submit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkLegDuplicateBody"
      responses:
        "200":
          description: Leg marked as sibling duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          description: Validation error (self-reference, cross-group, primary is itself a duplicate, etc.)
        "404":
          description: Either the leg or the primary was not found
        "409":
          description: Source-state contract violation (leg sub-status or group phase)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"
    delete:
      operationId: unmarkLegDuplicate
      tags: [claims]
      summary: Clear the sibling-duplicate pointer on a leg
      description: |
        Clear `duplicate_of_claim_id` so the leg derives back to its underlying
        state (typically `needs_classification`). Pre-submit only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sibling-duplicate pointer cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "404":
          description: Claim not found
        "409":
          description: Leg is not a duplicate, or group is no longer pre-submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/reclassify:
    post:
      operationId: reclassifyLeg
      tags: [claims]
      summary: Rewind a leg back to `needs_classification`
      description: |
        Allowed from `investigating | ready | dropped | blocked`. Refused
        when the leg has already been included in any in-progress or
        submitted portal submission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leg reclassified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/verdict:
    post:
      operationId: recordLegVerdict
      tags: [claims]
      summary: Record an AI-suggested or operator-confirmed verdict
      description: |
        The single sanctioned writer to `claim_verdict`. Operator confirmations
        also refresh denormalized `claims.outcome`, fire MAS-cancel
        derivations on `Denied`, and (when the parent group's
        `reattest_completed_at` is set) graduate Approved/Partial legs from
        `not_required` to `pending` for attestation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVerdictBody"
      responses:
        "200":
          description: Verdict recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimVerdictResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/verdict/draft:
    delete:
      operationId: clearLegVerdictDraft
      tags: [claims]
      summary: Clear the operator's draft verdict pick for a leg (Task #344)
      description: |
        Hard-deletes every `operator_draft` row for the leg so the
        per-leg picker on Responses Awaiting Review can render with no
        pill lit. Wired to the picker's "click the lit pill to clear"
        affordance — operators who pick Approved/Denied by mistake can
        unset the draft without having to confirm the opposite verdict
        first.

        Append-only-ness is preserved for terminal verdict rows
        (`operator_confirmed`, `ai_suggested`) — those are never touched
        by this endpoint. Drafts are explicitly transient state with no
        downstream effects (no MAS, no attestation, no denormalized
        cache write), so hard-delete is safe.

        Source-state contract: the leg's parent invoice group must be
        in the `response-pending` macro phase. Once Step 4 has been
        committed (drafts promoted to `operator_confirmed` and the
        group has moved on), there's no longer a draft to clear and
        the gate refuses the call. The endpoint is idempotent — if
        there are no drafts to clear, it returns `clearedCount: 0`
        without error.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draft cleared (or no drafts existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearLegVerdictDraftResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/per-leg-context:
    post:
      operationId: setLegContext
      tags: [claims]
      summary: Save the operator's per-leg narrative used by the dispute write-up
      description: |
        UI-supporting endpoint. Source-state contract: the leg's parent invoice
        group must be in `pre-submit` (the per-leg context only matters before
        the submission preview is generated). Stores `claims.per_leg_context`
        and emits `leg.per_leg_context_set`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLegContextBody"
      responses:
        "200":
          description: Per-leg context recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/conclude-leg:
    post:
      operationId: concludeLeg
      tags: [claims]
      summary: Resolve a leg to a terminal SOP outcome without walking the tree
      description: |
        Pre-submit shortcut introduced in Task #265 for the Queue Panel A
        per-leg conclusion control. `reason="non_issue"` drops the leg as a
        non-issue; `reason="cannot_dispute"` drops it as non-contestable.
        Mirrors the terminal-step branch of `/sop-advance`: stamps
        `sop_outcome` + `drop_reason` + `dropped_at`, applies MAS
        derivations, and refreshes the leg + group caches.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConcludeLegBody"
      responses:
        "200":
          description: Leg concluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

