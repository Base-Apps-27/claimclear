  /invoice-groups/bulk-submit-to-portal:
    post:
      operationId: bulkSubmitInvoiceGroupsToPortal
      tags: [invoice-groups]
      summary: Queue many reviewed-draft groups for portal submission in one shot
      description: |
        Bulk equivalent of `POST /portal-submissions` that creates a
        pending portal submission row for every group in `groupIds`
        whose dispute draft has already been marked reviewed
        (`draft_reviewed_at IS NOT NULL`). Each accepted group is
        transitioned to `Portal Queued` exactly as the single-group
        endpoint does, so the bot picks them up on the next sweep.

        Per-row gates (groups failing any of these are surfaced in
        `skipped` with a stable reason string, not aborted as a batch):
          * `not_found` — id no longer exists
          * `not_pre_submit` — group has moved past pre-submit
          * `not_reviewed` — `draft_reviewed_at` is null
          * `error_type_unset` — neither the group nor its primary
            claim has an `error_type_id` set; refused so the bulk path
            can never silently file an "Other Issue or Question"
            dispute the operator never picked
          * `legs_unresolved` — at least one disputed leg lacks a
            committed disposition
          * `already_submitted` — group already has an active submission
          * `draft_empty` — `draft_description_html` is blank

        Mirrors the per-row breakdown shape used by
        `POST /invoice-groups/bulk-assign-error-type`, so the UI can
        surface "Queued 12, skipped 3 (#INV-… not_reviewed)".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items:
                    type: integer
              required:
                - groupIds
      responses:
        "200":
          description: Bulk queue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkSubmitToPortalResult"

  /invoice-groups/bulk-reattest:
    post:
      operationId: bulkReattestInvoiceGroups
      tags: [invoice-groups]
      summary: Bulk queue reattest_only groups for re-attestation
      description: |
        Bulk equivalent of the Early Re-attest path on
        `POST /invoice-groups/:id/reattest/queue`. Each group in `groupIds`
        is checked for `outlook=reattest_only` (no disputable legs, at least
        one survivor needing re-attestation). Accepted groups have their
        survivor legs queued for attestation and the group transitioned to
        MAS Eligible / awaiting_reattestation.

        Per-row gates (groups failing any are surfaced in `skipped`):
          * `not_found` — id no longer exists
          * `tour_sample` — tour sample row
          * `terminal_phase` — group is closed or on-hold
          * `has_disputable_legs` — group still has disputable legs
          * `no_survivors` — no survivor legs to queue
          * `no_eligible_legs` — survivors exist but already queued/completed
          * `transaction_error` — write failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items:
                    type: integer
              required:
                - groupIds
      responses:
        "200":
          description: Bulk reattest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReattestResult"

  /invoice-groups/bulk-close:
    post:
      operationId: bulkCloseInvoiceGroups
      tags: [invoice-groups]
      summary: Bulk close nothing_to_do groups as Withdrawn
      description: |
        Bulk close groups whose outlook is `nothing_to_do` (every leg is
        cannot_dispute, denied, or excluded — no disputable legs and no
        survivors). Each accepted group is transitioned to Resolved /
        Withdrawn with closureReason=cannot_dispute via
        `transitionGroupStatusAndOutcome`.

        Per-row gates (groups failing any are surfaced in `skipped`):
          * `not_found` — id no longer exists
          * `tour_sample` — tour sample row
          * `already_closed` — group is already closed
          * `no_legs` — group has no claims
          * `has_disputable_legs` — group still has disputable legs
          * `has_survivors` — group has survivors (use bulk-reattest instead)
          * `transition_error: <msg>` — status transition failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items:
                    type: integer
              required:
                - groupIds
      responses:
        "200":
          description: Bulk close result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCloseResult"

  /invoice-groups/bulk-approve:
    post:
      operationId: bulkApproveInvoiceGroups
      tags: [invoice-groups]
      summary: Bulk-approve high-confidence AI Approval responses
      description: |
        Bulk-approve a multi-selection of high-confidence AI-classified
        Approval responses on the Responses Awaiting Review page. For each
        portal_response id passed in, the server re-validates the
        AI/approval/high-confidence gate, then for the parent invoice
        group: writes Approved operator-confirmed verdicts on every
        disputed leg, queues each eligible leg for re-attestation, and
        stamps the group's `awaiting_payor_again_at` so it falls off the
        Responses Awaiting Review card.

        A single `bulkApproveRunId` UUID is generated per request and
        stamped on every audit row written by the run, plus tagged on a
        per-group `notes` row carrying the reviewer's required note.

        Hard cap: 200 portal_response ids per request. Server processes
        the eligible set in batches of 10. Each group is wrapped in its
        own transaction — one bad group never poisons the batch.

        Per-row gates (rows failing any are surfaced in `skipped` with
        reason; idempotent re-runs land here as no-ops, not failures):
          * `not_found` — portal_response id no longer exists
          * `not_ai` — `classifier_source` is not `ai`
          * `partial_approval` — response_type is `partial_approval`
          * `not_approval` — response_type is not `approval`
          * `low_confidence` — `classifier_confidence` is not `high`
          * `no_group` — response is not linked to an invoice group
          * `group_not_found` — linked invoice group has been deleted
          * `tour_sample` — group is the tour sample row
          * `presence_locked` — another reviewer is currently viewing the group
          * `active_submission` — a portal submission is in flight
          * `no_disputed_legs` — group has no disputable legs to approve
          * `already_queued` — every disputed leg is already queued or
            completed for re-attestation (idempotent re-run)
        Rows that error mid-transaction land in `failed` with reason.

        Use the companion endpoint
        `POST /invoice-groups/bulk-approve/preflight` to evaluate
        eligibility without writing anything (the dialog calls this
        on open to surface presence_locked / active_submission /
        already_queued / no_disputed_legs ahead of commit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portalResponseIds, note]
              properties:
                portalResponseIds:
                  type: array
                  description: Portal-response ids to bulk-approve. Cap 200.
                  maxItems: 200
                  items:
                    type: integer
                note:
                  type: string
                  description: Required short note recorded once and applied to every group's audit trail.
                  minLength: 1
                bulkApproveRunId:
                  type: string
                  description: |
                    Optional client-supplied UUID for the run. When provided,
                    the server keys its in-memory progress tracker off this
                    id so the client can poll
                    `GET /invoice-groups/bulk-approve/{bulkApproveRunId}/progress`
                    while the request is in flight. If omitted, the server
                    generates one and returns it in the response (no polling
                    is possible in that case).
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveResult"
        "400":
          description: Validation error (missing fields, empty array, cap exceeded, missing note)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string }
                  cap: { type: integer }

  /invoice-groups/bulk-approve/{bulkApproveRunId}/progress:
    get:
      operationId: getBulkApproveProgress
      tags: [invoice-groups]
      summary: Poll the progress of an in-flight bulk-approve run
      description: |
        Returns the live progress of a bulk-approve run, keyed off the
        `bulkApproveRunId` the client supplied with `POST /invoice-groups/bulk-approve`.
        Backed by an in-memory tracker the POST handler updates after
        each per-group transaction commits or skips.

        Useful for showing a "X of N approved, Y skipped, Z failed"
        progress bar in the confirmation dialog while the POST request
        is still streaming through its server-side batches.

        Returns 404 if the run id is unknown (it was never registered,
        or the tracker has aged out of the in-memory cache).
      parameters:
        - name: bulkApproveRunId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkApproveProgress"
        "404":
          description: Unknown run id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

