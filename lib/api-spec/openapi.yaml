        runs7d:
          type: integer
        failures7d:
          type: integer
        durationSparkline:
          type: array
          description: |
            One bucket per day for the last 7 days (oldest first). Value
            is the mean duration in ms for runs that finished that day,
            or null if no runs landed.
          items:
            type: integer
            nullable: true

