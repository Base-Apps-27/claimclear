            invoiceNumber:
              type: string
            rideCount:
              type: integer
            totalAmount:
              type: ["string", "null"]
            status:
              type: string
          required:
            - id
            - invoiceNumber
            - rideCount
            - status
      required:
        - error
        - existingGroup

    UpdateInvoiceGroupBody:
      type: object
      properties:
        errorDetails:
          type: string
        errorTypeId:
