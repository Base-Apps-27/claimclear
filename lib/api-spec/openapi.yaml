    CompleteMasActionBody:
      type: object
      properties:
        note:
          type: ["string", "null"]
        masReference:
          type: ["string", "null"]
          description: Optional MAS reference number recorded in the audit trail.

    SetGroupContextBody:
      type: object
      required: [context]
      properties:
        context:
          type: string

    ConfirmReadbackBody:
      type: object
      required: [readback]
