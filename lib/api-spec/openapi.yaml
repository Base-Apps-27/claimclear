  /storage/uploads:
    put:
      tags: [Storage]
      operationId: uploadFile
      summary: Upload a file to object storage
      description: >
        Server-mediated upload. Send raw file bytes as the request body.
        Content-Type must be an allowed MIME type (image/png, image/jpeg,
        image/gif, image/webp, image/heic, image/heif, image/tiff, image/bmp,
        application/pdf). Maximum file size is 50 MB.
      parameters:
        - name: x-upload-name
          in: header
          required: false
          schema:
            type: string
          description: Original filename (informational).
        - name: Content-Length
          in: header
          required: false
          schema:
            type: integer
          description: Declared file size in bytes; rejected immediately if > 52428800.
      requestBody:
        required: true
        content:
          image/png: {}
          image/jpeg: {}
          image/gif: {}
          image/webp: {}
          image/heic: {}
          image/heif: {}
          image/tiff: {}
          image/bmp: {}
          application/pdf: {}
      responses:
        '200':
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '413':
          description: File exceeds maximum allowed size.
        '415':
          description: Unsupported media type.

  /storage/reply-attachments/stage:
    put:
      tags: [Storage]
      operationId: stageReplyAttachment
      summary: Stage a file for an outbound email reply
      description: >
        Task #713 — staged-upload endpoint for the reply composer. Streams
        the file bytes to object storage AND records a
        `reply_attachment_staging` row pinned to the calling user.
        Returns an opaque `stagedId` that the composer hands back on the
        reply request — clients never get to choose the storage key or
        claim a different MIME / size than what the server recorded here.
        Stricter MIME allowlist than `/storage/uploads`: only PNG, JPG,
        GIF, WebP, and PDF are accepted.
      parameters:
        - name: x-upload-name
          in: header
          required: false
          schema: { type: string }
          description: Original filename (informational; clamped to 255 chars).
        - name: Content-Length
          in: header
          required: false
          schema: { type: integer }
          description: Declared file size; rejected immediately if it exceeds the 25 MB reply cap.
      requestBody:
        required: true
        content:
          image/png: {}
          image/jpeg: {}
          image/gif: {}
          image/webp: {}
          application/pdf: {}
      responses:
        '200':
          description: File staged successfully.
          content:
            application/json:
              schema:
                type: object
                required: [stagedId, name, contentType, size]
                properties:
                  stagedId:
                    type: string
                    description: Opaque id to send back on the reply payload's `attachments[].stagedId`.
                  name:
                    type: string
                  contentType:
                    type: string
                  size:
                    type: integer
        '413':
          description: File exceeds maximum allowed size.
        '415':
          description: Unsupported media type for a reply attachment.

  /storage/reply-attachments/stage/{stagedId}:
    delete:
      tags: [Storage]
      operationId: deleteReplyAttachmentStage
      summary: Drop a staged reply attachment
      description: >
        Best-effort: lets the composer drop a staged file when the operator
        removes the chip before sending. Only the user that staged the
        upload may delete it. Idempotent — already-purged ids return
        `{ ok: true }`.
      parameters:
        - name: stagedId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Staged upload deleted (or never existed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: Staged upload belongs to a different user.
        '409':
          description: Staged upload was already attached to a sent reply.

  /storage/reply-attachments/stage-from-evidence:
    post:
      tags: [Storage]
      operationId: stageReplyAttachmentFromEvidence
      summary: Re-stage an existing case attachment for an outbound reply
      description: >
        Companion to `PUT /storage/reply-attachments/stage`. Instead of
        uploading bytes, the client passes the storage URL of a file
        already on the case (returned by `GET /invoice-groups/{id}/reply-evidence`).
        The server confirms the URL is reachable from that group's
        evidence rows, copies the bytes into a fresh staging blob, and
        returns the same `{stagedId, name, contentType, size}` shape the
        upload endpoint returns. The composer then treats the result
        like any other staged attachment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, url]
              properties:
                groupId:
                  type: integer
                  description: Invoice group whose evidence pool the URL must come from.
                url:
                  type: string
                  description: Object-storage URL (must start with `/objects/`) returned by `listInvoiceGroupReplyEvidence`.
                name:
                  type: ["string", "null"]
                  description: Display filename. Optional; server falls back to the URL basename.
      responses:
        '200':
          description: File copied into staging.
          content:
            application/json:
              schema:
                type: object
                required: [stagedId, name, contentType, size]
                properties:
                  stagedId: { type: string }
                  name: { type: string }
                  contentType: { type: string }
                  size: { type: integer }
        '400':
          description: Invalid url, groupId, or unsupported MIME type for a reply attachment.
        '403':
          description: URL is not part of the named invoice group's evidence pool.
        '404':
          description: Invoice group not found, or the object no longer exists in storage.
        '413':
          description: File exceeds the reply-attachment size cap.

