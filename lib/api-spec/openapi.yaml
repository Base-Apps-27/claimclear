  /admin/expired-sweep:
    post:
      operationId: runExpiredSweep
      tags: [admin]
      summary: Manually run the nightly Expired sweep
      description: |
        Retires every invoice group whose 30-day filing deadline has
        slipped while still in a pre-submit status (`New`, `Needs
        Evidence`, `On Hold`, `Generating Email`). Companion to the
        nightly 6 AM ET cron — idempotent, safe to re-run.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: "If true, identify eligible rows but do not transition them."
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                properties:
                  expired:
                    type: integer
                    description: Number of groups transitioned to Expired (or that would be, if dryRun).
                  skipped:
                    type: integer
                    description: Number of groups skipped due to a transition error (e.g. mid-flight submission).
                  byStatus:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Per-source-status breakdown of the retired rows.
                  sampleGroupIds:
                    type: array
                    items:
                      type: integer
                    description: First few group ids that were transitioned, for the audit toast.
                  dryRun:
                    type: boolean
                required:
                  - expired
                  - skipped
                  - byStatus
                  - sampleGroupIds
                  - dryRun

