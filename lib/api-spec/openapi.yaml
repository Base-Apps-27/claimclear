        id:
          type: ["string", "null"]
      required:
        - name

    ClosureReviewBody:
      type: object
      description: Editable post-closure review fields.
      properties:
        closureReviewNotes:
          type: ["string", "null"]
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        addressed:
          type: boolean
          description: Convenience flag — when true, sets closureReviewState=acknowledged and stamps closureAddressedAt/By; when false, clears those fields.

    WithdrawalRow:
      type: object
      description: A unified row representing a closed claim or invoice group.
      properties:
        kind:
          type: string
          enum: [claim, invoice_group]
        id:
          type: integer
        identifier:
          type: string
          description: Conf # for claims, invoice number for groups.
        clientNumber:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        outcome:
          type: string
        closureReason:
          type: string
          enum: [cannot_dispute, non_issue, denied_by_payor]
        closureCategory:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        amount:
          type: ["string", "null"]
        closedAt:
          type: ["string", "null"]
        closedBy:
          type: ["string", "null"]
          description: User id of the staff member who closed this item, derived from the latest closure-related audit log. Null if the closer can no longer be resolved.
        closedByName:
          type: ["string", "null"]
          description: Display name of the staff member who closed this item.
        closedByEmail:
          type: ["string", "null"]
          description: Email of the staff member who closed this item.
        closureReviewState:
          type: ["string", "null"]
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        addressed:
          type: boolean
      required:
        - kind
        - id
        - identifier
        - outcome
        - closureReason
        - addressed

