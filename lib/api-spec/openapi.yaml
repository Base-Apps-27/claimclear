            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          schema:
            type: string
        - name: createdFrom
          in: query
          schema:
            type: string
        - name: createdTo
          in: query
          schema:
            type: string
        - name: amountMin
          in: query
          schema:
            type: string
        - name: amountMax
          in: query
          schema:
            type: string
        - name: serviceDateFrom
          in: query
          schema:
            type: string
        - name: serviceDateTo
          in: query
          schema:
            type: string
        - name: carNumber
          in: query
          schema:
            type: string
        - name: clientNumber
          in: query
          schema:
            type: string
        - name: expiring
