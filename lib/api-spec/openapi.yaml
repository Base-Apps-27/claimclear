        note:
          type: ["string", "null"]
        confidence:
          type: ["string", "null"]
        reasoning:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: ["string", "null"]
        inspectionTimeMs:
          type: ["integer", "null"]

    ExcludeLegBody:
