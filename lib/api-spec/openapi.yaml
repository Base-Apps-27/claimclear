          type: string
          nullable: true
        status:
          type: string
          enum: [running, completed, degraded, failed]
        message:
          type: string
          nullable: true

    PortalScrapeDetailResponse:
      type: object
      required: [lastRun, submissions]
      properties:
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/PortalScrapeDetailLastRun'
            - type: 'null'
        considered:
          type: integer
          nullable: true
        scraped:
          type: integer
          nullable: true
        skipped:
          type: integer
          nullable: true
        errored:
          type: integer
          nullable: true
        newResponses:
          type: integer
          nullable: true
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/PortalScrapeDetailRow'
        # Task #738. Capped error-row digest: at most 50 entries
        # (most recent first); `errorOverflow` is the count of
        # additional error rows not included so the UI can render a
        # "+N more" affordance on the panel.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PortalScrapeDetailRow'
        errorOverflow:
          type: integer

    WorkerActivityResponse:
      type: object
      required: [isRunning, lastRun, recentRuns, pendingDueCount, overdueCount, overdueGraceMinutes, nextSweepAt, lastSweepAt, lastSuccessfulSubmission, lastFailedSubmission]
      properties:
        isRunning:
          type: boolean
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/WorkerRunSummary"
            - type: "null"
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRunSummary"
        pendingDueCount:
          type: integer
        overdueCount:
          type: integer
          description: |
            Pending submissions that have missed an expected scheduled
            sweep (8/11/14/18/22 ET) plus the grace window. Always 0 when
            the most recent expected sweep hasn't actually run — that
            condition is reported by the cron tile, not the worker tile.
        overdueGraceMinutes:
          type: integer
          description: |
            Minutes of grace allowed after a scheduled sweep fires before
            still-pending rows are flagged as past their cycle.
        nextSweepAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the next scheduled portal_batch_sweeper fire, derived from the locked cron expression. Null if the expression cannot be parsed.
        lastSweepAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the most recent expected portal_batch_sweeper fire (already past its grace window). Null when no past fire has had its grace window yet.
        lastSuccessfulSubmission:
          oneOf:
            - $ref: "#/components/schemas/WorkerSubmissionEvent"
            - type: "null"
        lastFailedSubmission:
          oneOf:
            - $ref: "#/components/schemas/WorkerFailedSubmissionEvent"
            - type: "null"
        lastPortalScrape:
          oneOf:
            - $ref: "#/components/schemas/PortalScrapeSummary"
            - type: "null"
          description: |
            Task #738. Most recent `portal_response_sync` summary; null
            until the cron has run at least once after deploy.

    WorkerSubmissionEvent:
      type: object
      required: [submissionId, invoiceGroupId, at]
      properties:
        submissionId:
          type: integer
        invoiceGroupId:
          type: integer
        confNumber:
          type: string
          nullable: true
        submittedAt:
          type: string
          nullable: true
        at:
          type: string
          description: ISO-8601 updated_at on the row.

    WorkerFailedSubmissionEvent:
      type: object
      required: [submissionId, invoiceGroupId, attempts, maxAttempts, at]
      properties:
        submissionId:
          type: integer
        invoiceGroupId:
          type: integer
        attempts:
          type: integer
        maxAttempts:
          type: integer
        errorMessage:
          type: string
          nullable: true
        at:
          type: string
          description: ISO-8601 updated_at on the row.

    SystemHealthRollupComponent:
      type: object
      required: [name, status, detail]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, failed]
        detail:
          type: string
          nullable: true
        informational:
          type: boolean
          description: |
            True when `detail` is a transient informational note from the
            rollup itself (e.g. "Awaiting first scheduled run since server
            boot", "Skipped one scheduled tick — recovering"). The UI
            surfaces only these as informational notes, so normal "ok"
            runs whose `detail` is just the last run's message are not
            treated as alerts.

    SystemHealthRollupResponse:
      type: object
      required: [overall, components, lastWorkerRun, workerRunning, overdueCount, overdueGraceMinutes, nextSweepAt, lastSweepAt, generatedAt, bootedAt]
      properties:
        overall:
          type: string
          enum: [ok, degraded, failed]
        components:
          type: array
          items:
            $ref: "#/components/schemas/SystemHealthRollupComponent"
        lastWorkerRun:
          oneOf:
            - $ref: "#/components/schemas/WorkerRunSummary"
            - type: "null"
        workerRunning:
          type: boolean
        overdueCount:
          type: integer
        overdueGraceMinutes:
          type: integer
          description: |
            Minutes of grace allowed after a scheduled sweep fires before
            still-pending rows are flagged as past their cycle.
        nextSweepAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the next scheduled portal_batch_sweeper fire. Mirrors the worker-activity field so banner/UI consumers don't need a second request.
        lastSweepAt:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the most recent expected portal_batch_sweeper fire (already past its grace window). Null when no past fire has had its grace window yet.
        generatedAt:
          type: string
        bootedAt:
          type: string
          description: ISO timestamp of when the API server process started. Used by the System Health page to contextualize "awaiting first scheduled run" notes.
        lastPortalScrape:
          oneOf:
            - $ref: "#/components/schemas/PortalScrapeSummary"
            - type: "null"
          description: |
            Task #738. Most recent `portal_response_sync` summary so the
            "Last portal scrape" panel header on System Health can render
            without an extra admin-only fetch (the per-row drill-down is
            still admin-only).

    ClassifierVerdictBin:
      type: string
      enum: [approval, denial, partial_approval, info_request, acknowledgment, other, abstain]
      description: |
        Verdict bins surfaced on the LLM-classifier dashboard. Mirrors the
        six classifier decisions plus an explicit `abstain` bin for rows
        where the AI call was attempted but failed (so a Haiku outage is
        visible separately from genuine `other` verdicts).

    ClassifierStatsVerdictCounts:
      type: object
      required: [approval, denial, partial_approval, info_request, acknowledgment, other, abstain]
      properties:
        approval: { type: integer }
        denial: { type: integer }
        partial_approval: { type: integer }
        info_request: { type: integer }
        acknowledgment: { type: integer }
        other: { type: integer }
        abstain: { type: integer }

    ClassifierStatsDay:
      type: object
      required: [day, verdicts, phraseSignatureCount, aiAttemptCount, aiCallCount, abstainCount, totalRows, spendUsd, inputTokens, outputTokens]
      properties:
        day:
          type: string
          description: ISO YYYY-MM-DD (UTC bucket).
        verdicts:
          $ref: "#/components/schemas/ClassifierStatsVerdictCounts"
        phraseSignatureCount:
          type: integer
          description: Rows where the deterministic phrase classifier ran (no AI call).
        aiAttemptCount:
          type: integer
          description: Rows where the AI call was attempted (ai + abstain).
        aiCallCount:
          type: integer
          description: Rows where the AI call returned a verdict.
        abstainCount:
          type: integer
          description: Rows where the AI call failed.
        totalRows:
          type: integer
        spendUsd:
          type: number
        inputTokens:
          type: integer
        outputTokens:
          type: integer

    ClassifierStatsTotals:
      type: object
      required: [rows, aiCalls, spendUsd, inputTokens, outputTokens]
      properties:
        rows: { type: integer }
        aiCalls: { type: integer }
        spendUsd: { type: number }
        inputTokens: { type: integer }
        outputTokens: { type: integer }

    ClassifierStatsAlert:
      type: object
      required: [kind, message, recentRate, baselineRate, recentSample]
      properties:
        kind:
          type: string
          enum: [spike_other, spike_abstain]
        message:
          type: string
        recentRate:
          type: number
          description: Most-recent-day rate that tripped the alert (0..1).
        baselineRate:
          type: number
          description: Trailing-window baseline rate the recent rate is compared to (0..1).
        recentSample:
