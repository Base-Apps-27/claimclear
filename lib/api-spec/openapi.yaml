          application/json:
            schema:
              $ref: "#/components/schemas/AttestationActionBody"
      responses:
        "200":
          description: Claim queued for attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/attest/confirm:
    post:
      operationId: confirmQueuedAttestation
      tags: [attestation]
      summary: Confirm attestation for a previously-queued claim (queue-review flow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationActionBody"
      responses:
