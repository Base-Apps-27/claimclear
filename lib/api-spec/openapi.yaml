          items:
            $ref: "#/components/schemas/RepeatOffenderMember"
        driverGroupsTotal:
          type: integer
          description: "Total distinct vehicles with at least one rejection in the window."
        memberGroupsTotal:
          type: integer
          description: "Total distinct members with at least one rejection in the window."
      required:
