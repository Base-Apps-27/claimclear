kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.development.env]
# Pin the wall-clock timezone for the API process. All "today" / urgency /
# 30-day-deadline math is anchored to America/New_York via Intl, but we
# still pin TZ here so any Date.toLocale*, audit timestamps, and cron
# tz-defaulting helpers also agree with the office calendar. See Task #298.
TZ = "America/New_York"

[services.production]

[services.production.build]
# DB migrations are NOT chained here — they run in the root `.replit`
# `[deployment.build]` pre-build hook so the schema is advanced exactly
# once per publish, in its own clearly-labelled build-log line. See Task #340.
#
# We DO still chain `pnpm --filter @workspace/claimclear run build` here
# because api-server statically serves claimclear's dist at runtime
# (artifacts/api-server/src/app.ts:76-80 — `express.static(clientDistPath)`
# + a `/{*splat}` SPA catch-all that returns claimclear/dist/public/index.html).
# api-server's own esbuild build (build.mjs) only bundles the API; nothing
# else builds claimclear's dist for production. claimclear is not
# registered in `.replit`'s `[[artifacts]]`, so the deployer does not
# build it as its own artifact either. Removing this chain leaves prod
# with no index.html to serve at `/`. If we ever migrate to having
# claimclear deployed as its own routable artifact, this chain can drop.
#
# Playwright must be installed at build time because the api-server uses
# it at runtime to drive the MAS portal (see batch-worker.ts / save-session.ts).
args = ["sh", "-c", "PORT=5173 BASE_PATH='/' pnpm --filter @workspace/claimclear run build && pnpm --filter @workspace/api-server run build && PLAYWRIGHT_BROWSERS_PATH=./pw-browsers node artifacts/api-server/node_modules/playwright/cli.js install chromium"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
PLAYWRIGHT_BROWSERS_PATH = "./pw-browsers"
# Pin the wall-clock timezone in production so the autoscaled container's
# default UTC clock cannot leak into urgency math, audit timestamps, or
# cron firing windows. The deadline helpers in lib/dates.ts anchor on
# America/New_York via Intl regardless, but pinning TZ keeps every other
# Date.toLocale* call (logs, briefs, cron-parser ticks) on the same
# calendar as the office. See Task #298.
TZ = "America/New_York"

[services.production.health.startup]
path = "/api/healthz"
