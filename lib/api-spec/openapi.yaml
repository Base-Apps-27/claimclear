components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        role:
          type: string
        status:
          type: string
      required:
        - id
        - email
        - role
        - status

    ClaimResponse:
      type: object
      properties:
        id:
          type: integer
        invoiceGroupId:
          type: ["integer", "null"]
        confNumber:
          type: string
        date:
          type: ["string", "null"]
        refNumber:
          type: ["string", "null"]
        clientNumber:
          type: ["string", "null"]
        carNumber:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        errorTypeId:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
        status:
          type: string
          enum: ["New", "Needs Review", "Needs Evidence", "Processed", "Portal Queued", "Generating Email", "Ready to Review", "Awaiting Response", "On Hold", "Resolved", "Denied"]
        outcome:
          type: string
          enum: ["Pending", "Approved", "Denied", "Partially Approved", "Non-Issue", "Withdrawn"]
        closureReason:
          type: ["string", "null"]
          enum: ["denied_by_payor", "cannot_dispute", "non_issue", null]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        triageNotes:
          type: ["string", "null"]
        triagedAt:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        invoiceNumbers:
          type: ["string", "null"]
        payorEmail:
          type: ["string", "null"]
        disputeEmailSent:
          type: boolean
        disputeEmailSentAt:
          type: ["string", "null"]
        importBatch:
          type: ["string", "null"]
        evidenceFiles:
          type: ["object", "null"]
        evidenceNotes:
          type: ["string", "null"]
        evidenceChecklist:
          type: ["object", "null"]
        generatedEmailSubject:
          type: ["string", "null"]
        generatedEmailBody:
          type: ["string", "null"]
        generatedEmailAt:
          type: ["string", "null"]
        # workflow_progress JSONB column dropped (Task #195 — per-claim →
        # per-invoice transition). The discrete per-leg state-machine
        # columns (sopNodeId, sopOutcome, dropReason, attestationState,
        # …) replace it; surfaced via the contracts task.
        holdReason:
          type: ["string", "null"]
        holdPendingFrom:
          type: ["string", "null"]
        holdPlacedAt:
          type: ["string", "null"]
        attestationState:
          type: string
          enum: ["not_required", "pending", "queued", "completed"]
          description: "Re-attestation tracking state. `not_required` for any non-Approved outcome, `pending` immediately after an Approved verdict, `queued` if parked for someone with portal access, `completed` once the operator confirms they re-attested in the payor portal."
        attestedAt:
          type: ["string", "null"]
        attestedBy:
          type: ["string", "null"]
        attestationNote:
          type: ["string", "null"]
        attestationQueuedAt:
          type: ["string", "null"]
        attestationQueuedBy:
          type: ["string", "null"]
        includedInDispute:
          type: boolean
          description: "False when the leg is intentionally excluded from any dispute submission for its parent invoice group (a clean leg riding alongside disputed siblings)."
        sopNodeId:
          type: ["string", "null"]
          description: "ID of the current decision-tree node the leg is parked on. Null until the operator opens the SOP walk."
        sopOutcome:
          type: ["string", "null"]
          enum: ["portal_dispute", "dispute", "hold", "cannot_dispute", "non_issue", null]
          description: "Terminal SOP outcome stamped when the operator reaches a leaf option in the decision tree."
        dropReason:
          type: ["string", "null"]
          enum: ["cannot_dispute", "non_issue", null]
          description: "Reason the leg was dropped from dispute. Set when sopOutcome is `cannot_dispute` or `non_issue`."
        readyAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamp of when the leg flipped to `ready` sub-status (sopOutcome=`portal_dispute|dispute`)."
        droppedAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamp of when the leg flipped to `dropped` sub-status."
        perLegContext:
          type: ["string", "null"]
          description: "Operator-authored narrative specific to this leg, used by the dispute write-up assembly."
        masActionRequired:
          type: ["string", "null"]
          enum: ["cancel", "none", null]
          description: "Whether a downstream MAS-action (cancel) is required for this leg. Stamped automatically on Denied verdicts; `none` when the verdict path doesn't need MAS intervention."
        masActionCompletedAt:
          type: ["string", "null"]
          format: date-time
          description: "Operator-confirmed completion stamp for the MAS action."
        masActionCompletedBy:
          type: ["string", "null"]
        masActionNote:
          type: ["string", "null"]
        latestVerdict:
          oneOf:
            - $ref: "#/components/schemas/ClaimVerdictResponse"
            - type: "null"
          description: "Latest row from `claim_verdict` regardless of source. Only populated by the invoice-group detail endpoint so the picker can render with one fetch."
        latestAiSuggestion:
          oneOf:
            - $ref: "#/components/schemas/ClaimVerdictResponse"
            - type: "null"
          description: "Latest `ai_suggested` row from `claim_verdict`. Only populated by the invoice-group detail endpoint."
        createdAt:
          type: string
        updatedAt:
          type: string
        effectiveDaysLeft:
          type: ["integer", "null"]
          description: "Calendar days until the effective filing deadline (weekend deadlines shift back to Friday). Null when no service date. Only populated by list endpoints."
        isUrgent:
          type: boolean
          description: "True when the effective filing deadline is today or earlier — must be filed today, cannot wait until tomorrow. Only populated by list endpoints."
      required:
        - id
        - confNumber
        - status
        - outcome
        - disputeEmailSent
        - attestationState
        - includedInDispute

    ValidTransitionsResponse:
      type: object
      properties:
        validStatuses:
          type: array
          items:
            type: string
        validOutcomes:
          type: array
          items:
            type: string
        canQueueForPortal:
          type: boolean
        hasActiveSubmission:
          type: boolean
        hasBeenSubmitted:
          type: boolean
          description: "True if at least one portal_submission has ever existed for this entity (active or terminal). For invoice groups, considers submissions linked to the group via portal_submissions.invoice_group_id."
        postResponseActions:
          type: array
          items:
            type: string
        latestResponseType:
          type: ["string", "null"]
        hasResponse:
          type: boolean
          description: "True if a portal/email response exists for this entity. For invoice groups, considers responses linked directly to the group OR via any of its child claims."
      required:
        - validStatuses
        - validOutcomes
        - canQueueForPortal
        - hasActiveSubmission
        - postResponseActions

    InvoiceGroupResponse:
      type: object
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        clientNumber:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        errorTypeId:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        status:
          type: string
          enum: ["New", "Needs Review", "Needs Evidence", "Processed", "Portal Queued", "Generating Email", "Ready to Review", "Awaiting Response", "On Hold", "Resolved", "Denied"]
        outcome:
          type: string
          enum: ["Pending", "Approved", "Denied", "Partially Approved", "Non-Issue", "Withdrawn"]
        closureReason:
          type: ["string", "null"]
          enum: ["denied_by_payor", "cannot_dispute", "non_issue", null]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        rideCount:
          type: integer
        totalAmount:
          type: ["string", "null"]
        # workflow_progress JSONB column dropped (Task #195). The new
        # group-level lifecycle columns (lifecyclePhase, groupContext,
        # readyToSubmitAt, submittedAt, …) replace it; surfaced via the
        # contracts task.
        holdReason:
          type: ["string", "null"]
        holdPendingFrom:
          type: ["string", "null"]
        holdPlacedAt:
          type: ["string", "null"]
        triageNotes:
          type: ["string", "null"]
        triagedAt:
          type: ["string", "null"]
        disputeEmailSent:
          type: boolean
        disputeEmailSentAt:
          type: ["string", "null"]
        generatedEmailSubject:
          type: ["string", "null"]
        generatedEmailBody:
          type: ["string", "null"]
        generatedEmailAt:
          type: ["string", "null"]
        evidenceFiles:
          type: ["object", "null"]
        evidenceNotes:
          type: ["string", "null"]
        evidenceChecklist:
          type: ["object", "null"]
        payorEmail:
          type: ["string", "null"]
        importBatch:
          type: ["string", "null"]
        reattestRequired:
          type: boolean
          description: "True when the group must be re-attested in the MAS portal after per-leg verdict capture. Drives the MAS Action checklist's re-attest subsection."
        reattestCompletedAt:
          type: ["string", "null"]
          description: "Timestamp the operator confirmed the group-level re-attestation. Once set, the group transitions to `awaiting-payout`."
        reattestCompletedBy:
          type: ["string", "null"]
        reattestNote:
          type: ["string", "null"]
        macroPhase:
          type: ["string", "null"]
          enum: ["pre-submit", "in-flight", "response-pending", "mas-action-required", "awaiting-payout", "closed", "on-hold", null]
          description: "Server-derived macro phase used by the per-invoice transition surfaces. Only populated by endpoints that depend on it (group detail, MAS list, etc.)."
        createdAt:
          type: string
        updatedAt:
          type: string
        earliestDate:
          type: ["string", "null"]
          description: "Earliest service date across the group's claims (MIN). Drives the filing deadline. Only populated by list endpoints."
        effectiveDaysLeft:
          type: ["integer", "null"]
          description: "Calendar days until the effective filing deadline (weekend deadlines shift back to Friday). Null when no service date. Only populated by list endpoints."
        isUrgent:
          type: boolean
          description: "True when the effective filing deadline is today or earlier — must be filed today, cannot wait until tomorrow. Only populated by list endpoints."
        # Group-level orchestration columns introduced by Task #195. Drive
        # the Aggregate Context, Understanding Readback, Generate Submission
        # Preview, and Re-attest steps in the per-invoice macro flow.
        groupContext:
          type: ["string", "null"]
          description: "Operator-authored narrative for the entire invoice group, used to seed the dispute write-up."
        understandingReadback:
          type: ["string", "null"]
          description: "Confirmed AI readback string of the group + leg contexts, captured immediately before the operator generates the dispute preview."
        understandingReadbackAt:
          type: ["string", "null"]
          format: date-time
        understandingReadbackBy:
          type: ["string", "null"]
        previewGeneratedAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamp of when the operator generated the dispute submission preview. Gates the transition to in-flight."
        previewGeneratedBy:
          type: ["string", "null"]
        legSubStatusCounts:
          type: ["object", "null"]
          description: "Per-leg sub-status breakdown for the group. Only populated by the list endpoint when the group's macro phase is `pre-submit`."
          properties:
            excluded:
              type: integer
            needs_classification:
              type: integer
            investigating:
              type: integer
            blocked:
              type: integer
            ready:
              type: integer
            dropped:
              type: integer
      required:
        - id
        - invoiceNumber
        - status
        - outcome
        - rideCount
        - disputeEmailSent
        - reattestRequired

    NeedsClassificationInboxClaim:
      type: object
