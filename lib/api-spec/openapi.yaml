  /invoice-groups/bulk-generate-and-review:
    post:
      operationId: bulkGenerateAndReviewInvoiceGroups
      tags: [invoice-groups]
      summary: Bulk generate AI writeup and mark reviewed for packageable groups
      description: |
        Bulk equivalent of the single-group Gauntlet flow. For each group
        in `groupIds`, runs the AI preview generation (populating
        `draftSubject` / `draftDescriptionHtml` and the AI baseline fields),
        then stamps `draftReviewedAt` so the group is ready for the portal
        queue. Processes sequentially to respect the AI provider.

        Per-row gates (groups failing any are surfaced in `skipped`):
          * `not_found` — id no longer exists
          * `already_reviewed` — draft already has `draftReviewedAt` set
          * `not_packageable: <reason>` — group fails readiness gate
          * `generation_failed: <msg>` — AI generation error

        Resumable — re-running only processes groups that still need it.
        Groups that already have a reviewed draft are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items:
                    type: integer
                  description: List of group IDs to process.
              required:
                - groupIds
      responses:
        "200":
          description: Bulk generate and review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkGenerateAndReviewResult"

  /invoice-groups/{id}/valid-transitions:
    get:
      operationId: getInvoiceGroupValidTransitions
      tags: [invoice-groups]
      summary: Get valid transitions for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Valid transitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidTransitionsResponse"

  /invoice-groups/{id}/payor-denial-reason:
    post:
      operationId: recordPayorDenialReason
      tags: [invoice-groups]
      summary: Record the payor's denial reason for the most recent response
      description: |
        Captures the operator's classification of *why the payor denied/pushed
        back on our dispute*, while reviewing an inbound response on the
        Responses Awaiting Review page (Task #321).

        This is a lightweight per-response signal — it does NOT close the
        group, does NOT change `status`/`outcome`, and is intentionally
        separate from the `closure_*` fields. The group must be in
        `Needs Review` and have at least one inbound `portal_response`;
        otherwise responds 409.

        Re-recording the same reason is allowed and just bumps the
        `payorDenialReasonAt` timestamp.

        Writes an audit log with action `payor_denial_reason_recorded`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPayorDenialReasonRequest"
      responses:
        "200":
          description: Payor denial reason recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "400":
          description: Bad request — invalid code, or `payor_other` chosen with no note
        "404":
          description: Invoice group not found
        "409":
          description: Group is not in `Needs Review` or has no inbound response yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/awaiting-payor-again:
    post:
      operationId: markAwaitingPayorAgain
      tags: [invoice-groups]
      summary: Flip the group off the Responses Awaiting Review list (waiting for payor again)
      description: |
        Sets `invoice_groups.awaiting_payor_again_at = now()` so the row
        disappears from the Responses Awaiting Review list (Task #321).
        Does NOT change `status`/`outcome`. The list query auto-re-includes
        the row when a newer inbound response arrives
        (`received_at > awaiting_payor_again_at`).

        Same 409 contract as the payor-denial-reason endpoint: requires
        `Needs Review` + ≥1 inbound response.

        Writes an audit log with action `awaiting_payor_again`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAwaitingPayorAgainRequest"
      responses:
        "200":
          description: Awaiting-payor-again marker set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "404":
          description: Invoice group not found
        "409":
          description: Group is not in `Needs Review` or has no inbound response yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/promote-verdict-drafts:
    post:
      operationId: promoteVerdictDrafts
      tags: [invoice-groups]
      summary: Atomically promote every leg's draft selection to operator_confirmed (Step 4 commit)
      description: |
        Task #343 Step 4 commit primitive. For each leg in the group whose
        latest verdict is an `operator_draft`, inserts a fresh
        `operator_confirmed` row carrying the same outcome inside a
        single DB transaction. Then runs the same per-leg side effects
        the `/claims/:id/verdict` endpoint runs for `operator_confirmed`:
        denormalized-cache refresh, MAS derivation, attestation gate
        engagement. Finally calls `refreshGroupDerivedFields` once for
        the parent group.

        Source-state contract: the parent group must be in the
        `response-pending` macro phase IF there are drafts to promote.
        Legs whose latest verdict is already `operator_confirmed` (or
        whose only verdict is `ai_suggested`) are skipped — only
        un-promoted drafts are committed.

        Drafts attached to legs that the picker filters out
        (excluded via `sop_outcome` ∈ {cannot_dispute, non_issue} or
        sibling duplicates that follow another leg) ARE still
        promoted. The picker UI prevents drafts from landing on those
        legs in the first place, but if one somehow exists this
        endpoint records it against the leg history rather than
        silently stranding it.

        Idempotent in the sense that a re-run with no fresh drafts
        returns `promotedCount=0` and is a no-op — even when the
        group has since left `response-pending` (the no-op short-circuit
        runs BEFORE the phase guard, so retries after a downstream
        failure are safe). Callers (the re-attest modal, the closure
        flow, the queue-for-attestation button) call this as part of
        their own commit handler so promoted verdicts land alongside
        the next-step action in a single operator gesture.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drafts promoted (or no drafts to promote)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteVerdictDraftsResponse"
        "404":
          description: Invoice group not found
        "409":
          description: Group is not in the response-pending phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/sop-advance:
    post:
      operationId: groupSopAdvance
      tags: [invoice-groups]
      summary: Bulk-advance one SOP step across every matching leg in the group (Task #470).
      description: |
        Pivot B1 — Group-level SOP advance. Applies one decision-tree
        answer to every leg in the invoice group that is parked at the
        same SOP node, in one transaction. The node MUST be authored
        with `appliesPerInvoice = true` on the leg's error-type tree.

        A leg is "matching" iff:
          - `included_in_dispute = true`
          - `sop_outcome IS NULL` (no terminal stamped yet)
          - `sop_node_id = body.nodeId`
          - `duplicate_of_claim_id IS NULL`

        Non-matching legs are not failed — they're returned in `skipped`
        with a stable reason code so the operator UI can summarize the
        outcome without re-fetching.

        Side effects (per-leg MAS derivation, denormalized cache refresh,
        group derived-fields refresh, SSE broadcast) run after the
        transaction commits, mirroring the per-leg
        `POST /claims/{id}/sop-advance` endpoint.

        Returns 409 with `error: "no_eligible_legs"` when zero legs
        qualify (group has no children, or every leg ended up in
        `skipped`). Returns 403 for clerks (mutation-class endpoint).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSopAdvanceBody"
      responses:
        "200":
          description: Bulk advance applied. `succeeded` lists the legs that advanced; `skipped` lists the rest with a reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkSopAdvanceResponse"
        "400":
          description: Body validation failed (missing nodeId/answer or invalid id).
        "403":
          description: Caller is a clerk and cannot run bulk SOP actions.
        "404":
          description: Invoice group not found.
        "409":
          description: No eligible legs to advance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkSopAdvanceResponse"

  /invoice-groups/{id}/evidence:
    get:
      operationId: listInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: List evidence collected for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimEvidenceResponse"
                required:
                  - evidence
    post:
      operationId: addInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: Add evidence to an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClaimEvidenceBody"
      responses:
        "201":
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvidenceResponse"

  # Task #411 audit, Tier 5: `DELETE /invoice-groups/{id}/evidence/{evidenceId}`
  # was removed from the spec — group-level evidence delete was never
  # wired into the detail page. Re-add alongside the UI that calls it.

  /invoice-groups/{id}/reply-evidence:
    get:
      operationId: listInvoiceGroupReplyEvidence
      tags: [invoice-groups]
      summary: List existing case files available to re-attach on an email reply
      description: |
        Returns the deduplicated set of files already on this case that the
        reply composer can re-stage as outbound attachments — group-level
        `evidenceFiles`, per-claim `evidenceFiles` for every child claim,
        and the most recent portal submission's `evidenceFiles` plus
        `attachment_urls`. Each item carries a `source` ("group" |
        "claim" | "portal_submission") so the picker can group them, and
        a `sources` array when the same file is reachable from multiple
        rows. Only entries whose URL starts with `/objects/` (i.e. live
        in our object storage) are returned — external links are dropped
        so the picker can't surface anything we can't re-upload server-
        side. The companion `POST /storage/reply-attachments/stage-from-evidence`
        endpoint enforces the same membership check before copying bytes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Existing case attachments grouped by source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyEvidenceList"
        "404":
          description: Invoice group not found.

  /invoice-groups/{id}/group-context:
    post:
      operationId: setGroupContext
      tags: [invoice-groups]
      summary: Record the operator's group-level context narrative
      description: Pre-submit only. Replaces any existing `groupContext`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGroupContextBody"
      responses:
        "200":
          description: Group context updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/understanding-readback:
    post:
      operationId: confirmUnderstandingReadback
      tags: [invoice-groups]
      summary: Operator confirms the dispute understanding readback sentence
      description: |
        Source-state: pre-submit AND every disputed leg has a resolved
        sub-status (`ready | dropped | excluded`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReadbackBody"
      responses:
        "200":
          description: Readback confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/draft:
    post:
      operationId: saveInvoiceGroupDraft
      tags: [invoice-groups]
      summary: Save operator edits to the dispute draft (subject + body HTML)
      description: |
        Pre-submit only. Persists the operator-edited `draftSubject` and
        `draftDescriptionHtml`. Stamps `draftEditedAt`/`draftEditedBy` and
        clears `draftReviewedAt` (any edit invalidates the prior review).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInvoiceGroupDraftBody"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/draft/regenerate:
    post:
      operationId: regenerateInvoiceGroupDraft
      tags: [invoice-groups]
      summary: Regenerate the AI dispute draft from per-leg context
      description: |
        Pre-submit only. Regenerates the AI-authored subject + HTML body
        from the current per-leg context, error type, and group metadata.
        Captures the result on both the `draft*` pair (operator-visible)
        and the `aiBaseline*` pair (snapshot for diff/restore), and clears
        `draftReviewedAt`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draft regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/draft/mark-reviewed:
    post:
      operationId: markInvoiceGroupDraftReviewed
      tags: [invoice-groups]
      summary: Operator marks the dispute draft as reviewed
      description: |
        Pre-submit only. Stamps `draftReviewedAt`/`draftReviewedBy`. Required
        before Submit is enabled. Re-saving the draft clears this flag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draft marked reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/preview-generated:
    post:
      operationId: stampPreviewGenerated
      tags: [invoice-groups]
      summary: Stamp that the dispute preview was generated
      description: |
        Source-state: pre-submit AND every disputed leg is resolved.
        The understanding readback is OPTIONAL — if the operator saved
        one it's threaded into the AI prompt, but a missing readback
        is a valid "nothing extra to add" signal and does not gate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Preview generation stamped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/reattest/complete:
    post:
      operationId: completeGroupReattest
      tags: [invoice-groups]
      summary: Operator stamps that the group's MAS re-attest is complete
      description: |
        This is the trigger gate for attestation. Source-state contract:
        `reattest_required = true`, `reattest_completed_at IS NULL`, and
        every leg owing a MAS cancel must have completed it. On success,
        every disputed child whose latest operator-confirmed verdict is
        Approved/Partial graduates from `not_required` to `pending`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteReattestBody"
      responses:
        "200":
          description: Re-attest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
        "400":
          description: |
            `recordedOffline=true` but `offlineNote` is missing or shorter than 10 trimmed characters.
        "403":
          description: |
            `recordedOffline=true` but the actor is not an admin.
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/reattest/queue:
    post:
      operationId: bulkQueueGroupReattest
      tags: [invoice-groups]
      summary: Atomically queue every Approved/Partial leg on the group for re-attestation later
      description: |
        Group-level analogue of `POST /claims/{id}/attest/queue`, but
        designed for the "Queue for re-attest later" path of the Re-attest
        modal. In a single transaction it:

          * promotes every disputed leg whose latest verdict is
            `operator_confirmed` Approved/Partial to
            `attestation_state = 'queued'` (skipping the per-leg Task #196
            pending gate — the queue action IS the operator commit);
          * stamps the group's `awaiting_payor_again_at` so it drops off
            Responses Awaiting Review while a portal user works the queue;
          * writes one `attestation_queued` audit row + state event per
            leg, plus one umbrella `group_reattest_queued_bulk` audit row
            + state event on the group.

        Replaces the old per-leg loop the modal used to fan out, so a
        partial failure rolls back instead of leaving half the group in
        the queue.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQueueGroupReattestBody"
      responses:
        "200":
          description: Group queued for re-attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkQueueGroupReattestResponse"
        "404":
          description: Invoice group not found
        "409":
          description: |
            No eligible legs to queue (group has no Approved/Partial
            operator-confirmed legs that are still owed an attestation),
            or the group is not in `Needs Review` / has no payor response
            on file yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /invoice-groups/{id}/email-thread:
    get:
      operationId: getInvoiceGroupEmailThread
      tags: [invoice-groups]
      summary: Group-level email thread (aggregates per-claim threads)
      description: |
        Returns every inbound payor message and outbound staff reply attached
        to this invoice group OR to any of its child claims, plus any
        sibling-claim rows that share an Outlook conversation with the
        group's scope. Same `EmailThreadResponse` shape used by the per-claim
        endpoint, so the UI can render a unified group thread without a new
        type. Each message's `claimId` carries the leg the row originally
        belonged to (null when only attached at the group level).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group email thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadResponse'
        '404':
          description: Invoice group not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /invoice-groups/{id}/email-thread/{conversationId}/reply:
    post:
      operationId: replyToInvoiceGroupEmailConversation
      tags: [invoice-groups]
      summary: Send an in-app reply on a group-level email conversation
      description: |
        Group-level analogue of `POST /claims/:id/email-thread/:conversationId/reply`.
        Posts a reply to the latest message in the given Outlook conversation
        via Microsoft Graph, persists an outbound_emails row tagged with this
        invoice group's id, and writes an `email_reply_sent` audit row on the
        group. Authorization: the conversation must include at least one row
        attached to the group itself or to one of its child claims. Optional
        `attachments` carry files staged via
        `PUT /storage/reply-attachments/stage`; the server resolves each
        `stagedId` to its server-recorded MIME / size, enforces the
        centralized reply-attachment limits (max 5 images, 10 attachments
        total, 25 MB combined), confirms the staging row belongs to the
        sending user, and only then forwards the bytes to Outlook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, bodyText, to]
              properties:
                subject:
                  type: string
                bodyText:
                  type: string
                  description: Plain-text body. Sent as text/plain to Graph; line breaks preserved.
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  description: |
                    Optional list of files previously staged via
                    `PUT /storage/reply-attachments/stage`. The server looks
                    each `stagedId` up in `reply_attachment_staging`,
                    requires the row to belong to the sending user, enforces
                    the reply-attachment caps (max 5 images, 10 attachments
                    total, 25 MB combined) using the **server-recorded**
                    MIME / size (not anything the client claims), downloads
                    each blob from object storage, and POSTs them to the
                    Outlook draft as real MIME attachments before sending.
                    On a successful send the staging rows are stamped
                    `consumed_at` so the 24h janitor leaves them in place
                    for the audit trail.
                  items:
                    type: object
                    required: [stagedId]
                    properties:
                      stagedId:
                        type: string
                        description: Opaque id returned by `PUT /storage/reply-attachments/stage`.
      responses:
        '200':
          description: Reply sent — returns the persisted outbound row so the UI can optimistically render it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessage'
        '400':
          description: Validation error or no recipients on file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Group or conversation not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: Microsoft Graph rejected the send. Body is preserved client-side so staff can retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /outlook/me:
    get:
      operationId: getOutlookMe
      tags: [invoice-groups]
      summary: Identity of the Outlook mailbox every send goes out from
      description: |
        Returns the mail address, display name, and userPrincipalName of the
        Microsoft 365 mailbox the integration is authenticated as — i.e. the
        actual "From" address on every email ClaimClear sends. The reply
        composer renders this so operators can confirm which shared mailbox
        is sending without having to dig through audit logs.

        When Outlook is not connected, returns `{ connected: false }` with
        nulls for all identity fields so the UI can collapse the hint
        instead of erroring out.
      responses:
        '200':
          description: "Identity of the connected mailbox (or `connected: false`)."
          content:
            application/json:
              schema:
                type: object
                required: [connected, mail, displayName, userPrincipalName]
                properties:
                  connected:
                    type: boolean
                  mail:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  userPrincipalName:
                    type: string
                    nullable: true

  /invoice-groups/{id}/email-send:
    post:
      operationId: sendInvoiceGroupEmail
      tags: [invoice-groups]
      summary: Send a fresh email tied to an invoice group (no prior conversation)
      description: |
        Fallback for legacy invoice-group threads that pre-date Outlook
        conversation tracking — those rows have no `conversationId`, so
        Graph's `createReply` can't be used. This endpoint sends a brand
        new email via `sendMail`, persists an `outbound_emails` row tagged
        with this invoice group's id (and Graph's returned conversationId
        so the new message threads any future replies), and writes an
        `email_reply_sent` audit row on the group. Body, recipient, and
        attachment validation match the conversation reply endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, bodyText, to]
              properties:
                subject:
                  type: string
                bodyText:
                  type: string
                  description: Plain-text body. Wrapped in a minimal HTML envelope for Graph's sendMail.
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  description: |
                    Optional list of files previously staged via
                    `PUT /storage/reply-attachments/stage`. Same staging /
                    validation rules as the conversation reply endpoint.
                  items:
                    type: object
                    required: [stagedId]
                    properties:
                      stagedId:
                        type: string
                        description: Opaque id returned by `PUT /storage/reply-attachments/stage`.
      responses:
        '200':
          description: Email sent — returns the persisted outbound row so the UI can optimistically render it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessage'
        '400':
          description: Validation error or no recipients on file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Group not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: Microsoft Graph rejected the send. Body is preserved client-side so staff can retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims with filtering
      parameters:
        - name: status
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: outcome
          in: query
          description: Comma-separated list of outcomes to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          description: Comma-separated list of error type IDs, use __unassigned__ for claims with no error type
          schema:
            type: string
        - name: createdFrom
          in: query
          description: Filter claims created on or after this date (ISO 8601)
          schema:
            type: string
        - name: createdTo
          in: query
          description: Filter claims created on or before this date (ISO 8601)
          schema:
            type: string
        - name: amountMin
          in: query
          description: Filter claims with amount >= this value
          schema:
            type: string
        - name: amountMax
          in: query
          description: Filter claims with amount <= this value
          schema:
            type: string
        - name: serviceDateFrom
          in: query
          description: Filter claims with service date on or after this date (YYYY-MM-DD)
          schema:
            type: string
        - name: serviceDateTo
          in: query
          description: Filter claims with service date on or before this date (YYYY-MM-DD)
          schema:
            type: string
        - name: carNumber
          in: query
          description: Filter claims to a specific car/vehicle number (exact match).
          schema:
            type: string
        - name: clientNumber
          in: query
          description: Filter claims to a specific client/member number (exact match).
          schema:
            type: string
        - name: expiring
          in: query
          description: Restrict to actionable claims whose filing deadline is within the named window. "soon" matches the dashboard Expiring Soon section (within 10 days, weekend-shifted). "urgent" is the narrower red-badge band (within 3 days).
          schema:
            type: string
            enum: [soon, urgent, stuck]
        - name: includeExpired
          in: query
          description: |
            When `true`, include claims whose `status="Expired"` in the
            response. Off by default everywhere — disputed children
            inherit the Expired status from their parent group when the
            nightly sweep retires it. Implicitly enabled if the caller
            already filtered to a status set that contains `Expired`.
          schema:
            type: boolean
        - name: legSubStatus
          in: query
          description: Comma-separated list of derived per-leg sub-status values (excluded, duplicate, needs_classification, investigating, blocked, ready, dropped, frozen). `duplicate` filters legs marked as Sibling Duplicate of a primary leg with a trip-overriding error in the same invoice. `frozen` filters legs whose parent invoice group is past pre-submit (in-flight, response-pending, on-hold, closed).
          schema:
            type: string
        - name: sort
          in: query
          description: Column to sort by
          schema:
            type: string
            enum: [confNumber, date, clientNumber, errorTypeName, claimAmount, status, createdAt]
        - name: dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Claims list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsListResponse"
    post:
      operationId: createClaim
      tags: [claims]
      summary: Create a new claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimBody"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/export-csv:
    get:
