          type: string
          enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
        subject:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        rawContent:
          type: string
          nullable: true
        bodyFormat:
          type: string
          enum: [html, text]
          description: |
            Format of `content` / `rawContent`. `html` indicates the body is HTML and
            the UI should render it through a sanitizer; `text` (the default) renders
            with whitespace preserved.
        senderEmail:
          type: string
          nullable: true
        senderName:
          type: string
          nullable: true
        matchedVia:
          type: string
          nullable: true
        matchConfidence:
          type: string
          nullable: true
        portalTicketId:
          type: string
          nullable: true
        externalMessageId:
          type: string
          nullable: true
        conversationId:
          type: string
          nullable: true
        processed:
          type: boolean
        autoLinked:
          type: boolean
        aiSummary:
          type: string
          nullable: true
          description: AI-extracted 1-2 sentence summary of the email content. Null if AI classification was not run or failed.
        extractedAmount:
          type: string
          nullable: true
          description: Dollar amount mentioned in the email (e.g. "$45.20"), if any.
        extractedDeadline:
          type: string
          nullable: true
          description: Any deadline mentioned in the email body, in free-form text.
        requestedAction:
          type: string
          nullable: true
          description: Specific action the payor is requesting from the provider, if any.
        classifierSource:
          type: string
          enum: [keyword, ai, manual]
          description: Which classifier produced `responseType`. AI is preferred; keyword is the fallback when AI fails or isn't run; manual is set by reviewers.
        classifierConfidence:
          type: string
          nullable: true
          enum: [high, medium, low, null]
          description: AI's self-reported confidence in its classification, if classifierSource is "ai".
        metadata:
          type: object
          nullable: true
        receivedAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
          nullable: true

    EmailThreadMessage:
      type: object
      required: [id, direction, sender, timestamp]
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        conversationId:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        sender:
          type: string
        senderEmail:
          type: string
          nullable: true
        bodyPreview:
          type: string
          nullable: true
        timestamp:
          type: string
        responseId:
          type: integer
          nullable: true
          description: For inbound messages, the portal_responses row id (used to wire Approve / Deny / Mark Reviewed buttons).
        responseType:
          type: string
          enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
          nullable: true
        processed:
          type: boolean
          nullable: true
          description: Inbound only — true when staff has already actioned this response.
        aiSummary:
          type: string
          nullable: true
        extractedAmount:
          type: string
          nullable: true
        extractedDeadline:
          type: string
          nullable: true
        requestedAction:
          type: string
          nullable: true
        classifierSource:
          type: string
          nullable: true
        matchedVia:
          type: string
          nullable: true
        matchConfidence:
          type: string
          nullable: true
        claimId:
          type: integer
          nullable: true
          description: The claim this row was attached to. May differ from the claim being viewed when the conversation covers multiple sibling claims (a group dispute).
        siblingClaimRef:
          type: string
          nullable: true
          description: Set when this message belongs to a sibling claim in the same conversation. Holds the human-readable ref (e.g. "INV-1234") so the UI can render an "↳ also covers INV-1234" pill linking out.
        siblingClaimId:
          type: integer
          nullable: true
          description: Numeric id companion to siblingClaimRef, for navigation.
        attachmentNames:
          type: array
          items:
            type: string
          nullable: true
          description: |
            Outbound only. Filenames of files attached to this message in send
            order, so the thread bubble can render an "Attached: foo.pdf,
            bar.png" line. Null on inbound messages and on outbound rows sent
            before attachment names were tracked.

    EmailThreadConversation:
      type: object
      required: [conversationId, status, lastActivityAt, messages]
      properties:
        conversationId:
          type: string
        status:
          type: string
          enum: [awaiting_their_reply, needs_review, acknowledged_pending, resolved]
          description: |
            Per-thread status pill computed from the latest message + claim outcome:
            - awaiting_their_reply: we sent last
            - needs_review: latest inbound is a real (non-acknowledgment) response, not yet processed
            - acknowledged_pending: latest inbound is an acknowledgment (auto-ack)
            - resolved: the underlying claim/group is closed
        lastActivityAt:
          type: string
          description: Most recent message timestamp in this conversation.
        latestUnprocessedInboundId:
          type: integer
          nullable: true
          description: portal_responses.id of the latest unprocessed inbound; the UI anchors Approve / Deny / Mark Reviewed buttons here.
        latestSubject:
          type: string
          nullable: true
          description: Subject of the most recent message; useful for prefilling Reply.
        latestInboundSender:
          type: string
          nullable: true
          description: Email address of the most recent inbound sender; used to prefill Reply "To".
        messages:
          type: array
          items:
            $ref: '#/components/schemas/EmailThreadMessage'

    EmailThreadResponse:
      type: object
      required: [messages, conversationIds, conversations]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/EmailThreadMessage'
          description: Flat chronological list of every message across every conversation. Kept for backwards compatibility; new UIs should prefer `conversations`.
        conversationIds:
          type: array
          items:
            type: string
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/EmailThreadConversation'
          description: Messages grouped by Outlook conversationId, sorted by lastActivityAt descending.

