  /portal-submissions/preflight-understanding:
    post:
      operationId: portalUnderstandingPreflight
      tags: [portalSubmissions]
      summary: Framing-only AI paraphrase of the operator's Understanding notes
      description: >
        Lightweight check that takes ONLY the operator's note text and asks
        the AI to restate it in 1–3 sentences without any case context
        (error type, decision-tree outcome, per-leg findings, SOP transcript).
        The point is to surface whether the AI understood the operator's
        wording on its own — a vague note like "He didn't stop" should come
        back hedged so the operator knows to sharpen it before Generate
        Preview, where the full case context will paper over the ambiguity.
        Persists `understandingReadback` + `understandingReadbackForText`
        (the drift anchor) on the invoice group and writes a single audit
        log row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalUnderstandingPreflightBody"
      responses:
        "200":
          description: AI readback of the dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUnderstandingPreflightResponse"

