openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ClaimClear API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: claims
    description: Claims management
  - name: errorTypes
    description: Error type management
  - name: notes
    description: Notes per claim
  - name: portalSubmissions
    description: Portal submission management
  - name: auditLogs
    description: Audit log viewing
  - name: botInstances
    description: Bot instance management
  - name: botActivity
    description: Bot activity logs
  - name: presence
    description: Real-time presence
  - name: import
    description: Claims import
  - name: dashboard
    description: Dashboard summary
  - name: dailyBrief
    description: Daily brief email
  - name: ai
    description: AI features
  - name: anthropic
    description: Anthropic AI chat operations
  - name: errorDetailMappings
    description: Error detail to error type mappings
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: evidenceTypes
    description: Reusable evidence type library
  - name: claimEvidence
    description: Evidence collected for claims
  - name: appSettings
    description: Application settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - type: "null"
                required:
                  - user

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get current session (returns 401 if unauthenticated)
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required:
                  - user
        "401":
          description: Not authenticated

  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims with filtering
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["New", "Needs Evidence", "Portal Queued", "Generating Email", "Ready to Review", "Awaiting Response", "On Hold", "Resolved", "Denied"]
        - name: outcome
          in: query
          schema:
            type: string
            enum: ["Pending", "Approved", "Denied", "Partially Approved"]
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Claims list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsListResponse"
    post:
      operationId: createClaim
      tags: [claims]
      summary: Create a new claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimBody"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}:
    get:
      operationId: getClaim
      tags: [claims]
      summary: Get claim by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "404":
          description: Not found
    patch:
      operationId: updateClaim
      tags: [claims]
      summary: Update a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimBody"
      responses:
        "200":
          description: Claim updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
    delete:
      operationId: deleteClaim
      tags: [claims]
      summary: Delete a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /claims/{id}/status:
    patch:
      operationId: updateClaimStatus
      tags: [claims]
      summary: Update claim status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/outcome:
    patch:
      operationId: updateClaimOutcome
      tags: [claims]
      summary: Update claim outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimOutcomeBody"
      responses:
        "200":
          description: Outcome updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/evidence:
    patch:
      operationId: updateClaimEvidence
      tags: [claims]
      summary: Update claim evidence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimEvidenceBody"
      responses:
        "200":
          description: Evidence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/hold:
    post:
      operationId: placeClaimOnHold
      tags: [claims]
      summary: Place claim on hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceHoldBody"
      responses:
        "200":
          description: Hold placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
    delete:
      operationId: removeClaimHold
      tags: [claims]
      summary: Remove claim hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hold removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/workflow:
    patch:
      operationId: updateClaimWorkflow
      tags: [claims]
      summary: Update workflow progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowBody"
      responses:
        "200":
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /error-types/analyze-sop:
    post:
      operationId: analyzeSOPText
      tags: [ai]
      summary: Analyze SOP text with AI to generate error type fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeSOPBody"
      responses:
        "200":
          description: SOP analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPAnalysisResult"

  /claims/{id}/generate-email:
    post:
      operationId: generateClaimEmail
      tags: [ai]
      summary: Generate dispute email via AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateEmailBody"
      responses:
        "200":
          description: Email generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/notes:
    get:
      operationId: listClaimNotes
      tags: [notes]
      summary: List notes for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteResponse"
    post:
      operationId: createClaimNote
      tags: [notes]
      summary: Create a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"

  /notes/{id}:
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /claims/{id}/audit-logs:
    get:
      operationId: listClaimAuditLogs
      tags: [auditLogs]
      summary: List audit logs for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogResponse"

  /error-types:
    get:
      operationId: listErrorTypes
      tags: [errorTypes]
      summary: List all error types
      responses:
        "200":
          description: Error types list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ErrorTypeResponse"
    post:
      operationId: createErrorType
      tags: [errorTypes]
      summary: Create error type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateErrorTypeBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTypeResponse"

  /error-types/{id}:
    get:
      operationId: getErrorType
      tags: [errorTypes]
      summary: Get error type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Error type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTypeResponse"
    patch:
      operationId: updateErrorType
      tags: [errorTypes]
      summary: Update error type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateErrorTypeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTypeResponse"
    delete:
      operationId: deleteErrorType
      tags: [errorTypes]
      summary: Delete error type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /app-settings:
    get:
      operationId: getAppSettings
      tags: [appSettings]
      summary: Get all application settings
      responses:
        "200":
          description: Settings key-value map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettingsResponse"
    put:
      operationId: updateAppSettings
      tags: [appSettings]
      summary: Update application settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettingsResponse"

  /import:
    post:
      operationId: importClaims
      tags: [import]
      summary: Import claims from parsed CSV data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportClaimsBody"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"

  /error-detail-mappings/lookup:
    post:
      operationId: lookupErrorDetailMappings
      tags: [errorDetailMappings]
      summary: Look up error detail mappings for a list of error detail strings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupMappingsBody"
      responses:
        "200":
          description: Mapping results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupMappingsResponse"

  /error-detail-mappings:
    post:
      operationId: saveErrorDetailMappings
      tags: [errorDetailMappings]
      summary: Save new or updated error detail mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMappingsBody"
      responses:
        "200":
          description: Saved mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveMappingsResponse"

  /claims/bulk-assign-error-type:
    post:
      operationId: bulkAssignErrorType
      tags: [claims]
      summary: Bulk assign error type to multiple claims
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignErrorTypeBody"
      responses:
        "200":
          description: Bulk assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAssignResult"

  /portal-submissions:
    get:
      operationId: listPortalSubmissions
      tags: [portalSubmissions]
      summary: List portal submissions
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Submissions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalSubmissionResponse"
    post:
      operationId: createPortalSubmission
      tags: [portalSubmissions]
      summary: Create portal submission from claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalSubmissionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /portal-submissions/{id}:
    get:
      operationId: getPortalSubmission
      tags: [portalSubmissions]
      summary: Get portal submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /portal-submissions/{id}/retry:
    post:
      operationId: retryPortalSubmission
      tags: [portalSubmissions]
      summary: Retry failed submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reset to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /portal-submissions/{id}/cancel:
    post:
      operationId: cancelPortalSubmission
      tags: [portalSubmissions]
      summary: Cancel pending submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /bot/portal-submissions/poll:
    post:
      operationId: pollPortalSubmissions
      tags: [bot]
      summary: Bot polls for pending submissions (bot token auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollSubmissionsBody"
      responses:
        "200":
          description: Pending submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalSubmissionResponse"

  /bot/portal-submissions/{id}/claim:
    post:
      operationId: claimPortalSubmission
      tags: [bot]
      summary: Bot claims a submission (bot token auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimSubmissionBody"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /bot/portal-submissions/{id}/complete:
    post:
      operationId: completePortalSubmission
      tags: [bot]
      summary: Bot reports success (bot token auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSubmissionBody"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /bot/portal-submissions/{id}/complete-dry-run:
    post:
      operationId: completeDryRunPortalSubmission
      tags: [bot]
      summary: Bot reports dry-run completion (bot token auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDryRunBody"
      responses:
        "200":
          description: Dry run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /bot/portal-submissions/{id}/fail:
    post:
      operationId: failPortalSubmission
      tags: [bot]
      summary: Bot reports failure (bot token auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailSubmissionBody"
      responses:
        "200":
          description: Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmissionResponse"

  /portal-submissions/{id}/activity:
    get:
      operationId: listBotActivity
      tags: [botActivity]
      summary: List bot activity for submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bot activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotActivityLogResponse"

  /bot-instances:
    get:
      operationId: listBotInstances
      tags: [botInstances]
      summary: List active bot instances (authenticated users)
      responses:
        "200":
          description: Bot instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotInstanceResponse"

  /bot/instances:
    post:
      operationId: registerBotInstance
      tags: [bot]
      summary: Register a new bot instance (bot token auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBotBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstanceResponse"

  /bot/instances/{id}/heartbeat:
    post:
      operationId: botHeartbeat
      tags: [bot]
      summary: Bot heartbeat (bot token auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstanceResponse"

  /bot/instances/{id}/stop:
    post:
      operationId: stopBotInstance
      tags: [bot]
      summary: Mark bot as stopped (bot token auth)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInstanceResponse"

  /presence/heartbeat:
    post:
      operationId: presenceHeartbeat
      tags: [presence]
      summary: Upsert presence heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeatBody"
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /presence/leave:
    post:
      operationId: presenceLeave
      tags: [presence]
      summary: Remove presence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceLeaveBody"
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /presence/{claimId}:
    get:
      operationId: getPresence
      tags: [presence]
      summary: Get active viewers for a claim
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active viewers and bot activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /daily-brief:
    post:
      operationId: triggerDailyBrief
      tags: [dailyBrief]
      summary: Trigger daily brief email
      responses:
        "200":
          description: Brief sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBriefResponse"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnthropicConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAnthropicMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'

  /evidence-types:
    get:
      tags: [evidenceTypes]
      operationId: listEvidenceTypes
      summary: List all evidence types
      responses:
        '200':
          description: Evidence types list
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidenceTypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidenceTypeResponse'
                required:
                  - evidenceTypes
    post:
      tags: [evidenceTypes]
      operationId: createEvidenceType
      summary: Create an evidence type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceTypeBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceTypeResponse'

  /evidence-types/{id}:
    put:
      tags: [evidenceTypes]
      operationId: updateEvidenceType
      summary: Update an evidence type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceTypeBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceTypeResponse'
    delete:
      tags: [evidenceTypes]
      operationId: deleteEvidenceType
      summary: Delete an evidence type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

  /claims/{claimId}/evidence:
    get:
      tags: [claimEvidence]
      operationId: listClaimEvidence
      summary: List evidence for a claim
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClaimEvidenceResponse'
                required:
                  - evidence
    post:
      tags: [claimEvidence]
      operationId: addClaimEvidence
      summary: Add evidence to a claim
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddClaimEvidenceBody'
      responses:
        '201':
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimEvidenceResponse'

  /claims/{claimId}/evidence/{evidenceId}:
    delete:
      tags: [claimEvidence]
      operationId: deleteClaimEvidence
      summary: Delete evidence from a claim
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted

