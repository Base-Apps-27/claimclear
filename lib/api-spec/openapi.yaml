    UpdateClaimOutcomeBody:
      type: object
      description: |
        Body for `PATCH /claims/{id}/outcome`. The closure detail fields
        (closureCategory, closureRootCause, closureNarrative,
        closureAccountabilityTags, etc.) are required when the outcome is
        "Withdrawn" with reason "cannot_dispute" or "Non-Issue" and are
        validated by the canonical `CreateClosureRequest` payload.
      properties:
        outcome:
          type: string
        closureReason:
          type: string
          enum: ["denied_by_payor", "cannot_dispute", "non_issue"]
        approvedAmount:
          type: string
        invoiceNumbers:
          type: string
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
            enum: ["driver", "dispatcher", "member", "it_system", "our_staff", "external_payor", "other"]
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
      required:
        - outcome

    UpdateInvoiceGroupOutcomeBody:
      type: object
      description: |
        Body for `PATCH /invoice-groups/{id}/outcome`. Same closure detail
        contract as `UpdateClaimOutcomeBody`.
      properties:
        outcome:
          type: string
        closureReason:
          type: string
          enum: ["denied_by_payor", "cannot_dispute", "non_issue"]
        approvedAmount:
          type: string
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
            enum: ["driver", "dispatcher", "member", "it_system", "our_staff", "external_payor", "other"]
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
      required:
        - outcome

    ClosurePersonRef:
      type: object
      description: A person referenced from a structured closure (driver/dispatcher).
