  /responses/{id}/process:
    patch:
      operationId: processResponse
      tags: [responses]
      summary: Mark a response as processed and optionally update type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                responseType:
                  type: string
                  enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
                claimId:
                  type: integer
      responses:
        '200':
          description: Processed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}/link:
    patch:
      operationId: linkResponse
      tags: [responses]
      summary: Manually link a response to a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimId]
              properties:
                claimId:
                  type: integer
      responses:
        '200':
          description: Linked response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}/reassign:
    post:
      operationId: reassignResponse
      tags: [responses]
      summary: Move a response to a different claim/group or mark it as unmatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetClaimId:
                  type: integer
                targetGroupId:
                  type: integer
                unmatch:
                  type: boolean
      responses:
        '200':
          description: Reassigned response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /claims/{id}/email-thread:
    get:
      operationId: getClaimEmailThread
      tags: [responses]
      summary: Get the merged inbound + outbound email thread for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Email thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadResponse'

  /responses/check-email:
    post:
      operationId: checkEmailResponses
      tags: [responses]
      summary: Trigger email inbox scan for responses
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hoursBack:
                  type: integer
                  default: 4
      responses:
        '200':
          description: Email check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCheckResult'

  /responses/record-portal:
    post:
      operationId: recordPortalResponse
      tags: [responses]
      summary: Record a response from the portal
      description: |
        Records a response captured by the portal scraper bot. The bot may
        optionally include the full message body (`rawContent`), the message
        `subject`, and the portal sender's `senderEmail` / `senderName` so
        reviewers can read the original payor message in the UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, responseType]
              properties:
                submissionId:
                  type: integer
                responseType:
                  type: string
                  enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
                content:
                  type: string
                  description: Short preview / summary of the portal response.
                rawContent:
                  type: string
                  description: Full body of the portal response, preserved verbatim for display.
                bodyFormat:
                  type: string
                  enum: [html, text]
                  description: |
                    Declares whether `rawContent`/`content` is HTML or plain text. When
                    `html`, the UI renders the response through a sanitizer so links,
                    emphasis, and lists survive. Defaults to `text` for backwards
                    compatibility with bots that have not been updated.
                subject:
                  type: string
                  description: Optional subject / title of the portal message.
                senderEmail:
                  type: string
                  description: Optional email address of the portal user that posted the response.
                senderName:
                  type: string
                  description: Optional display name of the portal user that posted the response.
                metadata:
                  type: object
      responses:
        '200':
          description: Recorded response
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseId:
                    type: integer
                  claimId:
                    type: integer

  /responses/stats:
    get:
      operationId: getResponseStats
      tags: [responses]
      summary: Get response tracking statistics
      responses:
        '200':
          description: Response statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStats'

  /admin/audit-logs:
    get:
      operationId: adminListAuditLogs
      tags: [admin, auditLogs]
      summary: List audit log entries (admin only) with filtering and pagination
      parameters:
        - name: userEmail
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [all, status, edit, evidence, workflow, hold, draft, communication, other]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit log feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogsResponse"

  /admin/audit-logs.csv:
    get:
      operationId: adminExportAuditLogsCsv
      tags: [admin, auditLogs]
      summary: Export audit log entries as CSV (admin only)
      parameters:
        - name: userEmail
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [all, status, edit, evidence, workflow, hold, draft, communication, other]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /admin/system-health/cron-runs:
    get:
      operationId: getSystemHealthCronRuns
      tags: [systemHealth]
      summary: Recent cron job runs grouped by job (admin only)
      responses:
        '200':
          description: Cron runs grouped by job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronRunsResponse'

  /admin/system-health/connectors:
    get:
      operationId: getSystemHealthConnectors
      tags: [systemHealth]
      summary: Current connector health statuses (admin only)
      responses:
        '200':
          description: Connector statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHealthResponse'

  /admin/system-health/worker-activity:
    get:
      operationId: getSystemHealthWorkerActivity
      tags: [systemHealth]
      summary: On-demand portal worker activity (admin only)
      responses:
        '200':
          description: Worker activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerActivityResponse'

  /admin/system-health/rollup:
    get:
      operationId: getSystemHealthRollup
      tags: [systemHealth]
      summary: Rolled-up system health (any authenticated user)
      description: Overall status plus per-component statuses for the rollup banner. Authenticated read; payload is summary-only.
      responses:
        '200':
          description: Rollup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthRollupResponse'

  /admin/system-health/bounces:
    get:
      operationId: getSystemHealthBounces
      tags: [systemHealth]
      summary: Recent email bounces (admin only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: onlyUnmatched
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Bounce records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBouncesResponse'

  /admin/users/{userId}/notification-preferences:
    get:
      operationId: getUserNotificationPreferences
      tags: [admin]
      summary: Get notification preferences for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '404':
          description: User not found
    patch:
      operationId: updateUserNotificationPreferences
      tags: [admin]
      summary: Update notification preferences for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesBody'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          description: Invalid body
        '404':
          description: User not found

  /admin/backfill-invoice-groups:
    post:
      operationId: backfillInvoiceGroups
      tags: [admin]
      summary: One-time backfill of invoice_group_id for claims imported before group migration
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: If true, report what would change without writing to the database
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillInvoiceGroupsResponse'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        role:
          type: string
        status:
          type: string
      required:
        - id
        - email
        - role
        - status

    ClaimResponse:
      type: object
      properties:
        id:
          type: integer
        invoiceGroupId:
          type: ["integer", "null"]
        confNumber:
          type: string
        date:
          type: ["string", "null"]
        refNumber:
          type: ["string", "null"]
        clientNumber:
          type: ["string", "null"]
        carNumber:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        errorTypeId:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
        status:
          type: string
          enum: ["New", "Needs Review", "Needs Evidence", "Portal Queued", "Generating Email", "Ready to Review", "Awaiting Response", "On Hold", "Resolved", "Denied"]
        outcome:
          type: string
          enum: ["Pending", "Approved", "Denied", "Partially Approved", "Non-Issue", "Withdrawn"]
        closureReason:
          type: ["string", "null"]
          enum: ["payer_denied", "not_contestable", "accepted_loss", "non_issue", null]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        triageNotes:
          type: ["string", "null"]
        triagedAt:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        invoiceNumbers:
          type: ["string", "null"]
        payorEmail:
          type: ["string", "null"]
        disputeEmailSent:
          type: boolean
        disputeEmailSentAt:
          type: ["string", "null"]
        importBatch:
          type: ["string", "null"]
        evidenceFiles:
          type: ["object", "null"]
        evidenceNotes:
          type: ["string", "null"]
        evidenceChecklist:
          type: ["object", "null"]
        generatedEmailSubject:
          type: ["string", "null"]
        generatedEmailBody:
          type: ["string", "null"]
        generatedEmailAt:
          type: ["string", "null"]
        workflowProgress:
          type: ["object", "null"]
        holdReason:
          type: ["string", "null"]
        holdPendingFrom:
          type: ["string", "null"]
        holdPlacedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - confNumber
        - status
        - outcome
        - disputeEmailSent

    ValidTransitionsResponse:
      type: object
      properties:
        validStatuses:
          type: array
          items:
            type: string
        validOutcomes:
          type: array
          items:
            type: string
        canQueueForPortal:
          type: boolean
        hasActiveSubmission:
          type: boolean
        postResponseActions:
          type: array
          items:
            type: string
        latestResponseType:
          type: ["string", "null"]
        hasResponse:
          type: boolean
          description: "True if a portal/email response exists for this entity. For invoice groups, considers responses linked directly to the group OR via any of its child claims."
      required:
        - validStatuses
        - validOutcomes
        - canQueueForPortal
        - hasActiveSubmission
        - postResponseActions

    InvoiceGroupResponse:
      type: object
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        clientNumber:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        errorTypeId:
          type: ["string", "null"]
        errorTypeName:
          type: ["string", "null"]
        status:
          type: string
          enum: ["New", "Needs Review", "Needs Evidence", "Portal Queued", "Generating Email", "Ready to Review", "Awaiting Response", "On Hold", "Resolved", "Denied"]
        outcome:
          type: string
          enum: ["Pending", "Approved", "Denied", "Partially Approved", "Non-Issue", "Withdrawn"]
        closureReason:
          type: ["string", "null"]
          enum: ["payer_denied", "not_contestable", "accepted_loss", "non_issue", null]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        rideCount:
          type: integer
        totalAmount:
          type: ["string", "null"]
        workflowProgress:
          type: ["object", "null"]
        holdReason:
          type: ["string", "null"]
        holdPendingFrom:
          type: ["string", "null"]
        holdPlacedAt:
          type: ["string", "null"]
        triageNotes:
          type: ["string", "null"]
        triagedAt:
          type: ["string", "null"]
        disputeEmailSent:
          type: boolean
        disputeEmailSentAt:
          type: ["string", "null"]
        generatedEmailSubject:
          type: ["string", "null"]
        generatedEmailBody:
          type: ["string", "null"]
        generatedEmailAt:
          type: ["string", "null"]
        evidenceFiles:
          type: ["object", "null"]
        evidenceNotes:
          type: ["string", "null"]
        evidenceChecklist:
          type: ["object", "null"]
        payorEmail:
          type: ["string", "null"]
        importBatch:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - invoiceNumber
        - status
        - outcome
        - rideCount
        - disputeEmailSent

    InvoiceGroupDetailResponse:
      allOf:
        - $ref: "#/components/schemas/InvoiceGroupResponse"
        - type: object
          properties:
            isPartial:
              type: boolean
              description: True when at least one leg is On Hold and at least one is not — the group is split, with part of it moving forward while part is parked.
            rides:
              type: array
              items:
                $ref: "#/components/schemas/ClaimResponse"
            submissions:
              type: array
              items:
                $ref: "#/components/schemas/PortalSubmissionResponse"
            notes:
              type: array
              items:
                $ref: "#/components/schemas/NoteResponse"
            auditLogs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLogResponse"
            responses:
              type: array
              items:
                $ref: "#/components/schemas/PortalResponseItem"

    InvoiceGroupsListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceGroupResponse"
        total:
          type: integer
      required:
        - groups
        - total

    UpdateInvoiceGroupBody:
      type: object
      properties:
        errorDetails:
          type: string
        errorTypeId:
          type: string
        errorTypeName:
          type: string
        payorEmail:
          type: string
        evidenceNotes:
          type: string
        evidenceFiles:
          type: object
        evidenceChecklist:
          type: object

    ClaimsListResponse:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/ClaimResponse"
        total:
          type: integer
      required:
        - claims
        - total

    CreateClaimBody:
      type: object
      properties:
        confNumber:
          type: string
        date:
          type: string
        refNumber:
          type: string
        clientNumber:
          type: string
        carNumber:
          type: string
        errorDetails:
          type: string
        errorTypeId:
          type: string
        errorTypeName:
          type: string
        claimAmount:
          type: string
        payorEmail:
          type: string
      required:
        - confNumber

    UpdateClaimBody:
      type: object
      properties:
        confNumber:
          type: string
        date:
          type: string
        refNumber:
          type: string
        clientNumber:
          type: string
        carNumber:
          type: string
        errorDetails:
          type: string
        errorTypeId:
          type: string
        errorTypeName:
          type: string
        claimAmount:
          type: string
        payorEmail:
          type: string
        invoiceNumbers:
          type: string
        evidenceNotes:
          type: string
        evidenceFiles:
          type: object
        evidenceChecklist:
          type: object

    UpdateClaimStatusBody:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UpdateClaimOutcomeBody:
      type: object
      description: |
        Body for `PATCH /claims/{id}/outcome`. The closure detail fields
        (closureCategory, closureRootCause, closureNarrative,
        closureAccountabilityTags, etc.) are required when the outcome is
        "Withdrawn" with reason "not_contestable" or "Non-Issue" and are
        validated by the canonical `CreateClosureRequest` payload.
      properties:
        outcome:
          type: string
        closureReason:
          type: string
          enum: ["payer_denied", "not_contestable", "accepted_loss", "non_issue"]
        approvedAmount:
          type: string
        invoiceNumbers:
          type: string
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
            enum: ["driver", "dispatcher", "member", "it_system", "our_staff", "external_payor", "other"]
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
      required:
        - outcome

    UpdateInvoiceGroupOutcomeBody:
      type: object
      description: |
        Body for `PATCH /invoice-groups/{id}/outcome`. Same closure detail
        contract as `UpdateClaimOutcomeBody`.
      properties:
        outcome:
          type: string
        closureReason:
          type: string
          enum: ["payer_denied", "not_contestable", "accepted_loss", "non_issue"]
        approvedAmount:
          type: string
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
            enum: ["driver", "dispatcher", "member", "it_system", "our_staff", "external_payor", "other"]
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureAddressedAt:
          type: ["string", "null"]
          format: date-time
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
      required:
        - outcome

    ClosurePersonRef:
      type: object
      description: A person referenced from a structured closure (driver/dispatcher).
      properties:
        name:
          type: string
        id:
          type: ["string", "null"]
      required:
        - name

    CreateClosureRequest:
      type: object
      description: |
        Canonical payload for filing a structured closure (Withdraw or
        Non-Issue). Used by `PATCH /claims/{id}/outcome` and
        `PATCH /invoice-groups/{id}/outcome` when staff are recording
        a structured closure (vs. a bare outcome change).

        Required fields when `closureReason` is `not_contestable` or `non_issue`:
          - closureCategory (string; if "other", closureCategoryOther required)
          - closureRootCause (string; if "other", closureRootCauseOther required)
          - closureNarrative (string, ≥80 chars)
          - closureAccountabilityTags (≥1 entry; if includes "other",
            closureAccountabilityOther required)
          - closureDrivers (≥1 with name) when tags includes "driver"
          - closureDispatchers (≥1 with name) when tags includes "dispatcher"

        For `accepted_loss`, the structured detail fields stay optional.
      properties:
        outcome:
          type: string
          enum: ["Withdrawn", "Non-Issue"]
        closureReason:
          type: string
          enum: ["not_contestable", "accepted_loss", "non_issue"]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
