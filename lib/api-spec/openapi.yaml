          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}/reassign:
    post:
      operationId: reassignResponse
      tags: [responses]
      summary: Move a response to a different claim/group or mark it as unmatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetClaimId:
                  type: integer
                targetGroupId:
                  type: integer
