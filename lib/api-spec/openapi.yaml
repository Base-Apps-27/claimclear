openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ClaimClear API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: claims
    description: Claims management
  - name: errorTypes
    description: Error type management
  - name: notes
    description: Notes per claim
  - name: portalSubmissions
    description: Portal submission management
  - name: auditLogs
    description: Audit log viewing
  - name: botActivity
    description: Bot activity logs
  - name: presence
    description: Real-time presence
  - name: import
    description: Claims import
  - name: dashboard
    description: Dashboard summary
  - name: dailyBrief
    description: Daily brief email
  - name: ai
    description: AI features
  - name: anthropic
    description: Anthropic AI chat operations
  - name: errorDetailMappings
    description: Error detail to error type mappings
  - name: Storage
    description: Object storage upload and serving endpoints
  - name: evidenceTypes
    description: Reusable evidence type library
  - name: claimEvidence
    description: Evidence collected for claims
  - name: appSettings
    description: Application settings
  - name: responses
    description: Portal and email response tracking
  - name: systemHealth
    description: System health, cron runs, connector status, bounces (admin)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - type: "null"
                required:
                  - user

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get current session (returns 401 if unauthenticated)
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required:
                  - user
        "401":
          description: Not authenticated

  /invoice-groups:
    get:
      operationId: listInvoiceGroups
      tags: [invoice-groups]
      summary: List invoice groups with filtering
      parameters:
        - name: status
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: outcome
          in: query
          description: Comma-separated list of outcomes to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorDetails
          in: query
          description: Filter by presence of an error description on the group
          schema:
            type: string
            enum: [empty, present]
        - name: errorTypeId
          in: query
          description: Comma-separated list of error type IDs, use __unassigned__ for groups with no error type
          schema:
            type: string
        - name: createdFrom
          in: query
          description: Filter groups created on or after this date (ISO 8601)
          schema:
            type: string
        - name: createdTo
          in: query
          description: Filter groups created on or before this date (ISO 8601)
          schema:
            type: string
        - name: amountMin
          in: query
          description: Filter groups with total amount >= this value
          schema:
            type: string
        - name: amountMax
          in: query
          description: Filter groups with total amount <= this value
          schema:
            type: string
        - name: sort
          in: query
          description: Column to sort by
          schema:
            type: string
            enum: [invoiceNumber, rideCount, clientNumber, errorTypeName, totalAmount, status, createdAt]
        - name: dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Invoice groups list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupsListResponse"

  /invoice-groups/export-csv:
    get:
      operationId: exportInvoiceGroupsCsv
      tags: [invoice-groups]
      summary: Export invoice groups as CSV (all matching rows, respects same filters as list)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorDetails
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          schema:
            type: string
        - name: createdFrom
          in: query
          schema:
            type: string
        - name: createdTo
          in: query
          schema:
            type: string
        - name: amountMin
          in: query
          schema:
            type: string
        - name: amountMax
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: dir
          in: query
          schema:
            type: string
        - name: columns
          in: query
          description: Comma-separated list of column keys to include in export
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /invoice-groups/{id}:
    get:
      operationId: getInvoiceGroup
      tags: [invoice-groups]
      summary: Get invoice group with rides
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice group details with rides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupDetailResponse"
        "404":
          description: Not found
    patch:
      operationId: updateInvoiceGroup
      tags: [invoice-groups]
      summary: Update an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceGroupBody"
      responses:
        "200":
          description: Updated invoice group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
    delete:
      operationId: deleteInvoiceGroup
      tags: [invoice-groups]
      summary: Delete an invoice group and its rides
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoice-groups/{id}/status:
    patch:
      operationId: updateInvoiceGroupStatus
      tags: [invoice-groups]
      summary: Update invoice group status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                reason:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/outcome:
    patch:
      operationId: updateInvoiceGroupOutcome
      tags: [invoice-groups]
      summary: Update invoice group outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceGroupOutcomeBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/triage:
    post:
      operationId: triageInvoiceGroup
      tags: [invoice-groups]
      summary: Triage an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                triageOutcome:
                  type: string
                  enum: ["non_issue", "issue_found"]
                errorTypeId:
                  type: string
                errorTypeName:
                  type: string
                notes:
                  type: string
              required:
                - triageOutcome
      responses:
        "200":
          description: Triaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/hold:
    post:
      operationId: holdInvoiceGroup
      tags: [invoice-groups]
      summary: Place invoice group on hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"
    delete:
      operationId: removeInvoiceGroupHold
      tags: [invoice-groups]
      summary: Remove hold from invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hold removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/bulk-assign-error-type:
    post:
      operationId: bulkAssignInvoiceGroupErrorType
      tags: [invoice-groups]
      summary: Bulk assign error type to invoice groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds:
                  type: array
                  items:
                    type: integer
                errorTypeId:
                  type: string
                errorTypeName:
                  type: string
              required:
                - groupIds
                - errorTypeId
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: integer

  /invoice-groups/{id}/valid-transitions:
    get:
      operationId: getInvoiceGroupValidTransitions
      tags: [invoice-groups]
      summary: Get valid transitions for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Valid transitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidTransitionsResponse"

  /invoice-groups/{id}/workflow:
    patch:
      operationId: updateInvoiceGroupWorkflow
      tags: [invoice-groups]
      summary: Update workflow progress for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowBody"
      responses:
        "200":
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceGroupResponse"

  /invoice-groups/{id}/evidence:
    get:
      operationId: listInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: List evidence collected for an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimEvidenceResponse"
                required:
                  - evidence
    post:
      operationId: addInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: Add evidence to an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClaimEvidenceBody"
      responses:
        "201":
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvidenceResponse"

  /invoice-groups/{id}/evidence/{evidenceId}:
    delete:
      operationId: deleteInvoiceGroupEvidence
      tags: [invoice-groups]
      summary: Delete evidence from an invoice group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims with filtering
      parameters:
        - name: status
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: outcome
          in: query
          description: Comma-separated list of outcomes to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          description: Comma-separated list of error type IDs, use __unassigned__ for claims with no error type
          schema:
            type: string
        - name: createdFrom
          in: query
          description: Filter claims created on or after this date (ISO 8601)
          schema:
            type: string
        - name: createdTo
          in: query
          description: Filter claims created on or before this date (ISO 8601)
          schema:
            type: string
        - name: amountMin
          in: query
          description: Filter claims with amount >= this value
          schema:
            type: string
        - name: amountMax
          in: query
          description: Filter claims with amount <= this value
          schema:
            type: string
        - name: serviceDateFrom
          in: query
          description: Filter claims with service date on or after this date (YYYY-MM-DD)
          schema:
            type: string
        - name: serviceDateTo
          in: query
          description: Filter claims with service date on or before this date (YYYY-MM-DD)
          schema:
            type: string
        - name: carNumber
          in: query
          description: Filter claims to a specific car/vehicle number (exact match).
          schema:
            type: string
        - name: clientNumber
          in: query
          description: Filter claims to a specific client/member number (exact match).
          schema:
            type: string
        - name: sort
          in: query
          description: Column to sort by
          schema:
            type: string
            enum: [confNumber, date, clientNumber, errorTypeName, claimAmount, status, createdAt]
        - name: dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Claims list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsListResponse"
    post:
      operationId: createClaim
      tags: [claims]
      summary: Create a new claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimBody"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/export-csv:
    get:
      operationId: exportClaimsCsv
      tags: [claims]
      summary: Export claims as CSV (all matching rows, respects same filters as list)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: errorTypeId
          in: query
          schema:
            type: string
        - name: createdFrom
          in: query
          schema:
            type: string
        - name: createdTo
          in: query
          schema:
            type: string
        - name: amountMin
          in: query
          schema:
            type: string
        - name: amountMax
          in: query
          schema:
            type: string
        - name: serviceDateFrom
          in: query
          schema:
            type: string
        - name: serviceDateTo
          in: query
          schema:
            type: string
        - name: carNumber
          in: query
          schema:
            type: string
        - name: clientNumber
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: dir
          in: query
          schema:
            type: string
        - name: columns
          in: query
          description: Comma-separated list of column keys to include in export
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /claims/{id}:
    get:
      operationId: getClaim
      tags: [claims]
      summary: Get claim by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "404":
          description: Not found
    patch:
      operationId: updateClaim
      tags: [claims]
      summary: Update a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimBody"
      responses:
        "200":
          description: Claim updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
    delete:
      operationId: deleteClaim
      tags: [claims]
      summary: Delete a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /claims/valid-transitions/{id}:
    get:
      operationId: getClaimValidTransitions
      tags: [claims]
      summary: Get valid status and outcome transitions for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Valid transitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentStatus:
                    type: string
                  currentOutcome:
                    type: string
                  validStatuses:
                    type: array
                    items:
                      type: string
                  validOutcomes:
                    type: array
                    items:
                      type: string
                  hasActiveSubmission:
                    type: boolean
                  canQueueForPortal:
                    type: boolean
                  postResponseActions:
                    type: array
                    items:
                      type: string
                  latestResponseType:
                    type: string
                    nullable: true
                  hasResponse:
                    type: boolean
                    description: "True if a portal/email response exists for this claim."

  /claims/{id}/status:
    patch:
      operationId: updateClaimStatus
      tags: [claims]
      summary: Update claim status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/outcome:
    patch:
      operationId: updateClaimOutcome
      tags: [claims]
      summary: Update claim outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimOutcomeBody"
      responses:
        "200":
          description: Outcome updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/evidence:
    patch:
      operationId: updateClaimEvidence
      tags: [claims]
      summary: Update claim evidence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimEvidenceBody"
      responses:
        "200":
          description: Evidence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/hold:
    post:
      operationId: placeClaimOnHold
      tags: [claims]
      summary: Place claim on hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceHoldBody"
      responses:
        "200":
          description: Hold placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
    delete:
      operationId: removeClaimHold
      tags: [claims]
      summary: Remove claim hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hold removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/workflow:
    patch:
      operationId: updateClaimWorkflow
      tags: [claims]
      summary: Update workflow progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowBody"
      responses:
        "200":
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/triage:
    post:
      operationId: triageClaim
      tags: [claims]
      summary: Triage a "Needs Review" claim as non-issue or issue found
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageClaimBody"
      responses:
        "200":
          description: Claim triaged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/post-response-action:
    post:
      operationId: postResponseAction
      tags: [claims]
      summary: Execute a post-response action after receiving a payor response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostResponseActionBody"
      responses:
        "200":
          description: Action executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /error-types/analyze-sop:
    post:
      operationId: analyzeSOPText
      tags: [ai]
      summary: Analyze SOP text with AI to generate error type fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeSOPBody"
      responses:
        "200":
          description: SOP analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SOPAnalysisResult"

  /claims/{id}/generate-email:
    post:
      operationId: generateClaimEmail
      tags: [ai]
      summary: Generate dispute email via AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateEmailBody"
      responses:
        "200":
          description: Email generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"

  /claims/{id}/notes:
    get:
      operationId: listClaimNotes
      tags: [notes]
      summary: List notes for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteResponse"
    post:
      operationId: createClaimNote
      tags: [notes]
      summary: Create a note
