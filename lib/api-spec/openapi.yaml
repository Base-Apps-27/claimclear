              schema:
                type: object
                required: [claims, extras]
                properties:
                  claims:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimResponse"
                  extras:
                    type: object
                    description: |
                      Per-claim review-pane context, keyed by claim id (as a
                      string). Surfaces the data the queue-review UI needs
                      without forcing a second roundtrip per row.
                    additionalProperties:
                      $ref: "#/components/schemas/AttestationPendingExtras"

  /claims/attestation-pending/export-csv:
    get:
      operationId: exportAttestationPendingCsv
      tags: [attestation]
      summary: Export the attestation queue as CSV, honouring the active state + sort filters
      parameters:
        - name: state
          in: query
          description: Optional state narrowing; omit to export pending+queued (Open tab).
          schema:
            type: string
            enum: ["pending", "queued", "completed"]
        - name: sort
          in: query
          schema:
            type: string
            enum: ["service-asc", "service-desc"]
        - name: allFields
          in: query
          description: When true, include every column on the row object (raw dump)
          schema:
            type: boolean
        - name: filename
          in: query
          description: Caller-supplied filename (already filter-signed); server sanitises
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /claims/{id}/attest:
    post:
      operationId: attestClaim
      tags: [attestation]
      summary: Confirm the operator just re-attested in the payor portal (immediate flow)
      parameters:
        - name: id
