  /responses/record-portal:
    post:
      operationId: recordPortalResponse
      tags: [responses]
      summary: Record a response from the portal
      description: |
        Records a response captured by the portal scraper bot. The bot may
        optionally include the full message body (`rawContent`), the message
        `subject`, and the portal sender's `senderEmail` / `senderName` so
        reviewers can read the original payor message in the UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, responseType]
              properties:
                submissionId:
                  type: integer
                responseType:
                  type: string
                  enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
                content:
                  type: string
                  description: Short preview / summary of the portal response.
                rawContent:
                  type: string
                  description: Full body of the portal response, preserved verbatim for display.
                bodyFormat:
                  type: string
                  enum: [html, text]
                  description: |
                    Declares whether `rawContent`/`content` is HTML or plain text. When
                    `html`, the UI renders the response through a sanitizer so links,
                    emphasis, and lists survive. Defaults to `text` for backwards
                    compatibility with bots that have not been updated.
                subject:
                  type: string
                  description: Optional subject / title of the portal message.
                senderEmail:
                  type: string
                  description: Optional email address of the portal user that posted the response.
                senderName:
                  type: string
                  description: Optional display name of the portal user that posted the response.
                metadata:
                  type: object
      responses:
        '200':
          description: Recorded response
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseId:
                    type: integer
                  claimId:
                    type: integer

  /responses/stats:
