          deprecated: true
          description: "DEPRECATED (Wave C). Read `phase` instead. Still populated by writers during Wave C/D for backwards compatibility; dropped in Wave E."
        outcome:
          type: string
          enum: ["Pending", "Approved", "Denied", "Partially Approved", "Non-Issue", "Withdrawn", "No Action Needed"]
          deprecated: true
          description: "DEPRECATED (Wave C). Read `phase` (and child claims' `disposition`) instead. Still populated by writers during Wave C/D; dropped in Wave E."
        phase:
          type: string
          enum: ["triage", "ready_to_submit", "submitted", "response_received", "reviewed", "awaiting_reattestation", "closed"]
          description: "Canonical group-level phase in the hierarchical state model. Mirrors `invoice_groups.phase`. Sequential and monotonic forward through the lifecycle; constrains the set of valid child `disposition` values via the `validate_disposition_against_phase` deferrable trigger. Source: `@workspace/vocab` `INVOICE_PHASES`."
        closureReason:
          type: ["string", "null"]
          enum: ["denied_by_payor", "cannot_dispute", "non_issue", null]
        closureCategory:
          type: ["string", "null"]
        closureCategoryOther:
          type: ["string", "null"]
        closureRootCause:
          type: ["string", "null"]
        closureRootCauseOther:
          type: ["string", "null"]
        closureNarrative:
          type: ["string", "null"]
        closureAccountabilityTags:
          type: ["array", "null"]
          items:
            type: string
        closureAccountabilityOther:
          type: ["string", "null"]
        closureDrivers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureDispatchers:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ClosurePersonRef"
        closureCommunicatedTo:
          type: ["string", "null"]
        closureReviewState:
          type: ["string", "null"]
          enum: ["pending", "acknowledged", "needs_revisit", "resolved", null]
        closureResponsibility:
          oneOf:
            - $ref: "#/components/schemas/ClosureResponsibility"
            - type: "null"
          description: "Task #888 — five-value canonical responsibility recorded by the slim closure modal. Null on legacy rows."
        closureAddressedAt:
          type: ["string", "null"]
        closureAddressedBy:
          type: ["string", "null"]
        closureAddressedByEmail:
          type: ["string", "null"]
        closureReviewNotes:
          type: ["string", "null"]
        approvedAmount:
          type: ["string", "null"]
        rideCount:
          type: integer
        totalAmount:
          type: ["string", "null"]
        # workflow_progress JSONB column dropped (Task #195). The new
        # group-level lifecycle columns (lifecyclePhase, groupContext,
        # readyToSubmitAt, submittedAt, …) replace it; surfaced via the
        # contracts task.
        holdReason:
          type: ["string", "null"]
        holdPendingFrom:
          type: ["string", "null"]
        holdPlacedAt:
          type: ["string", "null"]
        triageNotes:
          type: ["string", "null"]
        triagedAt:
          type: ["string", "null"]
        disputeEmailSent:
          type: boolean
        disputeEmailSentAt:
          type: ["string", "null"]
        generatedEmailSubject:
          type: ["string", "null"]
        generatedEmailBody:
          type: ["string", "null"]
        generatedEmailAt:
          type: ["string", "null"]
        evidenceFiles:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/EvidenceFileRef"
          description: "Per-group attachment list. JSONB array of file references stored alongside the canonical `claim_evidence` rows; the bot worker reads both sources via `collectGroupEvidenceUrls`. Null on legacy rows with no attachments."
        evidenceNotes:
          type: ["string", "null"]
        evidenceChecklist:
          type: ["object", "null"]
          additionalProperties:
            type: boolean
          description: "Operator-tickable checklist mapping evidence-step name → checked. Stored as a `Record<string, boolean>` JSONB blob. No active reader today; declared as a typed map so future UI can read/write it without `as unknown` casts. Null = no checklist captured."
        payorEmail:
          type: ["string", "null"]
        # Lightweight payor-denial-reason signal (Task #321). Recorded by
        # the operator on the Responses Awaiting Review page when reviewing
        # a payor reply. Separate from the heavy `closure_*` columns above —
        # this is NOT a closure decision. The code is enforced by the API
        # against the union from `@workspace/payor-denial-reasons`; the DB
        # column is `text`.
        payorDenialReason:
          oneOf:
            - $ref: "#/components/schemas/PayorDenialReasonCode"
            - type: "null"
          description: "Last-recorded payor denial reason code, or null when none has been captured yet."
        payorDenialReasonNote:
          type: ["string", "null"]
          description: "Free-text note. Required when `payorDenialReason === 'payor_other'`; optional otherwise."
        payorDenialReasonAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamped each time the operator records (or re-records) a payor denial reason."
        payorDenialReasonBy:
          type: ["string", "null"]
        awaitingPayorAgainAt:
          type: ["string", "null"]
          format: date-time
          description: "Set when the operator clicks 'I replied — wait for payor again' on the Responses Awaiting Review page. Hides the row from that page until a newer inbound response arrives. Does NOT change `status`/`outcome`."
        importBatch:
          type: ["string", "null"]
        reattestRequired:
          type: boolean
          description: "True when the group must be re-attested in the MAS portal after per-leg verdict capture. Drives the MAS Action checklist's re-attest subsection."
        reattestCompletedAt:
          type: ["string", "null"]
          description: "Timestamp the operator confirmed the group-level re-attestation. Once set, the group transitions to `awaiting-payout`."
        reattestCompletedBy:
          type: ["string", "null"]
        reattestNote:
          type: ["string", "null"]
        macroPhase:
          type: ["string", "null"]
          enum: ["pre-submit", "in-flight", "response-pending", "mas-action-required", "awaiting-payout", "closed", "on-hold", null]
          deprecated: true
          description: "DEPRECATED (Wave C). Server-derived macro phase used by the per-invoice transition surfaces. Read the canonical `phase` column directly instead — this field is now a backwards-compat passthrough mapped from `phase`. Removed in Wave E."
        createdAt:
          type: string
        updatedAt:
          type: string
        earliestDate:
          type: ["string", "null"]
          description: "Earliest service date across the group's claims (MIN). Drives the filing deadline. Only populated by list endpoints."
        serviceDateReason:
          type: ["string", "null"]
          enum: [has_date, no_claims, no_dated_claims, parse_failed, all_dated_legs_excluded, null]
          description: |
            Labeled empty-state classifier for the Service Date column
            (Task #353). Drives the `<ServiceDateCell />` component on
            the list, group detail, and dashboard hero rows.
              * `has_date` — `earliestDate` is non-null; render the date
              * `no_claims` — no children attached
              * `no_dated_claims` — children exist, every `date` is blank
              * `parse_failed` — dated children but none parse (legacy
                shape; effectively unreachable since `claims.date` was
                promoted to a typed DATE column)
              * `all_dated_legs_excluded` — every dated leg is excluded
                or marked sibling-duplicate
            Populated by the list endpoint and the detail endpoint; null
            on payload shapes that don't compute it (e.g. PATCH echoes).
        effectiveDaysLeft:
          type: ["integer", "null"]
          description: "Calendar days until the effective filing deadline (weekend deadlines shift back to Friday). Null when no service date. Only populated by list endpoints."
        isUrgent:
          type: boolean
          description: "True when the effective filing deadline is today or earlier — must be filed today, cannot wait until tomorrow. Only populated by list endpoints."
        submittedStuck:
          type: boolean
          description: "Task #352. True when the group has been submitted (status is `Portal Queued`) but the effective filing deadline has slipped without an acknowledgement. Mutually exclusive with `isUrgent` at the group level (the pre-submit on-clock set and the post-submit stuck set don't overlap). The UI uses this flag to render the parallel \"stuck after submission\" badge variant. Only populated by list endpoints."
        # Group-level orchestration columns introduced by Task #195. Drive
        # the Aggregate Context, Understanding Readback, Generate Submission
        # Preview, and Re-attest steps in the per-invoice macro flow.
        groupContext:
          type: ["string", "null"]
          description: "DEPRECATED (Task #265). Legacy operator-authored narrative for the entire invoice group. New writes go to per-leg context + the editable AI draft below; field kept for one release for read-back compatibility."
        useDirectEmail:
          type: ["boolean", "null"]
          description: "Channel hint joined from the assigned errorType. True → submit via direct email; false/null → submit via portal. Drives the Submit button label and routing in the Queue submission preview."
        draftSubject:
          type: ["string", "null"]
          description: "Operator-edited subject line of the dispute write-up surfaced in the Submission preview pane. Sent as the portal/email subject on submit."
        draftDescriptionHtml:
          type: ["string", "null"]
          description: "Operator-edited HTML body of the dispute write-up surfaced in the Submission preview pane. Sent as the portal description / email body on submit."
        aiBaselineSubject:
          type: ["string", "null"]
          description: "Last raw AI-generated subject captured at draft regeneration. Used to detect operator edits."
        aiBaselineDescriptionHtml:
          type: ["string", "null"]
          description: "Last raw AI-generated HTML body captured at draft regeneration. Used to detect operator edits."
        draftAttribution:
          type: ["array", "null"]
          description: "Task #836. Per-paragraph source attribution for the AI-generated dispute write-up, in the same paragraph order as `aiBaselineDescriptionHtml`. Drives the small source chips rendered next to each paragraph on the Review & edit panel so the operator can trace any paragraph back to the SOP step, evidence file, or operator note that produced it. Overwritten in lockstep with the AI baseline on every preview-generated / draft regenerate run."
          items:
            type: object
            required: [paragraph, sourceKind]
            properties:
              paragraph:
                type: string
                description: "The paragraph text the chip is attached to (already stripped of the inline source tag the LLM emitted)."
              sourceKind:
                type: string
                enum: [sop, evidence, notes, composed]
                description: "Which kind of source the paragraph leans on. `sop` = a SOP walk step on a specific leg. `evidence` = an attached evidence file. `notes` = the operator's CRITICAL CONTEXT note. `composed` = an AI-synthesised connective paragraph with no single source."
              sourceRef:
                type: ["object", "null"]
                description: "Optional per-kind reference. For `sop`: `{ legId, question?, answer? }`. For `evidence`: `{ name }`. For `notes`/`composed`: null."
                properties:
                  legId:
                    type: ["integer", "null"]
                  question:
                    type: ["string", "null"]
                  answer:
                    type: ["string", "null"]
                  name:
                    type: ["string", "null"]
        draftEditedAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamped each time the operator saves an edit to the dispute draft."
        draftEditedBy:
          type: ["string", "null"]
        draftReviewedAt:
          type: ["string", "null"]
          format: date-time
          description: "Set when the operator marks the dispute draft as reviewed. Required before Submit is enabled."
        draftReviewedBy:
          type: ["string", "null"]
        draftReviewedByUserId:
          type: ["string", "null"]
          description: "User ID of the operator who marked the draft reviewed. Used to look up reviewedBy on the detail response."
        specialCircumstances:
          type: ["string", "null"]
          description: "Operator's free-text \"Understanding notes\" — the narrative-changing context that lands verbatim in the dispute write-up's CRITICAL CONTEXT block. Task #745 split this off `understandingReadback` so the verify-then-save gate can compare them."
        understandingReadback:
          type: ["string", "null"]
          description: "The AI's 2–4 sentence restatement of what the dispute is about, given `specialCircumstances` + per-leg findings + decision-tree outcome. Cleared when `specialCircumstances` changes (drift)."
        understandingReadbackForText:
          type: ["string", "null"]
          description: "The exact `specialCircumstances` text the most recent readback was generated for. Drift anchor — if it differs from the live `specialCircumstances`, the readback is stale and the UI must re-check."
        understandingReadbackAt:
          type: ["string", "null"]
          format: date-time
        understandingReadbackBy:
          type: ["string", "null"]
        previewGeneratedAt:
          type: ["string", "null"]
          format: date-time
          description: "Stamp of when the operator generated the dispute submission preview. Gates the transition to in-flight."
        previewGeneratedBy:
          type: ["string", "null"]
        legSubStatusCounts:
          type: ["object", "null"]
          description: "Per-leg sub-status breakdown for the group. Only populated by the list endpoint when the group's macro phase is `pre-submit`."
          properties:
            excluded:
              type: integer
            needs_classification:
              type: integer
            investigating:
              type: integer
            blocked:
              type: integer
            ready:
              type: integer
            dropped:
              type: integer
            duplicate:
              type: integer
              description: "Sibling Duplicate count — legs whose dispute rolls up to a primary leg in the same invoice (trip-overriding error)."
        eligibility:
          $ref: "#/components/schemas/InvoiceGroupEligibility"
        legCount:
          type: ["integer", "null"]
          description: |
            Task #753. Total number of legs (`claims`) attached to this
            group. Only populated by the list endpoint; equals the row
            count in the per-row leg fetch the handler already runs to
            compute `legSubStatusCounts`. Null on payload shapes that
            don't compute it (PATCH echoes, detail endpoint).
        primaryLeg:
          type: ["object", "null"]
          description: |
            Task #753. The leg the latest payor reply
            references when known (via `portal_responses.claim_id`),
            otherwise the earliest leg by id as a stable fallback. Used
            by the Responses Awaiting Review row meta line and the
            "Read the Reply" middle-column header to pair the invoice
            number with a single leg-of-record. Only populated by the
            list endpoint; null when the group has no legs.
          properties:
            id:
              type: integer
            confNumber:
              type: ["string", "null"]
          required:
            - id
      required:
        - id
        - invoiceNumber
        - status
        - outcome
        - phase
        - rideCount
        - disputeEmailSent
        - reattestRequired

    InvoiceGroupEligibilityFlag:
      type: object
      description: |
        One flag in `InvoiceGroupEligibility`. Reports whether the
        operator can run a particular bulk action on this row right now,
        and — when ineligible — a stable reason code that the client
        maps to a plain-English tooltip / skipped-toast string.
      properties:
        eligible:
          type: boolean
        reason:
          type: ["string", "null"]
          enum:
            - tour_sample
            - not_pre_submit
            - already_submitted
            - error_type_unset
            - not_reviewed
            - draft_empty
            - legs_unresolved
            - already_reviewed
            - not_packageable
            - terminal_phase
            - has_disputable_legs
            - no_survivors
            - has_survivors
            - already_closed
            - no_legs
            - no_eligible_legs
            - null
          description: "Stable reason code; null when `eligible === true`."
      required:
        - eligible
        - reason

    InvoiceGroupEligibility:
      type: object
      description: |
        Task #702 — server-enforced eligibility for the 5 bulk actions
        the invoice-group list rail exposes. Surfaced on every list row
        so the UI can show "Queue 5 of 100 selected" labels and grey
        out ineligible-selected rows BEFORE the operator clicks. Every
        bulk-* endpoint still re-checks server-side; this object is a
        UX hint, not the gate.
      properties:
        applyErrorType:
          $ref: "#/components/schemas/InvoiceGroupEligibilityFlag"
        submitToPortal:
          $ref: "#/components/schemas/InvoiceGroupEligibilityFlag"
        generateAndReview:
          $ref: "#/components/schemas/InvoiceGroupEligibilityFlag"
        reattest:
          $ref: "#/components/schemas/InvoiceGroupEligibilityFlag"
        close:
          $ref: "#/components/schemas/InvoiceGroupEligibilityFlag"
      required:
        - applyErrorType
        - submitToPortal
        - generateAndReview
        - reattest
        - close

    NeedsClassificationInboxClaim:
      type: object
      required: [id, confNumber, isBlank]
      properties:
        id:
          type: integer
        confNumber:
          type: string
        date:
          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        isBlank:
          type: boolean
          description: True when errorDetails is null/whitespace.

    NeedsClassificationInboxGroup:
      type: object
      required:
        - id
        - status
        - rideCount
        - needsClassificationCount
        - qualifyingSiblingCount
        - allBlank
        - claims
      properties:
        id:
          type: integer
        invoiceNumber:
          type: ["string", "null"]
        status:
          type: string
        rideCount:
          type: integer
        totalAmount:
          type: ["string", "null"]
        clientNumber:
          type: ["string", "null"]
        needsClassificationCount:
          type: integer
        qualifyingSiblingCount:
          type: integer
          description: Number of sibling legs already carrying an errorTypeId or non-empty errorDetails.
        allBlank:
          type: boolean
          description: True when no leg in this group has an errorTypeId or errorDetails — operator must triage by hand.
        claims:
          type: array
          items:
            $ref: "#/components/schemas/NeedsClassificationInboxClaim"

    NeedsClassificationInboxResponse:
      type: object
      required: [total, byStatus, groups]
      properties:
        total:
          type: integer
          description: Total needs_classification leg count across all surfaced groups.
        byStatus:
          type: object
          additionalProperties:
            type: integer
          description: |
            Per-status count of inbox rows (groups) so the header can show a
            breakdown like `5 Needs Review · 2 Generating Email · 1 Awaiting
            Response`. Keys are the parent group's status string. Entries
            are pre-sorted server-side by descending count then status name
            ascending, so the client can iterate in object order.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/NeedsClassificationInboxGroup"

    InvoiceGroupDetailResponse:
      allOf:
        - $ref: "#/components/schemas/InvoiceGroupResponse"
        - type: object
          properties:
            isPartial:
              type: boolean
              description: True when at least one leg is On Hold and at least one is not — the group is split, with part of it moving forward while part is parked.
            rides:
              type: array
              items:
                $ref: "#/components/schemas/ClaimResponse"
            submissions:
              type: array
              items:
                $ref: "#/components/schemas/PortalSubmissionResponse"
            notes:
              type: array
              items:
                $ref: "#/components/schemas/NoteResponse"
            auditLogs:
              type: array
              items:
                $ref: "#/components/schemas/AuditLogResponse"
            responses:
              type: array
              items:
                $ref: "#/components/schemas/PortalResponseItem"
            packagingReadiness:
              $ref: "#/components/schemas/GroupPackagingReadiness"
            reviewedBy:
              type: ["object", "null"]
              description: "Structured reviewer identity. Null for older groups that pre-date the userId column."
              properties:
                id:
                  type: string
                displayName:
                  type: string

    GroupPackagingReadiness:
      type: object
      description: >
        Readiness state for the "Ready to package" CTA on an invoice
        group. `ready=true` means the operator may POST to
        /invoice-groups/{id}/package right now; `ready=false` means
        the CTA should render disabled with `reason` as the tooltip.
        Counts are derived from leg-level state (sop_outcome,
        hold_reason). See artifacts/api-server/src/lib/group-packaging.ts.
      properties:
        ready:
          type: boolean
        reason:
          type: string
          description: Human-readable explanation; suitable for the disabled-CTA tooltip.
        unprocessedLegCount:
          type: integer
          description: Legs with sop_outcome=NULL that are not on hold.
        processedLegCount:
          type: integer
          description: Legs whose worktree concluded with a dispute outcome (portal_dispute|dispute).
        excludedLegCount:
          type: integer
          description: Legs whose worktree concluded as cannot_dispute or non_issue.
        heldLegCount:
          type: integer
          description: Legs currently on hold (per-leg hold_reason or sop_outcome=hold).
        totalLegCount:
          type: integer
        duplicateLegCount:
          type: integer
          description: Sibling-duplicate legs that point at a primary in this group.
        unresolvedDuplicateLegCount:
          type: integer
          description: Sibling-duplicate legs whose primary is NOT yet resolved (block the gate).
      required:
        - ready
        - reason
        - unprocessedLegCount
        - processedLegCount
        - excludedLegCount
        - heldLegCount
        - totalLegCount
        - duplicateLegCount
        - unresolvedDuplicateLegCount

    InvoiceGroupsListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceGroupResponse"
        total:
          type: integer
        today:
          type: string
          description: |
            Server-clock "today" key (`YYYY-MM-DD`, server local time)
            used to stamp per-row `isUrgent` / `effectiveDaysLeft`. The
            client compares this against the previously-seen value and
            invalidates deadline-driven query families on a mismatch, so
            urgency math refreshes on day rollover without a per-page
            midnight `setTimeout`.
        needsClassificationInbox:
          description: |
            Present only when the request included `?include=needs_classification`.
            Same payload shape as `GET /invoice-groups/needs-classification`.
          $ref: "#/components/schemas/NeedsClassificationInboxResponse"
      required:
        - groups
        - total
        - today

    CreateInvoiceGroupLeg:
      type: object
      description: |
        One leg (child claim) to attach to the new or existing invoice
        group. Mirrors the leg fields the importer writes — anything not
        supplied falls back to the same defaults as the import path.
      properties:
        confNumber:
          type: string
          description: Required. Trip confirmation number (the leg's primary identifier).
        date:
          type: ["string", "null"]
          description: ISO `YYYY-MM-DD` service date. Used to compute the 30-day filing deadline.
        refNumber:
          type: ["string", "null"]
        clientNumber:
          type: ["string", "null"]
        carNumber:
          type: ["string", "null"]
        errorDetails:
          type: ["string", "null"]
        claimAmount:
          type: ["string", "null"]
          description: Decimal-as-string ($USD), same shape as `claims.claim_amount`.
      required:
        - confNumber

    CreateInvoiceGroupBody:
      type: object
      properties:
        invoiceNumber:
          type: string
          description: |
            Invoice number for the new group. Must be unique across
            invoice_groups (DB-enforced) — collisions return 409 unless
            `attachToExistingId` is set.
        clientNumber:
          type: ["string", "null"]
          description: Optional group-level member/client number. If omitted, derived from the first leg that supplies one.
        payorEmail:
          type: ["string", "null"]
        legs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateInvoiceGroupLeg"
        attachToExistingId:
          type: ["integer", "null"]
          description: |
            When set, skip the new-group create path entirely and attach
            the supplied legs to this existing invoice group instead.
            Must reference a real group id; the server validates the
            id's `invoiceNumber` matches the body's `invoiceNumber` to
            guard against stale UI prompts.
      required:
        - invoiceNumber
        - legs

    CreateInvoiceGroupResponse:
      type: object
      properties:
        group:
          $ref: "#/components/schemas/InvoiceGroupResponse"
        createdLegIds:
          type: array
          items:
            type: integer
          description: Ids of the leg rows inserted by this request (excludes any pre-existing legs on an attach-to-existing call).
        attachedToExisting:
          type: boolean
          description: True when the request attached legs to an existing group instead of creating a new one.
      required:
        - group
        - createdLegIds
        - attachedToExisting

    InvoiceGroupConflictResponse:
      type: object
      description: |
        Returned with HTTP 409 when `POST /invoice-groups` is called for
        an `invoiceNumber` that already exists and the caller did not
        opt into attaching via `attachToExistingId`.
      properties:
        error:
          type: string
        existingGroup:
