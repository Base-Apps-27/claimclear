    ErrorTypeResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        guidance:
          type: ["string", "null"]
        recommendedActions:
          type: ["string", "null"]
        disputeReasonsLibrary:
          type: ["object", "null"]
        evidenceRequirements:
          type: ["object", "null"]
        decisionTree:
          type: ["object", "null"]
        emailTemplate:
          type: ["string", "null"]
        disputeInstructions:
          type: ["string", "null"]
        sourceSopText:
          type: ["string", "null"]
          description: |
            Task #784 — last plain-text SOP description the author pasted into
            the AI Builder. Persisted so the panel can rehydrate on next open
            instead of forcing the author to re-paste from notes.
        useGpsControlDeviation:
          type: boolean
          description: |
            When true, portal submissions for claims with this error type are
            routed to the MAS "GPS Control Deviation" Freshdesk form (which
            requires the GPS Breadcrumbs Available field). When false, they
            are routed to the generic "Other Issue or Question" form.
        useDirectEmail:
          type: boolean
          description: |
            When true, disputes for this error type bypass the MAS portal
            entirely and are sent as emails to the global "direct email
            recipient" address configured in app settings (intended for
            issue classes that MAS resolves over email rather than via the
            portal — e.g. "Attesting too Soon" or "Invoice Number not in
            System"). When true, useGpsControlDeviation is ignored.
        tripOverriding:
          type: boolean
          description: |
            When true, this error invalidates the entire trip (e.g.
            eligibility lapse, time-at-facility violation). Sibling legs
            on the same invoice can be marked as `Sibling Duplicate` of
            the leg carrying this error so the dispute isn't double-billed.
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - useGpsControlDeviation
        - useDirectEmail
        - tripOverriding

    CreateErrorTypeBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        guidance:
          type: string
        recommendedActions:
          type: string
        disputeReasonsLibrary:
          type: object
        evidenceRequirements:
          type: object
        decisionTree:
          type: object
        emailTemplate:
          type: string
        disputeInstructions:
