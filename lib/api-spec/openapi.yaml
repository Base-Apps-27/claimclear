        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/sop-advance:
    post:
      operationId: sopAdvanceLeg
      tags: [claims]
      summary: Advance one step of the SOP decision-tree walk
      description: |
        Validates the node and answer against the leg's loaded error-type tree.
        A non-terminal answer follows `childId`; a terminal answer stamps
        `sopOutcome` plus either `readyAt` (portal_dispute, dispute) or
        `dropReason` + `droppedAt` (cannot_dispute, non_issue). The `hold`
        outcome routes to the same `blocked` sub-status as a manual hold.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopAdvanceBody"
      responses:
        "200":
          description: SOP step recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/exclude:
    post:
      operationId: excludeLeg
      tags: [claims]
      summary: Exclude a leg from the dispute
      description: |
        Mark a `needs_classification` leg as "not a dispute candidate". The
        leg disappears from the dispute work queues but stays visible on the
        invoice as a clean line. Source-state contract:
        `deriveLegSubStatus(leg) === "needs_classification"`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcludeLegBody"
      responses:
        "200":
          description: Leg excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          description: Validation error (e.g. missing note when reason is "other")
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/include:
    post:
      operationId: includeLeg
      tags: [claims]
      summary: Re-include a previously excluded leg in the dispute
      description: |
        Re-include an excluded leg while the parent group is still in
        pre-submit. Two-stage source-state check: leg sub-status must be
        `excluded`, and `getGroupMacroPhase(parentGroup) === "pre-submit"`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludeLegBody"
      responses:
        "200":
          description: Leg re-included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation (leg state or group phase)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/reclassify:
    post:
      operationId: reclassifyLeg
      tags: [claims]
      summary: Rewind a leg back to `needs_classification`
      description: |
        Allowed from `investigating | ready | dropped | blocked`. Refused
        when the leg has already been included in any in-progress or
        submitted portal submission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leg reclassified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

  /claims/{id}/verdict:
    post:
      operationId: recordLegVerdict
      tags: [claims]
      summary: Record an AI-suggested or operator-confirmed verdict
      description: |
        The single sanctioned writer to `claim_verdict`. Operator confirmations
        also refresh denormalized `claims.outcome`, fire MAS-cancel
        derivations on `Denied`, and (when the parent group's
        `reattest_completed_at` is set) graduate Approved/Partial legs from
        `not_required` to `pending` for attestation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVerdictBody"
      responses:
        "200":
          description: Verdict recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimVerdictResponse"
        "409":
          description: Source-state contract violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateConflictResponse"

