    MyProcessedTodayCount:
      type: object
      description: |
        Personal "invoices processed today" counter for the streak pip on the
        sidebar avatar. The pip is private — only the requesting user's count
        is returned.
      properties:
        count:
          type: integer
          minimum: 0
          description: |
            Number of invoice groups the current user transitioned into the
            `Portal Queued` status (finished worktree, queued for portal
            submission) since the start of "today" in the supplied timezone.
        timezone:
          type: string
          description: |
            IANA timezone the count is anchored to (echoes back the validated
            request `tz`, or the server default if the client omitted/sent an
            invalid value).
        dayKey:
          type: string
          description: |
            YYYY-MM-DD calendar key for "today" in the resolved timezone.
            The client uses this to detect day rollover.
      required:
        - count
        - timezone
        - dayKey

    MyActivitySummary:
      type: object
      description: |
        Personal activity summary for the avatar hover card (Task #522).
        Headline stats + a 12-week per-day count series for the heatmap.
      properties:
        timezone:
          type: string
          description: IANA timezone the counts are bucketed in.
        dayKey:
          type: string
          description: |
            YYYY-MM-DD calendar key for "today" in the resolved timezone.
        today:
          type: integer
          minimum: 0
          description: Qualifying actions logged so far today.
        thisWeek:
          type: integer
          minimum: 0
          description: Qualifying actions Mon → today (inclusive).
        thisMonth:
          type: integer
          minimum: 0
          description: Qualifying actions since the 1st of the current month.
        streak:
          type: integer
          minimum: 0
          description: |
            Consecutive working-day streak (Mon–Fri). Weekend days are
            skipped — they neither continue nor break the streak. Today
            only counts when it has activity; an empty today does not
            break the prior run.
        dailyCounts:
          type: array
          description: |
            84 consecutive days ending today, oldest first. Days with
            no activity are present with `count: 0` so the front end
            does not have to gap-fill.
          items:
            type: object
            properties:
              date:
                type: string
                description: YYYY-MM-DD calendar date in the resolved timezone.
              count:
                type: integer
                minimum: 0
            required:
              - date
              - count
      required:
        - timezone
        - dayKey
        - today
        - thisWeek
        - thisMonth
        - streak
        - dailyCounts

    DashboardRepeatOffenders:
