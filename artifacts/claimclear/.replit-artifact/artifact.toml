kind = "web"
previewPath = "/"
title = "ClaimClear"
version = "1.0.0"
id = "artifacts/claimclear"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8080

[services.development]
run = "PORT=5173 BASE_PATH=/ pnpm --filter @workspace/claimclear run build --watch"

[services.production]
build = [ "pnpm", "--filter", "@workspace/claimclear", "run", "build" ]
publicDir = "artifacts/claimclear/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
