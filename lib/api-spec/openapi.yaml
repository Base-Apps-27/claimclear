    DashboardTimeseries:
      type: object
      properties:
        days:
          type: integer
        points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: ISO date (YYYY-MM-DD) at UTC midnight
              claimsCreated:
                type: integer
              claimsResolved:
                type: integer
              invoicesCreated:
                type: integer
                description: Distinct invoice groups whose `created_at` falls on this day.
              invoicesSubmitted:
                type: integer
                description: Distinct invoice groups whose status moved to `Portal Queued` on this day.
              invoicesResolved:
                type: integer
                description: Distinct invoice groups whose `group_resolved` / `group_denied` audit log was emitted on this day.
              invoicesReattested:
                type: integer
                description: Distinct invoice groups whose `reattest_completed_at` falls on this day. "Our work" series on the Insights data-flow chart — the moment we close the loop with the payor after a win.
              responsesReceived:
                type: integer
                description: Distinct invoice groups for which a `portal_responses.received_at` falls on this day. "Payor work" series — every received_at counts, not just positive verdicts.
              dollarsRecovered:
                type: number
                nullable: true
                description: Σ approvedAmount for groups whose POSITIVE portal response landed on this day. Anchored on `portal_responses.received_at`, not invoice_groups.updatedAt, so unrelated row touches don't smear the trend.
              priorDollarsRecovered:
                type: number
                nullable: true
                description: Recovered $ from the equivalent calendar slot in the prior equal-length window. Same `portal_responses.received_at` anchor as `dollarsRecovered`.
            required:
              - date
              - claimsCreated
              - claimsResolved
              - invoicesCreated
              - invoicesSubmitted
              - invoicesResolved
              - invoicesReattested
              - responsesReceived
              - dollarsRecovered
              - priorDollarsRecovered
      required:
        - days
        - points

    DashboardInsights:
      type: object
      description: |
        Server-side aggregations for the Insights page. Money totals
        and outcome rollups are anchored on the resolution moment
        (`phase = 'closed' AND phaseEnteredAt IN window`) so they
        answer "how did the disputes we closed this period turn out".
        Workload counts (`totalClaims`, `statusBreakdown`,
        `errorTypeBreakdown.count`, `payorBreakdown`) stay anchored on
        `created_at` because they answer the "what arrived this period"
        question. Money string fields are decimal-formatted with 2
        decimal places, or `null` for clerks who don't see amounts.
      properties:
        days:
          type: integer
        totalClaims:
          type: integer
          description: Exact count of claims with `created_at` inside the window (workload arrival, not resolution).
        totalClaimedAmount:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Σ invoice_groups.totalAmount over groups RESOLVED in the
            window AND outcome ∈ {Approved, Partially Approved, Denied,
            Withdrawn} — i.e. real disputes, excluding Pending /
            Non-Issue / No Action Needed. This is the recovery-rate
            denominator and mirrors `/dashboard/summary.amounts.disputedAmount`.
        totalRecoveredAmount:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Σ invoice_groups.approvedAmount over groups RESOLVED in the
            window AND outcome ∈ {Approved, Partially Approved}.
            Mirrors `/dashboard/summary.amounts.recoveredAmount`. Sub-line
            field `confirmedRecoveredAmount` carries the slice that has
            also completed re-attestation.
        confirmedRecoveredAmount:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Σ approvedAmount on resolved-in-window approvals whose
            payor re-attestation has actually completed
            (`reattestCompletedAt IS NOT NULL`). Mirrors the Dashboard
            "Confirmed" sub-line.
        closedInWindowCount:
          type: integer
          description: |
            Count of invoice groups that entered phase=closed inside
            the window — the universe behind every money/outcome
            number on this page. Surfaced so the operator knows the
            sample size driving the recovery-rate / outcome-mix tiles.
        closedInWindowAmount:
          oneOf:
            - type: string
            - type: "null"
          description: Σ totalAmount of `closedInWindowCount` groups.
        totalDeniedAmount:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Σ `claim_amount` across claims belonging to invoice groups
            RESOLVED in the active window (`phase=closed AND
            phaseEnteredAt IN window`) whose `outcome='Denied'`.
            Resolution-anchored so it lines up with `totalRecoveredAmount`
            and the closed-in-window outcome panel.
        statusBreakdown:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
            required: [status, count]
        outcomeBreakdown:
          type: array
          items:
            type: object
            properties:
              outcome:
                type: string
              count:
                type: integer
            required: [outcome, count]
        priorPeriodRecoveredAmount:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Σ invoice_groups.approvedAmount over groups RESOLVED in
            the equal-length window IMMEDIATELY PRECEDING the active
            one (`phase=closed AND phaseEnteredAt IN prior window`)
            with outcome ∈ {Approved, Partially Approved}. Powers the
            "Net change vs prior window" tile on the CFO Money
            scorecard. Resolution-anchored to mirror `totalRecoveredAmount`.
        atRiskAmount:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Snapshot (NOT windowed) of currently open invoice exposure:
            Σ (`invoice_groups.totalAmount` − `approvedAmount`) over
            invoice groups still in flight (outcome not Withdrawn /
            Non-Issue, deadline not missed, phase not closed OR a
            re-attestation is still pending). Mirrors the open-exposure
            predicate used by `/dashboard/summary.amounts.atRiskClaim`
            but at INVOICE grain.
        atRiskGroupCount:
          type: integer
          description: Count of invoice groups contributing to `atRiskAmount`.
        pipelineByPhase:
          type: array
          description: |
            Pipeline funnel — three SNAPSHOT phases of currently-open
            invoices (`pre-submit`, `in-flight`, `response-pending`)
            plus a fourth WINDOWED `closed` phase for funnel context.
            `pre-submit` folds in On-Hold groups; `response-pending`
            folds in MAS-required and awaiting-payout. `closed.count`
            and `closed.openAmount` equal `closedInWindowCount` /
            `closedInWindowAmount` respectively — surfaced inside the
            funnel so the operator can read "open now → closed in
            window" without leaving the chart, and surfaced as
            top-level fields so callers can render the windowed
            summary independently of the snapshot bars.
          items:
            type: object
            properties:
              phase:
                type: string
                enum: [pre-submit, in-flight, response-pending, closed]
              count:
                type: integer
              openAmount:
                oneOf:
                  - type: string
                  - type: "null"
                description: Σ `totalAmount` for invoices in this phase, or null for clerks.
            required: [phase, count, openAmount]
        payorConcentrationByGroup:
          type: array
          description: |
            Top 5 payors by open at-risk $ at INVOICE grain. Each row
            counts distinct invoice groups (not legs). The win-rate is
            scoped to invoices RESOLVED in the active window
            (`phase=closed AND phaseEnteredAt IN window`) so it tracks
            the decisions the payor handed back this period rather
            than the inbox of freshly arrived disputes.
          items:
            type: object
            properties:
              payorEmail:
                type: string
              openCount:
                type: integer
                description: Number of currently open invoices touching this payor.
              invoiceCountInWindow:
                type: integer
                description: Number of invoices RESOLVED in the active window touching this payor (denominator + numerator universe for `winRate`).
              openAtRiskAmount:
                oneOf:
                  - type: string
                  - type: "null"
                description: Σ open at-risk $ for this payor's currently open invoices.
              winRate:
                type: number
                nullable: true
                description: |
                  (Approved + Partially Approved) / (Approved +
                  Partially Approved + Denied), counted over invoices
                  RESOLVED in the active window (`phase=closed AND
                  phaseEnteredAt IN window`). `null` when no decided
                  invoices fall in the window.
            required: [payorEmail, openCount, invoiceCountInWindow, openAtRiskAmount, winRate]
        groupOutcomeBreakdown:
          type: array
          description: |
            Invoice-level (not claim-level) outcome rollup, computed
            from `invoice_groups.outcome` over groups RESOLVED in the
            window (`phase=closed AND phaseEnteredAt IN window`) so it
            answers "how did the disputes we closed this period turn
            out". Always returns the same seven buckets in this order:
            `Approved`, `Partially Approved`, `Denied`, `Withdrawn`,
            `Pending`, `Non-Issue`, `No Action Needed`. In practice the
            `Pending` bucket is empty because Pending groups have not
            yet hit phase=closed; it stays in the contract for shape
            stability.
          items:
            type: object
            properties:
              outcome:
                type: string
                enum: [Approved, Partially Approved, Denied, Withdrawn, Pending, Non-Issue, No Action Needed]
              count:
                type: integer
            required: [outcome, count]
        errorTypeBreakdown:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Error type label, or `"Unclassified"` for claims with no error type.
              count:
                type: integer
              recoveredAmount:
                oneOf:
                  - type: string
                  - type: "null"
                description: Settled-positive Σ approved for this error type.
              deniedAmount:
                oneOf:
                  - type: string
                  - type: "null"
                description: Σ claim_amount for outcome=Denied claims of this error type, scoped to claims belonging to invoice groups RESOLVED in the active window.
            required: [name, count, recoveredAmount, deniedAmount]
        payorBreakdown:
          type: array
          items:
            type: object
            properties:
              payorEmail:
                type: string
                description: Payor email, or `"Unassigned"` for claims with no payor.
              count:
                type: integer
              atRiskAmount:
                oneOf:
                  - type: string
                  - type: "null"
                description: Σ claim_amount for outcome=Denied claims at this payor.
            required: [payorEmail, count, atRiskAmount]
      required:
        - days
        - totalClaims
        - totalClaimedAmount
        - totalRecoveredAmount
        - confirmedRecoveredAmount
        - closedInWindowCount
        - closedInWindowAmount
        - totalDeniedAmount
        - priorPeriodRecoveredAmount
        - atRiskAmount
        - atRiskGroupCount
        - pipelineByPhase
        - payorConcentrationByGroup
        - statusBreakdown
        - outcomeBreakdown
        - groupOutcomeBreakdown
        - errorTypeBreakdown
        - payorBreakdown

    DashboardTimeInPhase:
      type: object
      description: |
        Time-in-phase histogram for the Insights page. Sourced from the
