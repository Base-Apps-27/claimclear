      tags: [claimEvidence]
      operationId: attachClosureEvidence
      summary: Attach an evidence item collected during a structured closure
      description: |
        Records evidence that staff uploaded as part of a Withdraw or Non-Issue
        closure flow. Tags the row with `closureScope` and the closure reason
        at the moment of attach so the audit trail captures exactly what was
        on file when the closure was filed. Supply exactly one of `claimId`
        or `invoiceGroupId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachClosureEvidenceBody'
      responses:
        '201':
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimEvidenceResponse'

  /responses:
    get:
      operationId: listResponses
      tags: [responses]
      summary: List portal/email responses
      parameters:
        - name: claimId
          in: query
          schema:
            type: integer
        - name: source
          in: query
          schema:
            type: string
            enum: [email, portal, manual]
        - name: processed
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  responses:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}:
    get:
      operationId: getResponse
      tags: [responses]
      summary: Get a single response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Response detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}/process:
    patch:
      operationId: processResponse
      tags: [responses]
      summary: Mark a response as processed and optionally update type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                responseType:
                  type: string
                  enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
                claimId:
                  type: integer
      responses:
        '200':
          description: Processed response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}/link:
    patch:
      operationId: linkResponse
      tags: [responses]
      summary: Manually link a response to a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimId]
              properties:
                claimId:
                  type: integer
      responses:
        '200':
          description: Linked response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /responses/{id}/reassign:
    post:
      operationId: reassignResponse
      tags: [responses]
      summary: Move a response to a different claim/group or mark it as unmatched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetClaimId:
                  type: integer
                targetGroupId:
                  type: integer
                unmatch:
                  type: boolean
      responses:
        '200':
          description: Reassigned response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponseItem'

  /claims/{id}/email-thread:
    get:
      operationId: getClaimEmailThread
      tags: [responses]
      summary: Get the merged inbound + outbound email thread for a claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Email thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadResponse'

  /claims/{id}/email-thread/{conversationId}/reply:
    post:
      operationId: replyToEmailConversation
      tags: [responses]
      summary: Send an in-app reply to an existing email conversation
      description: |
        Posts a reply to the latest message in the given Outlook conversation
        via Microsoft Graph's reply-to-message endpoint, persists an
        outbound_emails row synchronously, and writes an `email_reply_sent`
        audit row on the claim. The thread refreshes immediately without
        waiting for the next inbox poll.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, bodyText, to]
              properties:
                subject:
                  type: string
                bodyText:
                  type: string
                  description: Plain-text body. Sent as text/plain to Graph; line breaks preserved.
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
                evidenceIds:
                  type: array
                  items:
                    type: integer
                  description: |
                    Optional list of `claim_evidence` ids to attach to this reply.
                    The server validates that each id belongs to the same claim,
                    downloads the underlying file from object storage, and POSTs
                    each one to the Outlook draft as a `fileAttachment` before
                    sending. Total attachment payload must stay under the 3 MB
                    Graph inline cap.
      responses:
        '200':
          description: Reply sent — returns the persisted outbound row so the UI can optimistically render it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailThreadMessage'
        '400':
          description: Validation error or no recipients on file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Claim or conversation not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '502':
          description: Microsoft Graph rejected the send. Body is preserved client-side so staff can retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /responses/check-email:
    post:
      operationId: checkEmailResponses
      tags: [responses]
      summary: Trigger email inbox scan for responses
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hoursBack:
                  type: integer
                  default: 4
      responses:
        '200':
          description: Email check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCheckResult'

  /responses/record-portal:
    post:
      operationId: recordPortalResponse
      tags: [responses]
      summary: Record a response from the portal
      description: |
        Records a response captured by the portal scraper bot. The bot may
        optionally include the full message body (`rawContent`), the message
        `subject`, and the portal sender's `senderEmail` / `senderName` so
        reviewers can read the original payor message in the UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, responseType]
              properties:
                submissionId:
                  type: integer
                responseType:
                  type: string
                  enum: [approval, denial, partial_approval, info_request, acknowledgment, other]
                content:
                  type: string
                  description: Short preview / summary of the portal response.
                rawContent:
                  type: string
                  description: Full body of the portal response, preserved verbatim for display.
                bodyFormat:
                  type: string
                  enum: [html, text]
                  description: |
                    Declares whether `rawContent`/`content` is HTML or plain text. When
                    `html`, the UI renders the response through a sanitizer so links,
                    emphasis, and lists survive. Defaults to `text` for backwards
                    compatibility with bots that have not been updated.
                subject:
                  type: string
                  description: Optional subject / title of the portal message.
                senderEmail:
                  type: string
                  description: Optional email address of the portal user that posted the response.
                senderName:
                  type: string
                  description: Optional display name of the portal user that posted the response.
                metadata:
                  type: object
      responses:
        '200':
          description: Recorded response
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseId:
                    type: integer
                  claimId:
                    type: integer

